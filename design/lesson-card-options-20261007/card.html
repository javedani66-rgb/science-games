<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lesson card mockup</title>
<style>
@font-face{font-family:V;src:url(../../assets/fonts/Vazirmatn-Regular.woff2)}
@font-face{font-family:V;font-weight:700;src:url(../../assets/fonts/Vazirmatn-Bold.woff2)}
:root{--bg:#fffaf0;--ink:#2b3a2b;--gd:#2f6b4a;--line:#d9c9a3;--w:#b5472f;--e:#2f6b4a;--rope:#a8793f}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 V,sans-serif;background:var(--bg);color:var(--ink);padding:10px}
.card{border:3px solid var(--line);border-radius:18px;background:#fff8e6;padding:10px 10px 12px}
.tag{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tag b{color:var(--gd);font-size:17px}.tag span{font-size:12px;background:#e4f1e6;border:1px solid var(--gd);border-radius:999px;padding:1px 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fig{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 2px 6px;text-align:center}
.fig h3{font-size:14px;color:var(--gd)}svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:14px;justify-content:center;margin:8px 0 2px;font-size:13px}
.lg i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-left:4px}
.say{margin-top:8px;font-weight:700;font-size:16px;text-align:center;line-height:1.7}
.sub{font-size:13px;text-align:center;color:#5a5a46;margin-top:4px}
.eq{direction:ltr;unicode-bidi:isolate;font-family:V;font-size:18px;text-align:center;margin:6px 0 2px;letter-spacing:.5px}
.num{font-weight:700;font-size:15px}
</style><body>
<div class="card" id="c"></div>
<script>
const b=+new URLSearchParams(location.search).get('b')||1;
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function arrow(x,y,len,dir,col,w=4){ // dir 1 down, -1 up ; tip at y+dir*len
 const ty=y+dir*len,h=7;return `<line x1="${x}" y1="${y}" x2="${x}" y2="${ty-dir*h}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x-6},${ty-dir*h} ${x+6},${ty-dir*h} ${x},${ty}" fill="${col}"/>`}
const lab=(x,y,t,col)=>`<text x="${x}" y="${y}" font-size="11" font-weight="700" text-anchor="middle" fill="${col}">${t}</text>`;
const showNum=b>=2;
const fixed=`<svg viewBox="0 0 150 190"><rect x="30" y="6" width="90" height="6" rx="3" fill="#6b5a3a"/>
<line x1="75" y1="12" x2="75" y2="24" stroke="#6b5a3a" stroke-width="4"/><circle cx="75" cy="40" r="16" fill="#f2c94c" stroke="#7a5b10" stroke-width="3"/><circle cx="75" cy="40" r="3" fill="#7a5b10"/>
<line x1="59" y1="40" x2="59" y2="120" stroke="var(--rope)" stroke-width="3"/><path d="M59 40 A16 16 0 0 1 91 40" fill="none" stroke="var(--rope)" stroke-width="3"/><line x1="91" y1="40" x2="91" y2="105" stroke="var(--rope)" stroke-width="3"/>
<rect x="46" y="120" width="26" height="22" rx="4" fill="#9db7a0" stroke="#4b6a50" stroke-width="2"/>
${arrow(59,146,30,1,'var(--w)')}${arrow(91,105,30,1,'var(--e)')}
${lab(59,184,showNum?'بار ۴':'بار','var(--w)')}${lab(91,151,showNum?'کشیدن ۴':'کشیدن','var(--e)')}</svg>`;
const moving=`<svg viewBox="0 0 150 190"><rect x="20" y="6" width="110" height="6" rx="3" fill="#6b5a3a"/>
<line x1="60" y1="12" x2="60" y2="100" stroke="var(--rope)" stroke-width="3"/>
<line x1="96" y1="12" x2="96" y2="20" stroke="#6b5a3a" stroke-width="4"/><circle cx="96" cy="32" r="12" fill="#f2c94c" stroke="#7a5b10" stroke-width="3"/><circle cx="96" cy="32" r="2.5" fill="#7a5b10"/>
<path d="M84 32 A12 12 0 0 1 108 32" fill="none" stroke="var(--rope)" stroke-width="3"/><line x1="108" y1="32" x2="108" y2="105" stroke="var(--rope)" stroke-width="3"/>
<line x1="84" y1="32" x2="84" y2="100" stroke="var(--rope)" stroke-width="3"/>
<circle cx="72" cy="104" r="12" fill="#f2c94c" stroke="#7a5b10" stroke-width="3"/><circle cx="72" cy="104" r="2.5" fill="#7a5b10"/>
<line x1="72" y1="116" x2="72" y2="124" stroke="var(--rope)" stroke-width="3"/>
<rect x="59" y="124" width="26" height="22" rx="4" fill="#9db7a0" stroke="#4b6a50" stroke-width="2"/>
${arrow(72,150,30,1,'var(--w)')}${arrow(108,105,15,1,'var(--e)')}
${arrow(60,82,15,-1,'var(--e)',3)}${arrow(84,82,15,-1,'var(--e)',3)}
${lab(72,188,showNum?'بار ۴':'بار','var(--w)')}${lab(112,138,showNum?'کشیدن ۲':'کشیدن','var(--e)')}</svg>`;
const sets={
1:{band:'پایهٔ ۱ و ۲',say:'چرخِ ثابت جهتِ کشیدن را عوض می‌کند.<br>چرخِ متحرک کشیدن را سبک‌تر می‌کند.',sub:'',eq:''},
2:{band:'پایهٔ ۳ و ۴',say:'با چرخِ متحرک، نیروی کشیدن نصف می‌شود.',sub:'اما باید طناب را دو برابر بکشی.',eq:''},
3:{band:'پایهٔ ۵ و ۶',say:'دو رشتهٔ طناب بار را نگه می‌دارند.',sub:'n = شمار رشته‌های حامل بار؛ با فرضِ طنابِ سبک و بدون اصطکاک',eq:'F = W / n &nbsp;&nbsp; s = n × h'}};
const s=sets[b];
document.getElementById('c').innerHTML=`<div class="tag"><b>قرقره</b><span>${s.band}</span></div>
<div class="pair"><div class="fig"><h3>ثابت</h3>${fixed}</div><div class="fig"><h3>ثابت + متحرک</h3>${moving}</div></div>
<div class="lg"><span><i style="background:var(--w)"></i>وزنِ بار</span><span><i style="background:var(--e)"></i>نیروی کشیدن</span></div>
<div class="say">${s.say}</div>${s.eq?`<div class="eq">${s.eq}</div>`:''}${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
</script>
