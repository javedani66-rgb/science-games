</div><button class="back cursor-interaction">برگردیم به نقشه</button><div class="result" aria-live="polite"></div></div>
<script>
(()=>{
const root=document.getElementById('harbor-themed');
const cards=Object.fromEntries([...root.querySelectorAll('.route')].map(c=>[c.dataset.route,c]));
let order=['red','orange','green'],confirmed=false,moving=false,pending=null,revealTimer=null;
const texts={green:['تور رو با طناب بکش بالا!','تو می‌تونی؛ بزن بریم!'],orange:['بار رو بکش بالا!','یه کم سخته؛ پایه‌ای؟!'],red:['اژدر رو بکش بالا!','ببینم از پسش برمیای؟!']};
const ease=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t;
function content(){order.forEach((key,i)=>{const c=cards[key],front=i===2;c.querySelector('.words').textContent=texts[key][front&&confirmed?1:0];c.querySelector('.go').hidden=!(front&&confirmed);c.querySelector('.title').setAttribute('aria-pressed',front?'true':'false');});}
function place(){order.forEach((key,i)=>{const c=cards[key];c.style.zIndex=i+1;c.style.transform=`translateY(${i*64}px) scale(1)`;c.style.filter=i===2?'none':'saturate(.62) brightness(.82)';c.style.boxShadow='0 11px 15px #0009,0 2px 0 #ffebac99 inset';});content();}
function pick(key){
if(moving){pending=key;return;}
root.querySelector('.result').textContent='';
if(order[2]===key){
if(confirmed)return;
const c=cards[key],copy=c.querySelector('.copy');
confirmed=true;content();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
const oldCopy=copy.cloneNode(true);oldCopy.querySelector('.words').textContent=texts[key][0];oldCopy.querySelector('.go').hidden=true;oldCopy.setAttribute('aria-hidden','true');oldCopy.style.pointerEvents='none';c.querySelector('.mission').appendChild(oldCopy);
oldCopy.animate([{opacity:1},{opacity:0}],{duration:260,easing:'ease-in-out'}).onfinish=()=>oldCopy.remove();
copy.animate([{opacity:0},{opacity:1}],{duration:260,easing:'ease-in-out'});
}
return;}
Object.values(cards).forEach(c=>{c.querySelectorAll('.copy').forEach((copy,i)=>{copy.getAnimations().forEach(a=>a.cancel());if(i>0)copy.remove();});});
confirmed=false;content();
const old=[...order],next=order.filter(k=>k!==key).concat(key);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){order=next;place();return;}
moving=true;let begin;
const ghost=cards[key].cloneNode(true);
ghost.removeAttribute('data-route');ghost.setAttribute('aria-hidden','true');
ghost.querySelectorAll('button').forEach(b=>b.disabled=true);
ghost.style.pointerEvents='none';ghost.style.zIndex='10';ghost.style.opacity='0';
root.querySelector('.deck').appendChild(ghost);
function frame(now){if(begin===undefined)begin=now;const t=Math.min(1,(now-begin)/650),e=ease(t),lift=Math.sin(Math.PI*t);
Object.entries(cards).forEach(([k,c])=>{
const a=old.indexOf(k),b=next.indexOf(k),selected=k===key;
let y=mix(a*64,b*64,e);

const scale=1;
const side=selected?22*Math.sin(Math.PI*t):0;
c.style.transform=`translate(${side}px,${y}px) scale(${scale})`;
c.style.zIndex=a+1;
if(selected){const blend=ease(Math.max(0,Math.min(1,(t-.22)/.56)));
c.style.opacity=String(1-blend);ghost.style.opacity=String(blend);
ghost.style.transform=c.style.transform;
}
const sat=mix(a===2?1:.62,b===2?1:.62,e),bright=mix(a===2?1:.82,b===2?1:.82,e);
c.style.filter=`saturate(${sat}) brightness(${bright})`;
c.style.boxShadow=`0 ${11+(selected?3*lift:0)}px ${15+(selected?4*lift:0)}px #0009,0 2px 0 #ffebac99 inset`;
if(selected){ghost.style.filter=c.style.filter;ghost.style.boxShadow=c.style.boxShadow;}
});
if(t<1)requestAnimationFrame(frame);else{order=next;moving=false;cards[key].style.opacity='1';place();ghost.remove();if(pending){const k=pending;pending=null;pick(k);}}
}
requestAnimationFrame(frame);
}
Object.entries(cards).forEach(([key,c])=>{c.querySelector('.title').onclick=()=>pick(key);c.querySelector('.art').onclick=()=>pick(key);c.querySelector('.go').onclick=()=>{root.querySelector('.result').textContent='چالش انتخاب شد؛ انتقال به بازی در نمونهٔ بعدی بررسی می‌شود.'};});
root.querySelector('.back').onclick=()=>{root.querySelector('.result').textContent='انتقال به نقشه در نمونهٔ بعدی بررسی می‌شود.'};place();
})();
</script>
