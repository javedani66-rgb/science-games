<div id="sg-motion-complete" class="viz-dotted-background" dir="rtl">
<style>
#sg-motion-complete{padding:20px 0;font-family:Vazirmatn,Tahoma,sans-serif}#sg-motion-complete *{box-sizing:border-box}#sg-motion-complete .screen{position:relative;margin:auto;width:min(100%,380px);height:710px;border-radius:30px;overflow:hidden;background:#f6f0dd;box-shadow:0 10px 30px #182c3630;color:#264237}#sg-motion-complete button{font:inherit;cursor:inherit}#sg-motion-complete .map{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 25%,#88b36a 0 12%,transparent 13%),radial-gradient(ellipse at 75% 67%,#9bb779 0 20%,transparent 21%),linear-gradient(135deg,#e5d7ad 30%,#91c4c6 31% 57%,#e3d1a0 58%);transition:opacity 420ms ease}#sg-motion-complete .map h3{text-align:center;margin-top:48px;font-size:24px}#sg-motion-complete .harbor{position:absolute;top:46%;left:27%;width:46%;min-height:76px;border:3px solid #ad7d32;border-radius:22px;background:#fff0c7;color:#244b42;font-size:22px;box-shadow:0 5px 0 #87612e}#sg-motion-complete .route{position:absolute;width:60%;height:40%;top:25%;left:15%;border:4px dashed #846b45;border-radius:50%;transform:rotate(-25deg);opacity:.4}#sg-motion-complete .collection{position:absolute;inset:38px 20px 64px;opacity:0;transform:translateY(24px);pointer-events:none;transition:transform 420ms cubic-bezier(.2,.75,.25,1),opacity 420ms ease}#sg-motion-complete .collection img{display:block;width:100%;height:100%;object-fit:contain}#sg-motion-complete .back{position:absolute;bottom:14px;left:17%;width:66%;height:45px;background:#ffedbd;border:2px solid #ad7d32;border-radius:20px;color:#493619}#sg-motion-complete .ready{position:absolute;bottom:9%;left:12%;width:76%;height:14%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#fff0ce;border-radius:13px;color:#214e36;opacity:0;transition:opacity 260ms ease;pointer-events:none}#sg-motion-complete .ready button{width:68%;min-height:48px;margin-top:8px;color:#fff1cf;background:#176b3e;border:3px solid #c99535;border-radius:13px}#sg-motion-complete .mission-hit{position:absolute;bottom:9%;left:12%;width:76%;height:14%;border:0;background:transparent;color:transparent}#sg-motion-complete .game{position:absolute;inset:0;opacity:0;pointer-events:none;background:#bbdedb;transition:opacity 320ms ease}#sg-motion-complete .game .scene{height:80%;background:linear-gradient(#a9d9ed 0 40%,#1f938d 40% 73%,#b89b64 73%);position:relative}#sg-motion-complete .boat{position:absolute;top:48%;left:20%;width:60%;height:75px;border-radius:10px 10px 70px 70px;background:#27734c;border:8px solid #edce81}#sg-motion-complete .mast{position:absolute;bottom:100%;left:50%;width:7px;height:150px;background:#695a35}#sg-motion-complete .game p{position:absolute;top:48px;width:100%;text-align:center;font-size:22px}#sg-motion-complete .game button{display:block;margin:20px auto;padding:12px 24px;border:2px solid #ad7d32;background:#ffedbd;border-radius:20px;color:#493619}#sg-motion-complete[data-state="cards"] .map{opacity:.18}#sg-motion-complete[data-state="cards"] .collection{opacity:1;transform:translateY(0);pointer-events:auto}#sg-motion-complete[data-state="game"] .map{opacity:0}#sg-motion-complete[data-state="game"] .game{opacity:1;pointer-events:auto}#sg-motion-complete[data-state="game"] .collection{transform:none;transition:opacity 320ms ease}#sg-motion-complete .collection.leaving{transition:transform 300ms ease,opacity 300ms ease}#sg-motion-complete .collection.is-ready .ready{opacity:1;pointer-events:auto}#sg-motion-complete .collection.is-ready .mission-hit{pointer-events:none}@media(max-width:400px){#sg-motion-complete .screen{height:650px}}@media(prefers-reduced-motion:reduce){#sg-motion-complete .collection,#sg-motion-complete .map,#sg-motion-complete .game,#sg-motion-complete .ready{transition-duration:1ms}}

#sg-motion-complete .collection{inset:30px 40px auto;aspect-ratio:725/1502;opacity:1;transform:none;transition:opacity 480ms ease;pointer-events:none}
#sg-motion-complete .slice{position:absolute;inset:0;background-image:var(--sg-reference);background-size:100% 100%;background-repeat:no-repeat;opacity:0;transform:translateY(32px);transition:opacity 500ms ease,transform 560ms cubic-bezier(.2,.75,.25,1)}
#sg-motion-complete .heading{clip-path:inset(0 0 85.4% 0);transform:translateY(-38px)}
#sg-motion-complete .rear{clip-path:inset(14.6% 0 76.8% 0)}
#sg-motion-complete .middle{clip-path:inset(23.2% 0 68.2% 0)}
#sg-motion-complete .front{clip-path:inset(31.8% 0 0 0)}
#sg-motion-complete[data-state="cards"] .collection{transform:none;pointer-events:auto}
#sg-motion-complete[data-state="cards"] .map{opacity:0;pointer-events:none}
#sg-motion-complete .map{transition:opacity 560ms ease}
#sg-motion-complete[data-state="cards"] .slice{opacity:1;transform:translateY(0)}
#sg-motion-complete[data-state="cards"] .heading{transition-delay:240ms}
#sg-motion-complete[data-state="cards"] .rear{transition-delay:650ms}
#sg-motion-complete[data-state="cards"] .middle{transition-delay:790ms}
#sg-motion-complete[data-state="cards"] .front{transition-delay:930ms}
#sg-motion-complete .back{opacity:0;pointer-events:none;transition:opacity 400ms ease}
#sg-motion-complete[data-state="cards"] .back{opacity:1;pointer-events:auto;transition-delay:1150ms}
#sg-motion-complete .collection.leaving .slice{opacity:1;transform:none;transition:none}
#sg-motion-complete[data-state="map"] .collection.leaving,#sg-motion-complete[data-state="game"] .collection{opacity:0;transform:none;transition:opacity 480ms ease}
#sg-motion-complete .collection.leaving .ready{opacity:0;transition:none}
#sg-motion-complete[data-state="game"] .game{transition-duration:480ms}
@media(max-width:350px){#sg-motion-complete .collection{left:30px;right:30px}}
@media(prefers-reduced-motion:reduce){#sg-motion-complete .slice,#sg-motion-complete .back{transition-duration:1ms;transition-delay:0ms}}

#sg-motion-complete .collection{transition:opacity 700ms ease}
#sg-motion-complete .slice{clip-path:none;inset:auto 0;opacity:0;transform:translateY(95px);background-size:100% 100%;transition:transform 1000ms cubic-bezier(.22,.08,.16,1),opacity 600ms ease}
#sg-motion-complete .heading{top:0;height:14.6%;transform:translateY(-48px);z-index:4;transition:transform 800ms cubic-bezier(.35,0,.15,1),opacity 650ms ease;background-image:var(--heading-image)}
#sg-motion-complete .rear{top:14.6%;height:68.2%;z-index:1;background-image:var(--rear-image)}
#sg-motion-complete .middle{top:23.2%;height:68.2%;z-index:2;background-image:var(--middle-image)}
#sg-motion-complete .front{top:31.8%;height:68.2%;z-index:3;background-image:var(--front-image)}
#sg-motion-complete .map{transition:opacity 700ms ease}
#sg-motion-complete[data-state="cards"] .heading{transition-delay:400ms}
#sg-motion-complete[data-state="cards"] .rear{transition-delay:1100ms}
#sg-motion-complete[data-state="cards"] .middle{transition-delay:1350ms}
#sg-motion-complete[data-state="cards"] .front{transition-delay:1600ms}
#sg-motion-complete[data-state="cards"] .back{transition-delay:2450ms}
#sg-motion-complete .ready,#sg-motion-complete .mission-hit{z-index:5;bottom:8%;height:12%}
#sg-motion-complete[data-state="map"] .collection.leaving,#sg-motion-complete[data-state="game"] .collection{transition:opacity 700ms ease}
@media(prefers-reduced-motion:reduce){#sg-motion-complete .slice{transition-duration:1ms;transition-delay:0ms}}

#sg-motion-complete.resetting .collection{transition:none!important;opacity:1!important}
#sg-motion-complete.resetting .slice{transition:none!important;opacity:0!important;transform:translateY(95px)!important}
#sg-motion-complete.resetting .heading{transform:translateY(-48px)!important}

#sg-motion-complete .artbridge{position:absolute;left:6%;width:88%;top:43.8%;height:40%;z-index:6;background-image:var(--scene-image);background-size:100% 100%;border-radius:14px;opacity:0;pointer-events:none}
#sg-motion-complete .game{z-index:8;background:#f6f0dd;transition:opacity 800ms ease}
#sg-motion-complete .game .scene{height:82%;background-image:var(--scene-image);background-size:cover;background-position:center;position:relative}
#sg-motion-complete .game .boat{display:none}
#sg-motion-complete .game p{top:24px;background:#fff0d4e8;color:#254f37;width:80%;left:10%;padding:10px;border-radius:16px;font-size:20px}
#sg-motion-complete[data-state="starting"] .collection{opacity:1;pointer-events:none;transform:none}
#sg-motion-complete[data-state="starting"] .map{opacity:0;pointer-events:none}
#sg-motion-complete[data-state="starting"] .slice{opacity:0;transform:none;transition:opacity 500ms ease;transition-delay:0ms}
#sg-motion-complete[data-state="starting"] .front{transition-duration:800ms}
#sg-motion-complete[data-state="starting"] .ready{opacity:0;pointer-events:none;transition:opacity 300ms ease}
#sg-motion-complete[data-state="starting"] .artbridge{animation:sg-bridge 1000ms linear both}
#sg-motion-complete[data-state="starting"] .game{opacity:1;pointer-events:none;transition:opacity 800ms ease 200ms}
#sg-motion-complete[data-state="game"] .game{transition:opacity 800ms ease}
#sg-motion-complete .returning .slice{transform:none;transition:opacity 800ms ease!important;transition-delay:0ms!important}
#sg-motion-complete .returning .ready{transition:opacity 800ms ease}
#sg-motion-complete.return-mode .back{transition-delay:0ms;transition-duration:800ms}
#sg-motion-complete[data-state="map"] .collection.leaving{transition-duration:800ms}
#sg-motion-complete .map{transition-duration:800ms}
#sg-motion-complete .start:active,#sg-motion-complete .start.pressed{transform:translateY(2px);filter:brightness(.92)}
#sg-motion-complete .map .harbor.highlight{animation:sg-highlight 900ms ease both}
@keyframes sg-bridge{0%,20%{opacity:1}100%{opacity:0}}
@keyframes sg-highlight{0%,100%{box-shadow:0 5px 0 #87612e}40%{box-shadow:0 5px 0 #87612e,0 0 25px 8px #f3d46d}}
@media(prefers-reduced-motion:reduce){#sg-motion-complete .artbridge{animation:none}#sg-motion-complete .game,#sg-motion-complete .returning .slice{transition-duration:1ms!important;transition-delay:0ms!important}}

#sg-motion-complete[data-state="starting"] .heading,#sg-motion-complete[data-state="starting"] .rear,#sg-motion-complete[data-state="starting"] .middle{transition:opacity 650ms ease 250ms;transform:none}
#sg-motion-complete[data-state="starting"] .front{transition:opacity 1000ms ease 900ms;transform:none}
#sg-motion-complete[data-state="starting"] .ready{transition:opacity 600ms ease 250ms}
#sg-motion-complete[data-state="starting"] .artbridge{animation:sg-bridge-slow 1900ms ease both}
#sg-motion-complete[data-state="starting"] .game{transition:opacity 1000ms ease 900ms}
#sg-motion-complete[data-state="starting"] .game p,#sg-motion-complete[data-state="starting"] .game .return{animation:sg-controls-in 1900ms ease both}
#sg-motion-complete[data-state="game"] .game p,#sg-motion-complete[data-state="game"] .game .return{opacity:1}
#sg-motion-complete.return-mode .game{transition:opacity 750ms ease}
#sg-motion-complete.return-mode[data-state="cards"] .heading{transition-delay:300ms}
#sg-motion-complete.return-mode[data-state="cards"] .rear{transition-delay:800ms}
#sg-motion-complete.return-mode[data-state="cards"] .middle{transition-delay:1050ms}
#sg-motion-complete.return-mode[data-state="cards"] .front{transition-delay:1300ms}
#sg-motion-complete.return-mode[data-state="cards"] .back{transition-delay:2000ms;transition-duration:400ms}
#sg-motion-complete.return-mode .ready{transition:opacity 500ms ease 1900ms}
#sg-motion-complete.return-mode .mission-hit{pointer-events:none}
#sg-motion-complete.return-mode[data-state="cards"] .collection.is-ready .ready{opacity:1}
@keyframes sg-bridge-slow{0%,45%{opacity:1}100%{opacity:0}}
@keyframes sg-controls-in{0%,76%{opacity:0}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){#sg-motion-complete[data-state="starting"] .artbridge,#sg-motion-complete[data-state="starting"] .game p,#sg-motion-complete[data-state="starting"] .game .return{animation:none}#sg-motion-complete.return-mode[data-state="cards"] .slice{transition-delay:0ms;transition-duration:1ms}}

#sg-motion-complete.resetting .ready{opacity:0!important;transition:none!important}
#sg-motion-complete .artbridge{display:none!important}
#sg-motion-complete .screen{isolation:isolate}
#sg-motion-complete .map{z-index:0}
#sg-motion-complete .game{z-index:1;transition:opacity 650ms ease}
#sg-motion-complete .collection{z-index:3}
#sg-motion-complete .back{z-index:4}
#sg-motion-complete .curtain{position:absolute;inset:0;z-index:2;background:#f6f0dd;opacity:0;pointer-events:none;transition:opacity 700ms ease}
#sg-motion-complete[data-state="cards"] .curtain{opacity:1;transition-delay:0ms}
#sg-motion-complete[data-state="starting"] .curtain{opacity:0;transition:opacity 1100ms ease 450ms}
#sg-motion-complete[data-state="exiting"] .curtain{opacity:0;transition:opacity 1100ms ease 350ms}
#sg-motion-complete[data-state="starting"] .collection,#sg-motion-complete[data-state="exiting"] .collection{opacity:1;pointer-events:none;transform:none;transition:none}
#sg-motion-complete[data-state="starting"] .heading{opacity:0;transform:translateY(-100px);transition:transform 1000ms cubic-bezier(.4,0,.7,1),opacity 900ms ease;transition-delay:180ms}

<div class="screen" aria-label="نقشه، انتخاب چالش، ورود به بازی و بازگشت">
<div class="map"><h3>نقشهٔ ماجراجویی</h3><div class="route"></div><button class="harbor cursor-interaction" type="button">بندر</button></div>
<div class="curtain" aria-hidden="true"></div><div class="collection"><div class="slice heading" role="img" aria-label="عنوان و آیکون بندر"></div>
<div class="slice rear" role="img" aria-label="کارت شکار اژدر"></div>
<div class="slice middle" role="img" aria-label="کارت اسکلهٔ دزدان دریایی"></div>
<div class="slice front" role="img" aria-label="کارت اسکلهٔ ماهیگیری"></div>
<button class="mission-hit cursor-interaction" type="button" aria-label="آمادهٔ شروع شو">آمادهٔ شروع شو</button><div class="artbridge" aria-hidden="true"></div><div class="ready"><span>تو می‌تونی؛ بزن بریم!</span><button class="start cursor-interaction" type="button">بزن بریم!</button></div></div>
<button class="back cursor-interaction" type="button" hidden>برگردیم به نقشه</button>
<div class="game"><div class="scene"><p>اسکلهٔ ماهیگیری</p><div class="boat"><div class="mast"></div></div><div class="net-result" aria-hidden="true"></div></div><div class="finish-actions"><button class="finish-success cursor-interaction" type="button">تور رو بکش بالا</button><button class="finish-failure cursor-interaction" type="button">نمایش تلاش ناموفق</button></div>
<div class="result-panel" role="dialog" aria-modal="false" aria-labelledby="sg-result-title" aria-hidden="true">
<h3 id="sg-result-title">تور رو آوردی بالا!</h3>
<p class="result-caption">یه بار دیگه بازی کنیم یا برگردیم به کارت‌ها؟</p>
<button class="retry cursor-interaction" type="button">دوباره بازی کنیم</button>
<button class="return cursor-interaction" type="button">برگردیم به کارت‌ها</button>
</div>
</div>
</div>
<script>
(()=>{
const r=document.getElementById('sg-motion-complete'),c=r.querySelector('.collection'),b=r.querySelector('.back'),start=r.querySelector('.start'),harbor=r.querySelector('.harbor');let busy=false;r.dataset.state='map';
const set=(state,ms)=>{if(busy)return;busy=true;r.dataset.state=state;b.hidden=state!=='cards';setTimeout(()=>busy=false,ms)};
const enter=(fromGame)=>{if(busy)return;busy=true;harbor.classList.remove('highlight');r.classList.toggle('return-mode',fromGame);c.classList.remove('returning','leaving');if(!fromGame)c.classList.remove('is-ready');r.classList.add('resetting');void c.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>{r.classList.remove('resetting');busy=false;set('cards',fromGame?2400:2850)}))};
harbor.onclick=()=>enter(false);
b.onclick=()=>{if(busy)return;busy=true;b.classList.add('pressed');r.dataset.state='exiting';setTimeout(()=>b.classList.remove('pressed'),100);setTimeout(()=>{r.dataset.state='map';b.hidden=true;busy=false},1150)};
r.querySelector('.mission-hit').onclick=()=>{if(!busy)c.classList.add('is-ready')};
start.onclick=()=>{if(busy)return;busy=true;r.classList.remove('return-mode');start.classList.add('pressed');setTimeout(()=>{start.classList.remove('pressed');b.hidden=true;r.dataset.state='starting';setTimeout(()=>{r.dataset.state='game';busy=false},1900)},150)};
r.querySelector('.return').onclick=()=>enter(true);
})();
(()=>{
const r=document.getElementById('sg-motion-complete'),panel=r.querySelector('.result-panel'),title=r.querySelector('#sg-result-title'),caption=r.querySelector('.result-caption'),retry=r.querySelector('.retry');let locked=false;
const clear=()=>{r.classList.remove('result-visible','result-ending','restarting');panel.setAttribute('aria-hidden','true');locked=false};
const finish=success=>{if(locked||r.dataset.state!=='game')return;locked=true;r.dataset.outcome=success?'success':'failure';title.textContent=success?'تور رو آوردی بالا!':'این بار نشد؛ دوباره امتحان کنیم؟';caption.textContent=success?'یه بار دیگه بازی کنیم یا برگردیم به کارت‌ها؟':'';caption.hidden=!success;retry.textContent=success?'دوباره بازی کنیم':'دوباره امتحان کنیم';r.classList.add('result-ending');setTimeout(()=>{if(r.dataset.state!=='game'){clear();return}r.classList.add('result-visible');panel.setAttribute('aria-hidden','false');setTimeout(()=>{retry.focus({preventScroll:true})},700)},success?1100:800)};
r.querySelector('.finish-success').onclick=()=>finish(true);r.querySelector('.finish-failure').onclick=()=>finish(false);
retry.onclick=()=>{
if(r.classList.contains('restarting'))return;
retry.classList.add('pressed');
panel.style.transform=getComputedStyle(panel).transform;
r.classList.add('restarting');panel.setAttribute('aria-hidden','true');
setTimeout(()=>retry.classList.remove('pressed'),100);
const done=()=>{
const net=r.querySelector('.net-result');
panel.style.opacity='0';panel.style.transition='none';
net.style.opacity='0';net.style.transition='none';
r.dataset.outcome='';clear();
void panel.offsetWidth;
requestAnimationFrame(()=>{
panel.style.removeProperty('opacity');panel.style.removeProperty('transition');panel.style.removeProperty('transform');
net.style.removeProperty('opacity');net.style.removeProperty('transition');
r.querySelector('.finish-success').focus({preventScroll:true});
});
};
setTimeout(done,600);
};

new MutationObserver(()=>{if(r.dataset.state!=='game'&&r.dataset.state!=='starting')clear()}).observe(r,{attributes:true,attributeFilter:['data-state']});
})();

</script>
</div>
