    <circle id="emblem-slot" cx="426" cy="116" r="81" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect id="label-slot" x="299" y="200" width="254" height="69" rx="26" fill="none" stroke="currentColor" stroke-width="2"/>
    <g id="land-ornament-slot"/>
    <g id="location-glyph-slot"/>
    <text id="location-name-slot" x="426" y="246" text-anchor="middle" direction="rtl" font-family="Lalezar, sans-serif">نام محیط</text>
  </g>
</svg>
