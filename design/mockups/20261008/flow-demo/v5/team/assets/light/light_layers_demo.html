<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>light layers demo</title>
<style>/* خودکار از zone_tokens.json (build_light.py). فقط روشن/غروب/شب + رنگ‌ها. بدون blend و بدون filter زنده. نور: بالا-چپ، در هر سه نور ثابت. */
:root{
  --c-cream: #fff4d2;
  --c-deep-violet: #3a2a7a;
  --c-line: #241a5e;
  --c-line-night: #0d0426;
  --c-teal: #2fb8a8;
  --c-danger-violet: #8a4fd0;
  --c-pink: #d070c0;
  --c-card-bg: #190539;
  --c-card-text-bg: #12243a;
  --c-shelf: #2a1f5c;
  --c-accent-yellow: #ffd23f;
  --c-white: #ffffff;
  --c-badge-line-day: #0d0426;
  --hard-easy: #28853f;
  --hard-mid: #e08a1e;
  --hard-hard: #c4262e;
  --z-sports-base: #7fbf4a;
  --z-sports-shade: #66993b;
  --z-sports-patch: #a6d86a;
  --z-sports-night: #a6d86a;
  --z-sports-ring: #ffd23f;
  --z-sports-ring-outline: 4.5px;
  --z-space-base: #7a5cd0;
  --z-space-shade: #5c459c;
  --z-space-patch: #9a7ee0;
  --z-space-night: #9a7ee0;
  --z-space-ring: #ffd23f;
  --z-space-ring-outline: 4.5px;
  --z-farm-base: #d6c98a;
  --z-farm-shade: #aba16e;
  --z-farm-patch: #ece2ae;
  --z-farm-night: #ece2ae;
  --z-farm-ring: #ffd23f;
  --z-farm-ring-outline: 10px;
  --z-city-base: #5b7390;
  --z-city-shade: #44566c;
  --z-city-patch: #7a93ae;
  --z-city-night: #5fa8d6;
  --z-city-ring: #ffd23f;
  --z-city-ring-outline: 4.5px;
  --water-sea: #1f87b8;
  --water-river: #3fb6e0;
  --water-river-lip: #1f87b8;
  --water-foam: #ffffff;
  --ice-rim: #eaf8ff;
  --ice-body: #a3d5ea;
  --ice-crack: #6ab7d8;
  --ice-cloud: #ffffff;
  --path-cream: #fff4d2;
  --path-outline: #241a5e;
  --path-boardwalk: #c98a45;
  --line-6: 6px; --line-4-5: 4.5px; --line-2-6: 2.6px; --line-1-2: 1.2px;
  --light-dir: top-left; --light-transition: 1.2s;
  /* پیش‌فرض = روز */
  --l-sky0: #9fdcf2;
  --l-sky1: #d6f1ee;
  --l-sky2: #d6f1ee;
  --l-water: #1f87b8;
  --l-lit: #fff4cf;
  --l-shade: #4a3a8c;
  --l-line: #241a5e;
  --l-build: #e9e4d6;
  --l-pier: #c6c1b6;
  --l-lit-a: 0.5; --l-shade-a: 0.3; --l-nlit-a: 0.3; --l-nshade-a: 0.22;
  --l-windows: transparent; --l-windows-opacity: 0;
  --l-shadow-color: #10083a; --l-shadow-opacity: 0.28; --l-shadow-dx: 8px; --l-shadow-dy: 6px;
}
[data-light="day"]{
  --l-sky0: #9fdcf2;
  --l-sky1: #d6f1ee;
  --l-sky2: #d6f1ee;
  --l-water: #1f87b8;
  --l-lit: #fff4cf;
  --l-shade: #4a3a8c;
  --l-line: #241a5e;
  --l-build: #e9e4d6;
  --l-pier: #c6c1b6;
  --l-windows: transparent; --l-windows-opacity: 0;
  --l-shadow-color: #10083a; --l-shadow-opacity: 0.28; --l-shadow-dx: 8px; --l-shadow-dy: 6px;
  --l-lit-a: 0.5; --l-shade-a: 0.3; --l-nlit-a: 0.3; --l-nshade-a: 0.22;
}
[data-light="dusk"]{
  --l-sky0: #6a3fa0;
  --l-sky1: #e0728a;
  --l-sky2: #f2a65a;
  --l-water: #3679a8;
  --l-lit: #ffd48a;
  --l-shade: #5b3490;
  --l-line: #241a5e;
  --l-build: #f3d9c0;
  --l-pier: #e0a874;
  --l-windows: transparent; --l-windows-opacity: 0;
  --l-shadow-color: #3a1f6a; --l-shadow-opacity: 0.35; --l-shadow-dx: 14px; --l-shadow-dy: 7px;
  --l-lit-a: 0.75; --l-shade-a: 0.4; --l-nlit-a: 0.5; --l-nshade-a: 0.35;
}
[data-light="night"]{
  --l-sky0: #1c1460;
  --l-sky1: #2a1f7a;
  --l-sky2: #2a1f7a;
  --l-water: #245090;
  --l-lit: #d8e6ff;
  --l-shade: #190539;
  --l-line: #aab4f0;
  --l-build: #aab4f0;
  --l-pier: #6f78c8;
  --l-windows: #ffd86b; --l-windows-opacity: 1;
  --l-shadow-color: #0d0426; --l-shadow-opacity: 0.4; --l-shadow-dx: 8px; --l-shadow-dy: 6px;
  --l-lit-a: 0.5; --l-shade-a: 0.45; --l-nlit-a: 0.35; --l-nshade-a: 0.4;
}
/* لایه‌های ثابت انتقال: هر لایه یک id (با پیشوند صفحه) و data-for؛ فقط opacity عوض می‌شود. روز←شب مستقیم 1.2ث. غروب میان‌یابی نیست. */
.lt-layer{opacity:0;transition:opacity var(--light-transition) ease-in-out}
[data-light="day"] .lt-layer[data-for~="day"],[data-light="dusk"] .lt-layer[data-for~="dusk"],[data-light="night"] .lt-layer[data-for~="night"]{opacity:1}
.lt-layer[data-for="windows"]{opacity:0}[data-light="night"] .lt-layer[data-for="windows"]{opacity:1}
@media (prefers-reduced-motion: reduce){.lt-layer{transition:none}}
/* شدت rim/سایهٔ بناهای env (کلاس‌های .elit/.esh در node_*.svg مقدار ثابت دارند؛ این‌ها آن‌ها را به نور وصل می‌کنند). شخصیت‌ها خودشان var(--l-lit-a) و var(--l-shade-a) می‌خوانند. */
[data-light] .elit{opacity:var(--l-nlit-a,.3)}
[data-light] .esh{opacity:var(--l-nshade-a,.22)}

/* حالت: <use class="ch-happy"> ؛ ژست (فقط b1): ch-pose-walk1 …؛ اندازه: cs-bust-82 …. متغیرها از مرز <use> رد می‌شوند. */
.ch-happy{--s-happy:inline;--s-thinking:none;--s-surprised:none;--s-oops:none;--s-calm:none}
.ch-thinking{--s-happy:none;--s-thinking:inline;--s-surprised:none;--s-oops:none;--s-calm:none}
.ch-surprised{--s-happy:none;--s-thinking:none;--s-surprised:inline;--s-oops:none;--s-calm:none}
.ch-oops{--s-happy:none;--s-thinking:none;--s-surprised:none;--s-oops:inline;--s-calm:none}
.ch-calm{--s-happy:none;--s-thinking:none;--s-surprised:none;--s-oops:none;--s-calm:inline}
.ch-pose-stand{--p-stand:inline;--p-walk1:none;--p-walk2:none;--p-jump:none;--p-point:none;--p-sit:none;--p-nojump:inline}
.ch-pose-walk1{--p-stand:none;--p-walk1:inline;--p-walk2:none;--p-jump:none;--p-point:none;--p-sit:none;--p-nojump:inline}
.ch-pose-walk2{--p-stand:none;--p-walk1:none;--p-walk2:inline;--p-jump:none;--p-point:none;--p-sit:none;--p-nojump:inline}
.ch-pose-jump{--p-stand:none;--p-walk1:none;--p-walk2:none;--p-jump:inline;--p-point:none;--p-sit:none;--p-nojump:none}
.ch-pose-point{--p-stand:none;--p-walk1:none;--p-walk2:none;--p-jump:none;--p-point:inline;--p-sit:none;--p-nojump:inline}
.ch-pose-sit{--p-stand:none;--p-walk1:none;--p-walk2:none;--p-jump:none;--p-point:none;--p-sit:inline;--p-nojump:inline}
/* اندازه: خط بیرونی/داخلی بر حسب واحد viewBox = px×H/اندازهٔ نمایش (جدول ۲-ج). سرشانه H=100، b1 تمام‌قد H=150 */
.cs-bust-140{--ow:3.2;--iw:1.9;--ow2:2.6;--bw:2.4}
.cs-bust-82{--ow:5.5;--iw:3.2;--ow2:3.4;--bw:3.6}
.cs-bust-64{--ow:5.5;--iw:3.1;--ow2:3.4;--bw:3.6}
.cs-bust-56{--ow:5.4;--iw:0;--ow2:5.4;--bw:5.4;--det:none}
.cs-full-140{--ow:4.8;--iw:2.8;--ow2:3.0;--bw:3.0}
.cs-full-110{--ow:6.1;--iw:3.5;--ow2:3.4;--bw:3.6}
.cs-full-82{--ow:8.2;--iw:4.7;--ow2:4.4;--bw:4.4}

*{box-sizing:border-box;margin:0}body{background:#e8e4f4;color:#241a5e;font:16px/1.7 Vazirmatn,system-ui,sans-serif;direction:rtl;padding:12px 16px 40px;max-width:430px;margin:auto}
h1{font-size:22px}h2{font-size:18px;margin:14px 0 6px}p{font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button,label.chk{min-height:48px;min-width:48px;padding:0 16px;border:2.6px solid #241a5e;border-radius:14px 6px 14px 6px;background:#fff4d2;color:#241a5e;font:700 16px Vazirmatn,sans-serif;display:inline-flex;align-items:center;gap:6px}
button:focus-visible{outline:3px solid #2fb8a8;outline-offset:2px}
section{border:4.5px solid #241a5e;border-radius:18px;padding:8px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}.c svg{width:100%;height:auto;display:block}
.ch{display:flex;justify-content:space-around;align-items:flex-end;margin-top:6px}
.off-rim .elit,.off-rim [id$="-lit"]{display:none}.off-shade .esh,.off-shade [id$="-shade"]{display:none}.off-win .ew{display:none}
</style></head><body>
