/* light/tokens.css */
/* خودکار از zone_tokens.json (build_light.py). فقط روشن/غروب/شب + رنگ‌ها. بدون blend و بدون filter زنده. نور: بالا-چپ، در هر سه نور ثابت. */
:root{
  --c-cream: #fff4d2;
  --c-deep-violet: #3a2a7a;
  --c-line: #241a5e;
  --c-line-night: #0d0426;
  --c-teal: #2fb8a8;
  --c-danger-violet: #8a4fd0;
  --c-pink: #d070c0;
  --c-card-bg: #190539;
  --c-card-text-bg: #12243a;
  --c-shelf: #2a1f5c;
  --c-accent-yellow: #ffd23f;
  --c-white: #ffffff;
  --c-badge-line-day: #0d0426;
  --hard-easy: #28853f;
  --hard-mid: #e08a1e;
  --hard-hard: #c4262e;
  --z-sports-base: #7fbf4a;
  --z-sports-shade: #66993b;
  --z-sports-patch: #a6d86a;
  --z-sports-night: #a6d86a;
  --z-sports-ring: #ffd23f;
  --z-sports-ring-outline: 4.5px;
  --z-space-base: #7a5cd0;
  --z-space-shade: #5c459c;
  --z-space-patch: #9a7ee0;
  --z-space-night: #9a7ee0;
  --z-space-ring: #ffd23f;
  --z-space-ring-outline: 4.5px;
  --z-farm-base: #d6c98a;
  --z-farm-shade: #aba16e;
  --z-farm-patch: #ece2ae;
  --z-farm-night: #ece2ae;
  --z-farm-ring: #ffd23f;
  --z-farm-ring-outline: 10px;
  --z-city-base: #5b7390;
  --z-city-shade: #44566c;
  --z-city-patch: #7a93ae;
  --z-city-night: #5fa8d6;
  --z-city-ring: #ffd23f;
  --z-city-ring-outline: 4.5px;
  --water-sea: #1f87b8;
  --water-river: #3fb6e0;
  --water-river-lip: #1f87b8;
  --water-foam: #ffffff;
  --ice-rim: #eaf8ff;
  --ice-body: #a3d5ea;
  --ice-crack: #6ab7d8;
  --ice-cloud: #ffffff;
  --path-cream: #fff4d2;
  --path-outline: #241a5e;
  --path-boardwalk: #c98a45;
  --line-6: 6px; --line-4-5: 4.5px; --line-2-6: 2.6px; --line-1-2: 1.2px;
  --light-dir: top-left; --light-transition: 1.2s;
  /* پیش‌فرض = روز */
  --l-sky0: #9fdcf2;
  --l-sky1: #d6f1ee;
  --l-sky2: #d6f1ee;
  --l-water: #1f87b8;
  --l-lit: #fff4cf;
  --l-shade: #4a3a8c;
  --l-line: #241a5e;
  --l-build: #e9e4d6;
  --l-pier: #c6c1b6;
  --l-lit-a: 0.5; --l-shade-a: 0.3; --l-nlit-a: 0.3; --l-nshade-a: 0.22;
  --l-windows: transparent; --l-windows-opacity: 0;
  --l-shadow-color: #10083a; --l-shadow-opacity: 0.28; --l-shadow-dx: 8px; --l-shadow-dy: 6px;
}
[data-light="day"]{
  --l-sky0: #9fdcf2;
  --l-sky1: #d6f1ee;
  --l-sky2: #d6f1ee;
  --l-water: #1f87b8;
  --l-lit: #fff4cf;
  --l-shade: #4a3a8c;
  --l-line: #241a5e;
  --l-build: #e9e4d6;
  --l-pier: #c6c1b6;
  --l-windows: transparent; --l-windows-opacity: 0;
  --l-shadow-color: #10083a; --l-shadow-opacity: 0.28; --l-shadow-dx: 8px; --l-shadow-dy: 6px;
  --l-lit-a: 0.5; --l-shade-a: 0.3; --l-nlit-a: 0.3; --l-nshade-a: 0.22;
}
[data-light="dusk"]{
  --l-sky0: #6a3fa0;
  --l-sky1: #e0728a;
  --l-sky2: #f2a65a;
  --l-water: #3679a8;
  --l-lit: #ffd48a;
  --l-shade: #5b3490;
  --l-line: #241a5e;
  --l-build: #f3d9c0;
  --l-pier: #e0a874;
  --l-windows: transparent; --l-windows-opacity: 0;
  --l-shadow-color: #3a1f6a; --l-shadow-opacity: 0.35; --l-shadow-dx: 14px; --l-shadow-dy: 7px;
  --l-lit-a: 0.75; --l-shade-a: 0.4; --l-nlit-a: 0.5; --l-nshade-a: 0.35;
}
[data-light="night"]{
  --l-sky0: #1c1460;
  --l-sky1: #2a1f7a;
  --l-sky2: #2a1f7a;
  --l-water: #245090;
  --l-lit: #d8e6ff;
  --l-shade: #190539;
  --l-line: #aab4f0;
  --l-build: #aab4f0;
  --l-pier: #6f78c8;
  --l-windows: #ffd86b; --l-windows-opacity: 1;
  --l-shadow-color: #0d0426; --l-shadow-opacity: 0.4; --l-shadow-dx: 8px; --l-shadow-dy: 6px;
  --l-lit-a: 0.5; --l-shade-a: 0.45; --l-nlit-a: 0.35; --l-nshade-a: 0.4;
}
/* لایه‌های ثابت انتقال: هر لایه یک id (با پیشوند صفحه) و data-for؛ فقط opacity عوض می‌شود. روز←شب مستقیم 1.2ث. غروب میان‌یابی نیست. */
.lt-layer{opacity:0;transition:opacity var(--light-transition) ease-in-out}
[data-light="day"] .lt-layer[data-for~="day"],[data-light="dusk"] .lt-layer[data-for~="dusk"],[data-light="night"] .lt-layer[data-for~="night"]{opacity:1}
.lt-layer[data-for="windows"]{opacity:0}[data-light="night"] .lt-layer[data-for="windows"]{opacity:1}
@media (prefers-reduced-motion: reduce){.lt-layer{transition:none}}
/* شدت rim/سایهٔ بناهای env (کلاس‌های .elit/.esh در node_*.svg مقدار ثابت دارند؛ این‌ها آن‌ها را به نور وصل می‌کنند). شخصیت‌ها خودشان var(--l-lit-a) و var(--l-shade-a) می‌خوانند. */
[data-light] .elit{opacity:var(--l-nlit-a,.3)}
[data-light] .esh{opacity:var(--l-nshade-a,.22)}

/* ui/ui_tokens.css */
/* ui_tokens.css (ui-artist v5). مشخصات CSS دکمه/چیپ/برگه/پلاک؛ رنگ‌ها از light/tokens.css (این فایل پس از آن بیاید).
   خط: L4.5 دکمه/چیپ/کاشی/برگه، L2.6 پلاک/ورودی/آیکون/قرص، L1.2 تزئین. نور بالا-چپ؛ فشردن = لبه 6←2 بدون جابه‌جایی. بدون filter/blend. */
:root{
  --ui-line:#241a5e; --ui-cream:#fff4d2; --ui-violet:#3a2a7a; --ui-teal:#2fb8a8; --ui-pink:#d070c0; --ui-danger:#8a4fd0;
  --ui-night-bg:#190539; --ui-night-edge:#2fb8a8;
  --ui-ink-disabled:#4a4268;--ui-pink-lip:#9a4a90; --ui-disabled-bg:#d9d3e8;
  --ui-r-big:18px; --ui-r-small:7px; --ui-l45:4.5px; --ui-l26:2.6px; --ui-l12:1.2px; --ui-lip:6px; --ui-lip-pressed:2px;
  --ui-touch:48px; --ui-gap:8px; --ui-gutter:16px;

.ui-btn{--bg:var(--ui-teal);--lipc:color-mix(in srgb,var(--bg) 62%,#241a5e);--ink:var(--ui-line);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;

.ui-cut{--cut:10px;--b:4.5px;--cutbg:var(--ui-cream);position:relative;isolation:isolate;border:0;background:var(--ui-line);box-shadow:none;margin-block-end:0;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}

.body::-webkit-scrollbar{display:none}
.bi{inline-size:28px;block-size:28px;flex:none}
.bi.sm{inline-size:24px;block-size:24px}
.wide{inline-size:100%}
/* ---- نوار بالا (≤72px؛ همه‌جا ۶۴) ---- */
.tb{flex:none;block-size:64px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 10px;position:relative;z-index:5}
[data-world=day] .tb{background:var(--ui-cream);border-block-end:var(--ui-l45) solid var(--ui-line)}
[data-world=night] .tb{background:var(--ui-night-bg);border-block-end:var(--ui-l26) solid var(--ui-night-edge)}
.tb h1{margin:0;flex:1;min-inline-size:0;text-align:center;font:400 24px/1.15 var(--ui-font-title);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
[data-world=night] .tb h1{color:var(--ui-cream);text-shadow:0 0 10px rgba(95,168,214,.7)}
.tbsp{flex:1}
.tb .ui-btn{margin-block-end:0;padding:0 12px;gap:6px;flex:none;min-block-size:48px}
.tb .ui-btn--sec{padding:0 14px}
.tb .ui-chips{flex:1;min-inline-size:0;gap:6px}
.tb .ui-chip{margin-block-end:6px;min-inline-size:70px;border-width:var(--ui-l26)}
.tb .ui-chip[aria-pressed=true]{border-width:var(--ui-l45)}
/* ---- نقشه ---- */
.mapbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain;scrollbar-width:none;background:var(--z-sports-base)}
.mapbody::-webkit-scrollbar{display:none}
.map{position:relative;--s:1}
.mapart{display:block;inline-size:100%;block-size:auto}
.mov{position:absolute;inset:0;pointer-events:none}
.mn{position:absolute;pointer-events:auto;background:transparent;border-radius:14px;min-inline-size:48px;min-block-size:48px}
.mn:focus-visible{outline:4px solid var(--ui-cream);box-shadow:0 0 0 8px var(--ui-violet)}
.ml{translate:var(--dx,0px) var(--dy,0px);position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;inline-size:max-content;max-inline-size:176px;z-index:2}
.ml .ui-plate{white-space:normal;text-align:center;line-height:1.35;min-block-size:28px;padding:2px 12px}
.pi{display:inline-block;inline-size:20px;block-size:20px;vertical-align:-5px;margin-inline-end:4px}
.ui-plate--lock{--cutbg:var(--ui-violet);color:var(--ui-cream);font-size:15px}
.ui-plate--here{--cutbg:var(--ui-cream);font-size:16px}
.ui-plate--fogs{--cutbg:var(--ui-cream)}
.ui-plate--teal{--cutbg:var(--ui-teal)}
.guide{position:absolute;inline-size:56px;block-size:82px;margin-inline-start:-28px;pointer-events:none;z-index:4}
.guide svg{inline-size:56px;block-size:82px;overflow:visible}
.mestrip{flex:none;block-size:56px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;position:relative;z-index:4;background:var(--ui-cream);border-block-end:var(--ui-l26) solid var(--ui-line)}
.me{min-block-size:48px;margin-block-end:0;filter:none}
.me.off{opacity:.55}
.mn.flash{animation:v5pop .6s 1}
.pend{margin:0;padding:12px 14px;text-align:center;font-weight:700;font-size:17px}
/* ---- محیط (شب) ---- */
.envbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;scrollbar-width:none}
.envbody::-webkit-scrollbar{display:none}
.envbanner{display:none;flex:none;inline-size:100%;block-size:112px;overflow:hidden;margin-block-end:8px;border-block-end:var(--ui-l26) solid var(--ui-night-edge)}
@media(min-height:760px){.envbanner{display:block}}
.envbanner svg{inline-size:100%;block-size:100%}
.cd-top{display:none}
.cd-bot{flex:none;block-size:56px;display:flex;align-items:center;padding:0 16px;box-sizing:border-box;inline-size:100%}
.cd-bot .ui-btn{inline-size:100%}
.cd-stack{padding-block-start:0}
:root{--cd-front-h:404px}
.cd-front .cd-sentence{inset-inline-start:28px;inset-inline-end:134px;block-size:70px;inset-block-start:250px}
.cd-front .cd-go{inset-block-start:330px;inset-inline-start:28px;inset-inline-end:134px}
.cd-bot .ui-btn{white-space:nowrap}
@media(max-height:700px){:root{--cd-front-h:386px}.cd-front .cd-sentence{inset-block-start:246px;block-size:66px}.cd-front .cd-go{inset-block-start:318px}}
.cd-front .cd-guide{inset-block-start:auto;inset-block-end:14px;inset-inline-end:22px;inline-size:100px;block-size:150px;z-index:3}
.cd-strip:focus-visible,.cd-front:focus-visible{outline-offset:-4px}
.cd-art-ph{display:block;inline-size:100%;block-size:100%}
.tapnote{margin:4px 16px 0;text-align:center;font-weight:700;font-size:14px;color:var(--ui-cream);opacity:.9}
/* ---- صحنه ---- */
.scn .mission{background:var(--ui-night-bg);color:var(--ui-cream);border-block-end:var(--ui-l26) solid var(--ui-night-edge)}
.mission{flex:none;padding:6px 12px;text-align:center;font-weight:700;font-size:17px;line-height:1.5;background:var(--ui-cream);border-block-end:var(--ui-l26) solid var(--ui-line);min-block-size:44px;display:flex;align-items:center;justify-content:center}
.scenebox{position:relative;flex:1;min-height:0;background:#d6f1ee}
.scenebox>svg{position:absolute;inset:0;inline-size:100%;block-size:100%}
.scenebox .ph{position:absolute;inset-inline:16px;bottom:14px;background:var(--ui-cream);border:var(--ui-l26) solid var(--ui-line);border-radius:10px;font-weight:700;font-size:16px;text-align:center;padding:8px 10px}
.mkc{position:absolute;inset-inline:12px;top:10px;z-index:3;font-size:14px;background:rgba(255,244,210,.95);border:var(--ui-l26) dashed var(--ui-line);border-radius:8px;padding:3px 8px;line-height:1.5;text-align:center}
.toast{position:absolute;inset-inline:24px;top:42%;background:var(--ui-cream);border:var(--ui-l45) dashed var(--ui-line);border-radius:14px;padding:10px 12px;font-weight:700;text-align:center;z-index:5;animation:v5fade .25s}
.ssheet{flex:none;border-radius:0;padding:10px 12px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-inline:0}
.ssheet::before{display:none}
.ssheet .ui-btn{margin-block-end:0;min-inline-size:0;padding:0 8px;font-size:16px;inline-size:100%}
.ssheet .ui-btn[aria-pressed=true]{--cutbg:var(--ui-teal)}
.ssheet .ui-btn.pull{grid-column:1/-1;margin-block-end:6px;inline-size:100%}
/* ---- کارت درس (شب) ---- */
#cv{position:absolute;inset:0;z-index:50;pointer-events:none}
#cv .cscrim{position:absolute;inset:0;background:rgba(13,4,38,.8);pointer-events:auto;animation:v5fade .25s both}
.cbig{position:absolute;inset:8px 10px 96px;perspective:1400px;pointer-events:auto;transform-origin:0 0;color:var(--ui-cream)}
.cflip{position:relative;inline-size:100%;block-size:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.35,0,.25,1)}
.cflip.back{transform:rotateY(180deg)}
.cface{position:absolute;inset:0;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--ui-night-bg);border-radius:20px}
.cface.bk{transform:rotateY(180deg)}
.cflip.back .cface:not(.bk){visibility:hidden;transition:visibility 0s .25s}
.cflip:not(.back) .cface.bk{visibility:hidden;transition:visibility 0s .25s}
.cface>.cd-frame{position:absolute;inset:0;inline-size:100%;block-size:100%;z-index:0}
.cface>*:not(.cd-frame){position:relative;z-index:1}
.chd{flex:none;margin:26px 22px 0;block-size:60px;position:relative;display:flex;align-items:center;justify-content:center;text-align:center}
.chd>svg{position:absolute;inset:0;inline-size:100%;block-size:100%;z-index:0}
.chd .tt{position:relative;z-index:1;padding:0 12px;line-height:1.05}
.chd h2{margin:0;font:400 24px/1.05 var(--ui-font-title);color:var(--ui-cream);text-shadow:0 0 10px var(--cd-zone),0 0 3px var(--cd-zone)}
.chd small{display:block;font:700 14px/1.2 var(--ui-font);color:var(--ui-cream);margin-block-start:2px}
.cbd{flex:1;min-block-size:0;overflow:auto;padding:12px 24px 8px;overscroll-behavior:contain;scrollbar-width:none}
.cbd::-webkit-scrollbar{display:none}
.cfoot{flex:none;padding:6px 24px 22px;display:flex;justify-content:center}
.cfoot .ui-btn{inline-size:100%}
.cbar{position:absolute;inset-inline:0;bottom:0;display:flex;gap:10px;padding:12px 12px 16px;box-sizing:border-box;background:var(--ui-night-bg);border-block-start:var(--ui-l26) solid var(--ui-night-edge);pointer-events:auto;z-index:2}
#cd-frame-inner,#cd-frame-neon{display:none}
.cbar .ui-btn{flex:1;min-inline-size:0;padding:0 8px;margin-block-end:0;font-size:16px;white-space:nowrap;gap:6px}
.cbar .ui-btn.ui-btn--sec{margin-block-end:0}
.tagl{display:inline-block;font-size:14px;font-weight:700;background:var(--ui-cream);color:var(--ui-line);border:var(--ui-l26) solid var(--ui-line);border-radius:999px;padding:1px 12px;margin-block-end:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fig{background:#d6f1ee;border:var(--ui-l45) solid var(--ui-line);border-radius:12px;padding:4px 2px 6px;text-align:center;color:var(--ui-line)}
.fig h3{margin:0;font:700 15px/1.3 var(--ui-font)}
.fig svg{inline-size:100%;block-size:auto}
.figl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:0 4px}
.figl .ui-plate{min-block-size:26px;padding:0 8px;font-size:14px}
.pl-w{--cutbg:var(--ui-pink);color:var(--ui-line)}
.pl-f{--cutbg:var(--ui-teal);color:var(--ui-line)}
.lg{display:flex;gap:14px;justify-content:center;margin:8px 0 2px;font-size:14px;flex-wrap:wrap;color:var(--ui-cream)}
.lg i{display:inline-block;inline-size:16px;block-size:10px;border-radius:2px;vertical-align:middle;margin-inline-end:4px;border:var(--ui-l12) solid var(--ui-line)}
.say{margin-block-start:8px;background:var(--cd-text-bg);border:var(--ui-l26) solid var(--ui-night-edge);border-radius:10px;padding:8px 10px;font-weight:700;font-size:16px;text-align:center;line-height:1.7;color:var(--ui-cream)}
.sub{font-size:14px;text-align:center;margin-block-start:6px;color:var(--ui-cream);opacity:.92;font-weight:700}
.eq{direction:ltr;unicode-bidi:isolate;font-size:19px;text-align:center;margin:6px 0 2px;letter-spacing:.5px;white-space:pre;font-weight:700}
.num{font-weight:700;font-size:15px}
.sec{margin:14px 0 0}.sec h2{font:400 20px/1.3 var(--ui-font-title);margin:0 0 6px;color:var(--ui-cream)}
.cbd .sec:first-child{margin-block-start:0}
.prob{background:var(--cd-text-bg);border:var(--ui-l26) solid var(--ui-night-edge);border-radius:12px;padding:10px}
.prob p.q{font-weight:700;font-size:16px;line-height:1.7;margin:10px 0 0}
.mini{max-inline-size:300px;margin:0 auto}
.opts{display:flex;flex-direction:column;gap:8px;margin-block-start:10px}
.opts .ui-btn{margin-block-end:0;inline-size:100%;justify-content:center}
.opts .ui-btn.ok{--cutbg:var(--ui-teal)}
.opts .ui-btn.no{--cutbg:#d9d3e8;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(74,66,104,.18) 6px 8px)}
.fb{margin-block-start:10px;font-weight:700;font-size:16px;min-block-size:26px}
.rel{display:flex;flex-direction:column;gap:16px;padding-block-end:10px}
.rel .ui-btn{min-block-size:52px;padding:6px 14px;font-size:16px;margin-block-end:0;inline-size:100%;justify-content:center;text-align:center;line-height:1.3}
.cdiag{display:flex;justify-content:center;padding:4px 0}
.cdiag svg{block-size:130px;inline-size:auto;aspect-ratio:360/200}
.t2s{position:absolute;inset-inline:24px;bottom:90px;z-index:6;background:var(--ui-cream);color:var(--ui-line);border:var(--ui-l45) dashed var(--ui-line);border-radius:14px;padding:10px 12px;font-weight:700;text-align:center;pointer-events:none;animation:v5fade .25s}
.pendbox{border:var(--ui-l26) dashed var(--ui-night-edge);border-radius:12px;padding:16px 12px;text-align:center;font-weight:700;font-size:16px;margin-block-start:10px}
/* ---- کارت‌دان (شب) ---- */
.jump{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none;background:var(--ui-night-bg);position:relative;z-index:4}
.jump::-webkit-scrollbar{display:none}
.jump .ui-btn{flex:none;min-inline-size:48px;padding:0 10px;margin-block-end:0;font-size:18px}
.jump .ui-btn.cur{--cutbg:var(--ui-teal)}
.shelf{padding:0 12px 84px;min-block-size:100%}
.shelf__sec{padding-block-start:6px}
.shelf__head{display:flex;align-items:center;gap:8px;padding:4px 0 2px}
.shelf__head .no{flex:none;display:grid;place-items:center;inline-size:36px;block-size:36px;background:var(--ui-cream);color:var(--ui-line);border:var(--ui-l26) solid var(--ui-line);font:400 20px/1 var(--ui-font-title);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.shelf__head .t-h{flex:1;min-inline-size:0;font:400 22px/1.25 var(--ui-font-title);color:var(--ui-cream);text-shadow:0 0 10px var(--cd-zone)}
.shelf__dots{display:flex;gap:4px;flex:none}
.dot{inline-size:12px;block-size:12px;border-radius:50%;border:2px solid var(--ui-cream);box-sizing:border-box;opacity:.7}
.dot--seen{background:var(--ui-violet);opacity:1}
.dot--got{background:var(--ui-teal);opacity:1}
.shelf__line{margin:0 2px 10px;font-size:14px;line-height:1.5;color:var(--ui-cream);opacity:.95}
.shelf__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block-end:6px}
.shelf__plank{display:block;inline-size:100%;block-size:auto;margin-block-end:14px}
.mc{position:relative;display:flex;flex-direction:column;inline-size:100%;min-block-size:176px;padding:10px 8px 10px;box-sizing:border-box;text-align:center;color:var(--ui-cream);font:700 14px/1.25 var(--ui-font);--mcbg:#190539}
.mc[data-s=seen]{--mcbg:#2fb8a8;color:#241a5e}.mc[data-s=packed]{--mcbg:#8a4fd0}.mc[data-s=locked]{--mcbg:#241056}
.mc>.bg{position:absolute;inset:0;inline-size:100%;block-size:100%}
.mc>*:not(.bg){position:relative}
.mc .th{display:block;inline-size:calc(100% - 10px);margin:2px auto 4px;aspect-ratio:60/44;border-radius:5px;overflow:hidden;background:var(--cd-zonebg,#2a1f5c)}
.mc .th svg{inline-size:100%;block-size:100%}
.mc .nm{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1.25;padding:2px 4px;margin:2px 2px;background:var(--mcbg);border-radius:6px}
.mc .stt{display:block;margin-block-start:2px;font-size:14px;background:var(--mcbg);border-radius:6px}
.mc .stt .ui-plate{min-block-size:24px;padding:0 4px;font-size:14px;white-space:nowrap}
@media(max-width:400px){.mc .stt .ui-plate .pi{display:none}}
.mc .newdot{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mc .lk{display:block;margin:4px auto 0}
.search{display:flex;gap:8px;padding:8px 12px;background:var(--ui-night-bg);position:relative;z-index:4}
.search input{flex:1;min-block-size:48px;border-radius:3px;border:var(--ui-l26) solid var(--ui-line);background:#fff;font:700 16px var(--ui-font);padding:0 12px;color:var(--ui-line)}
.shelf__empty{padding:24px 8px;text-align:center;font-weight:700}
/* ---- تمرین (شب) ---- */
.prac{padding:16px;text-align:center}
.prac p{font-size:18px;font-weight:700;margin:6px 0 16px;line-height:1.7;color:var(--ui-cream)}
.prac .prob{text-align:start}
.dock{flex:none;padding:8px 12px 12px;display:flex;gap:10px}
.dock .ui-btn{flex:1;min-inline-size:0;margin-block-end:0}
/* ---- برگه‌ها و روکش‌ها ---- */
#ov{position:absolute;inset:0;pointer-events:none;z-index:60}
#ov .scrim{position:absolute;inset:0;pointer-events:auto;background:rgba(36,26,94,.55);animation:v5fade .2s both}
#ov .sheet{position:absolute;inset-inline:0;bottom:0;max-block-size:92%;overflow:auto;pointer-events:auto;animation:v5sheet .25s ease-out both;scrollbar-width:none}
#ov .sheet::-webkit-scrollbar{display:none}
.sheet h3.st{margin:0 0 4px;font:400 26px/1.3 var(--ui-font-title)}
.sheet .ssub{margin:0 0 8px;font-size:16px;font-weight:700}
.sheet .srow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.sheet .btnrow{display:flex;gap:10px;margin-block-start:8px}
.sheet .btnrow .ui-btn{flex:1;min-inline-size:0;padding:0 12px;margin-block-end:6px}
.sheet .btnrow .ui-btn--sec{margin-block-end:0;align-self:flex-start}
.sheet .why{font-size:17px;font-weight:700;margin:4px 0 14px;line-height:1.6}
.diffrow{display:flex;gap:8px;justify-content:space-between;margin:8px 0 12px}
.diffrow span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;margin:18px 0 14px}
.tiles .ui-tile{inline-size:100%;max-inline-size:164px;justify-self:center;min-block-size:132px}
.tiles .ui-tile .ui-tile-art svg{inline-size:100%;block-size:100%}
.tiles .ui-tile{padding-block-start:70px}
.tiles .ui-newdot{position:absolute;inset-block-start:8px;inset-inline-start:8px}
.mrow{display:flex;gap:10px;margin-block-start:8px}
.mrow .ui-btn{flex:1;min-inline-size:0;padding:0 10px;margin-block-end:0}
.adults{display:flex;align-items:center;justify-content:center;gap:8px;inline-size:100%;margin-block-start:10px;min-block-size:48px;font-weight:700;font-size:16px;color:var(--ui-line)}
.hl{padding:8px 12px;border:var(--ui-l26) solid var(--ui-line);background:#fff;margin-block-end:8px;font-weight:700;font-size:16px;line-height:1.6;animation:v5fade .25s;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.hold{position:relative;inline-size:100%;overflow:hidden;touch-action:none;user-select:none;min-block-size:56px;font-size:17px;margin-block-end:6px}
.hold i{position:absolute;inset:0;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:right;transition:transform 0s}
.hold.on i{transform:scaleX(1);transition:transform 2s linear}
.hold span{position:relative}
.vl{display:flex;flex-direction:column;gap:8px}
.vl div{border:var(--ui-l26) solid var(--ui-line);padding:8px 12px;background:#fff;font-size:15px;font-weight:700}
.vl small{display:block;font-size:14px;font-weight:400;opacity:.9}
.gtabs{display:flex;gap:6px;margin-block-end:10px}
.gtabs .ui-btn{flex:1;min-inline-size:0;padding:0 4px;font-size:15px;margin-block-end:0}
.gtabs .ui-btn.on{--cutbg:var(--ui-teal)}
.acc{display:flex;flex-direction:column;gap:6px}
.acc div{border:var(--ui-l26) solid var(--ui-line);padding:8px 12px;background:#fff;font-weight:700}
.sres{display:flex;flex-direction:column;gap:6px;max-block-size:230px;overflow:auto;margin-block-start:8px}
.sres .ui-btn{justify-content:flex-start;margin-block-end:0;text-align:start;inline-size:100%}
.sres .ui-btn small{display:block;font-weight:400;font-size:14px}
.ui-input{margin-block-end:0}
/* ---- آموزش ---- */
.tmask{position:absolute;inset:0;pointer-events:auto}
.spot{position:absolute;border-radius:18px;box-shadow:0 0 0 2000px rgba(36,26,94,.62);border:var(--ui-l45) solid var(--ui-cream);pointer-events:none;transition:all .3s ease}
.coach{position:absolute;inset-inline:12px;background:var(--ui-cream);color:var(--ui-line);border:var(--ui-l45) solid var(--ui-line);border-radius:18px 7px 18px 7px;padding:10px 12px 10px 12px;pointer-events:auto;box-shadow:0 6px 0 0 var(--ui-line);animation:v5fade .25s both;display:flex;gap:10px;align-items:flex-start}
.coach .cg{flex:none;inline-size:64px;block-size:64px}
.coach .cg svg{inline-size:64px;block-size:64px}
.coach .cm{flex:1;min-inline-size:0}
.coach p{font-weight:700;font-size:17px;line-height:1.7;margin:0}
.coach .cr{display:flex;gap:8px;margin-block-start:8px;align-items:center}
.coach .cr .st{flex:1;display:flex;gap:5px}
.coach .cr .st i{inline-size:10px;block-size:10px;border-radius:50%;background:#cfc7e4}

const doneBadge=(x,y)=>`<g transform="translate(${x} ${y})"><circle r="14" fill="#fff4d2" stroke="#241a5e" stroke-width="2.6"/><path d="M-6,0 l4,5 l8,-10" fill="none" stroke="#3a2a7a" stroke-width="3" stroke-linecap="round"/></g>`;
const lockBadge=(x,y)=>`<use href="#ui-lock" x="${x-16}" y="${y-16}" width="32" height="32"/>`;
function mapSVG(){
  const m=D.map;let g='',rings='',fogs='';
  const ns=m.nodes.filter(n=>vis(n.id)).sort((a,b)=>a.base[1]-b.base[1]);
  ns.forEach(n=>{
    const s=nodeSt(n.id),big=n.asset.indexOf('node_')===0,w=big?200:120,h=big?190:100;

    if(s==='done')g+=doneBadge(n.lock[0],n.lock[1]);
    else if(s==='locked')g+=lockBadge(n.lock[0],n.lock[1]);
    if(n.id===st.here&&s!=='fog'){const ol=n.zone==='farm'?10:4.5;
      rings+=`<g class="hring"><ellipse cx="${n.base[0]}" cy="${n.base[1]}" rx="${n.rx+8}" ry="${n.ry+6}" fill="none" stroke="#241a5e" stroke-width="${8+2*ol}"/><ellipse cx="${n.base[0]}" cy="${n.base[1]}" rx="${n.rx+8}" ry="${n.ry+6}" fill="none" stroke="#ffd23f" stroke-width="8"/></g>`}
    if(D.entr.includes(n.id)&&!fogOpen()){const dir=n.base[0]<195?1:-1;g+=`<use class="fsign" href="#x-fogsign" x="${n.base[0]+dir*(n.rx*.55+22)-18}" y="${n.base[1]-58}" width="36" height="47"/>`}
  });
  const e4=MN.E04;
  if(e4&&!fogOpen()){const [bx,by]=e4.base;fogs=`<g class="fogg" data-fog><use href="#x-fog" x="${bx-100}" y="${by-110}" width="200" height="130"/><use href="#x-fog" x="${bx-70}" y="${by-70}" width="150" height="98" opacity=".9"/><use class="fsign" href="#x-fogsign" x="${bx-18}" y="${by-62}" width="36" height="47"/></g>`}
  return `<svg class="mapart" viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="xMidYMin meet" aria-hidden="true">${m.head}${g}${rings}${fogs}${m.tail}</svg>`;
}
const posStyle=(x,y,extra='')=>`left:clamp(92px,calc(var(--s)*${x}px),calc(100% - 92px));top:calc(var(--s)*${y}px - 12px);${extra}`;
function mapOverlay(){
  let h='';
  const ns=D.map.nodes.filter(n=>vis(n.id));
  ns.forEach(n=>{
    const s=nodeSt(n.id),here=n.id===st.here&&s!=='fog',nd=N[n.id];
    const [hx,hy,hw,hh]=n.hit;
    h+=`<button class="mn" data-act="node" data-id="${n.id}" data-n="${n.id}" data-state="${s==='fog'?'locked':s}" ${here?'data-t="here"':''} style="left:calc(var(--s)*${hx}px);top:calc(var(--s)*${hy}px);width:calc(var(--s)*${hw}px);height:calc(var(--s)*${hh}px)" aria-label="${esc(s==='fog'?S('flow.map.fog.sign'):nd.env)}"></button>`;
    if(s==='fog')return;
    const lab=[plate('ui-plate--16',esc(nd.env))];
    if(here)lab.push(plate('ui-plate--here',pico('pin')+esc(S('flow.map.here'))));
    const ent=D.entr.includes(n.id)&&!fogOpen();
    if(!here&&s==='locked'&&ent)lab.push(plate('ui-plate--lock',pico('pin')+esc(S('flow.map.fog.sign'))+'<br>'+esc(lockText(n.id,'env'))));
    else{
      if(!here&&s==='locked')lab.push(plate('ui-plate--lock',esc(lockText(n.id,'env'))));
      if(ent)lab.push(plate('ui-plate--fogs',pico('pin')+esc(S('flow.map.fog.sign'))));
    }
    if(s==='trial')lab.push(plate('ui-plate--fogs',esc(S('flow.land.experimental'))));
    h+=`<div class="ml" data-for="${n.id}" style="${posStyle(n.label[0],n.label[1])}">${lab.join('')}</div>`;
  });
  const sg=D.map.start;
  h+=`<div class="ml" style="${posStyle(sg.x,sg.y+44)}">${plate('ui-plate--16',pico('flag')+esc(S('flow.map.start')))}</div>`;

function layoutMap(){
  const m=A('#map');if(!m)return;
  const s=m.clientWidth/D.map.w;m.style.setProperty('--s',s);
  const pos={};
  D.map.nodes.forEach(n=>{pos[n.id]={ax:n.foot[0]*s,ay:n.foot[1]*s,hx:(n.hit[0]+n.hit[2]/2)*s,hy:(n.hit[1]+n.hit[3]/2)*s}});
  st.pos=pos;
  nudgeLabels(m,s);
  const g=A('#guide'),hp=pos[st.here];
  if(g&&hp&&nodeSt(st.here)!=='fog'&&vis(st.here)){
    const put=(x,y)=>{g.style.left=x+'px';g.style.top=(y-82+6)+'px'};
    put(hp.ax,hp.ay);
    if(st.arrive&&!rm()){
      const a=st.arrive;st.arrive=null;
      const ids=D.order.filter(i=>pos[i]&&vis(i));const i0=ids.indexOf(a.from),i1=ids.indexOf(st.here);
      let route=i0>=0&&i1>i0?ids.slice(i0,i1+1):[a.from,st.here].filter(i=>pos[i]);
      if(route.length>5)route=[route[0],...route.slice(-4)];
      if(route.length>1){
        const gs=A('#gsvg');let k=0;const walk=setInterval(()=>{k++;gs.setAttribute('class','cs-full-82 ch-pose-walk'+(k%2?1:2))},170);
        const kf=route.map(i=>({left:pos[i].ax+'px',top:(pos[i].ay-76)+'px'}));
        const an=g.animate(kf,{duration:Math.min(1100,280*route.length),easing:'ease-in-out'});
        an.onfinish=()=>{clearInterval(walk);gs.setAttribute('class','cs-full-82 ch-pose-stand')};
      }
    }
    st.arrive=null;
  }else if(g)g.style.display='none';
  updateMe();
}
function nudgeLabels(m,s){
  const ps=[...m.querySelectorAll('#env_path path')].filter(x=>x.getTotalLength);if(!ps.length)return;
  const mr=m.getBoundingClientRect(),pts=[];
  ps.forEach(path=>{const L=path.getTotalLength(),sp=path.getScreenCTM();
    for(let l=0;l<=L;l+=8){const q=path.getPointAtLength(l),z=new DOMPoint(q.x,q.y).matrixTransform(sp);pts.push([z.x-mr.left,z.y-mr.top])}});
  /* مانع‌ها: تزئین‌های نقشه، بنای دیگر گره‌ها، آواتار */
  const rel=r=>({l:r.left-mr.left,t:r.top-mr.top,w:r.width,h:r.height});
  const obs=[];
  m.querySelectorAll('.mapart use').forEach(u=>{const h=u.getAttribute('href')||'';if(/#env_(dec|tree)_/.test(h)){const r=rel(u.getBoundingClientRect());if(r.w>4)obs.push({...r,k:'dec'})}});
  D.map.nodes.forEach(n=>{if(!vis(n.id))return;obs.push({l:n.hit[0]*s,t:n.hit[1]*s,w:n.hit[2]*s,h:n.hit[3]*s,k:'node',id:n.id})});
  const gd=m.querySelector('#guide');if(gd&&gd.style.display!=='none'){const r=rel(gd.getBoundingClientRect());obs.push({...r,k:'guide'})}
  const CL=22,MG=10,placed=[];
  const ov=(a,b,g)=>a.l<b.l+b.w+g&&a.l+a.w+g>b.l&&a.t<b.t+b.h+g&&a.t+a.h+g>b.t;
  m.querySelectorAll('.ml').forEach(el=>{
    el.style.setProperty('--dx','0px');el.style.setProperty('--dy','0px');
    const r=el.getBoundingClientRect(),b={l:r.left-mr.left,t:r.top-mr.top,w:r.width,h:r.height},own=el.dataset.for;
    const cost=(dx,dy)=>{const q={l:b.l+dx,t:b.t+dy,w:b.w,h:b.h};
      if(q.l<4||q.l+q.w>mr.width-4||q.t<2)return 1e9;
      let c=Math.abs(dx)*2.2+Math.abs(dy)*3.2;
      if(pts.some(p=>p[0]>q.l-CL&&p[0]<q.l+q.w+CL&&p[1]>q.t-CL&&p[1]<q.t+q.h+CL))c+=1e6;
      for(const o of obs){if(o.k==='node'&&o.id===own)continue;if(ov(q,o,o.k==='guide'?6:MG))c+=o.k==="dec"?1500:5000}
      for(const o of placed)if(ov(q,o,6))c+=4000;
      return c};
    let best={c:cost(0,0),dx:0,dy:0};
    if(best.c>0)for(const dy of [0,-20,20,-40,40,-60,60,-84,84,-110,110])for(const dx of [0,-24,24,-48,48,-72,72,-100,100,-130,130]){const c=cost(dx,dy);if(c<best.c)best={c,dx,dy}}
    el.style.setProperty('--dx',best.dx+'px');el.style.setProperty('--dy',best.dy+'px');
    placed.push({l:b.l+best.dx,t:b.t+best.dy,w:b.w,h:b.h});
  });
}
function updateMe(){
  const b=A('#mapbody'),me=A('#mebtn'),h=st.pos&&st.pos[st.here];if(!b||!me||!h)return;
  const y=h.ay-b.scrollTop;const away=(y<20||y>b.clientHeight-20);

const K={line:'#241a5e',cream:'#fff4d2',violet:'#3a2a7a',rope:'#c98a45',pull:'#2fb8a8',weight:'#d070c0'};
function arrow(x,y,len,dir,col){const ty=y+dir*len,hh=20*dir;
  return `<polygon class="farr" points="${x-4},${y} ${x+4},${y} ${x+4},${ty-hh} ${x+11},${ty-hh} ${x},${ty} ${x-11},${ty-hh} ${x-4},${ty-hh}" fill="${col}" stroke="${K.line}" stroke-width="2.6" stroke-linejoin="round"/>`}
const wheel=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${K.cream}" stroke="${K.line}" stroke-width="4.5"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="${K.violet}" stroke="${K.line}" stroke-width="1.2"/>`;
const hang=(cx,y0,y1)=>`<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${y1}" stroke="${K.line}" stroke-width="4.5" stroke-linecap="round"/>`;
const rope=d=>`<path d="${d}" fill="none" stroke="${K.line}" stroke-width="7.6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${K.rope}" stroke-width="4" stroke-linecap="round"/>`;

function openCard(id,from,el){
  if(nodeSt(id)==='locked'||nodeSt(id)==='fog'){st.lock=id;renderOv();return}

function renderCard(anim){
  const cv=$('#cv');

  cv.innerHTML=cardOvHTML();
  const big=$('#cbig');

    const r=st.card.rect;
    if(r){const b=big.getBoundingClientRect();big.animate([{transform:`translate(${r.left-b.left}px,${r.top-b.top}px) scale(${r.width/b.width},${r.height/b.height})`,opacity:.4},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.35,0,.25,1)'})}

  }

function swapCard(id){
  const old=$('#cflip');
  if(!st.coll.has(id))st.seen.add(id);
  st.card.id=id;st.card.face='front';st.card.rect=null;
  const done=()=>{const cv=$('#cv');cv.innerHTML=cardOvHTML();if(!rm())$('#cbig').animate([{opacity:0},{opacity:1}],{duration:240});renderPanel()};

}
function flipCard(){
  if(!st.card)return;st.card.face=st.card.face==='front'?'back':'front';
  const f=$('#cflip');if(!f)return;const back=st.card.face==='back';
  f.classList.toggle('back',back);

  const fb=$('#flipbtn');fb.querySelector('span').textContent=S(back?'flow.card.flipBack':'flow.card.flip');

}
function closeCard(){
  const cv=$('#cv');const big=$('#cbig');
  const done=()=>{st.card=null;cv.innerHTML='';renderPanel()};
  if(!big||rm()){done();return}
  const r=st.card.rect;const tile=A(`[data-pk="${st.card.id}"]`);
  let a;
  if(r&&tile){const t=tile.getBoundingClientRect();const b=big.getBoundingClientRect();

  else a=big.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.94)'}],{duration:220,fill:'forwards'});
  a.onfinish=done;
}

    if(!st.gateOK)return sheet(`<h3 class="st">${esc(S('flow.gate.title'))}</h3><p class="why" style="font-weight:400">${esc(S('flow.gate.lead'))}</p><button class="ui-btn ui-btn--hold hold" id="hold" aria-label="${esc(S('flow.gate.hold'))}"><i></i>${ic('hold')}<span>${esc(S('flow.gate.hold'))}</span></button>${backRow()}`,S('flow.gate.title'));
    if(viaCard)return sheet(`<h3 class="st">${esc(S('flow.gate.tab.video'))}</h3><p style="margin:0 0 8px">${esc(S('flow.gate.video.lead'))}</p><div class="vl">${D.videos.map(v=>`<div><bdi dir="auto">${esc(v[0])}</bdi><small>${esc(v[1])} · ${esc(R['mock.video'])}</small></div>`).join('')}</div>${backRow()}`,S('flow.gate.tab.video'));
    const tabs=[['report','flow.gate.tab.report'],['guide','flow.gate.tab.guide'],['code','flow.gate.tab.code']];
    let c='';
    if(st.gateTab==='report'){c=`<p style="margin:0 0 8px">${esc(S('flow.gate.report.lead'))}</p><div class="vl">${D.chapters.map(ch=>{const ids=ch.ids.filter(listed);const v=ids.filter(id=>st.visited.has(id));return `<div><b>${esc(S('flow.thread.'+ch.id+'.name'))}</b> · ${fa(v.length)} / ${fa(ids.length)}<small>${esc(v.map(id=>N[id].env).join('، '))}</small></div>`}).join('')}</div>`}
    if(st.gateTab==='guide'){c=`<p style="margin:0 0 8px">${esc(S('flow.gate.guide.lead'))}</p><div class="acc">${[1,2,3,4,5].map(i=>`<div>${esc(S('flow.gate.guide.s'+i))}</div>`).join('')}</div>`}
    if(st.gateTab==='code'){c=`<p>${esc(S('flow.gate.code.lead'))}</p>`}
    return sheet(`<h3 class="st">${esc(S('flow.gate.title'))}</h3><div class="gtabs">${tabs.map(([k,s])=>`<button class="ui-btn ui-btn--sec ui-cut ${st.gateTab===k?'on':''}" data-act="gtab" data-v="${k}">${esc(S(s))}</button>`).join('')}</div>${c}${backRow()}`,S('flow.gate.title'));}
  if(st.tut){
    const t=st.tut;const step=t.steps[t.i];const last=t.i===t.steps.length-1;
    return `<div class="tmask" data-act="noop"></div><div class="spot" id="spot"></div><div class="coach" id="coach" style="${step.pos==='top'?'top:72px':'bottom:12px'}"><div class="cg"><svg viewBox="0 0 100 92" aria-hidden="true"><g class="cs-bust-64 ch-pose-point"><use class="ch-happy" href="#ch-b1"/></g></svg></div><div class="cm"><p>${esc(S(step.k))}</p><div class="cr"><div class="st">${t.steps.map((_,j)=>`<i class="${j===t.i?'on':''}"></i>`).join('')}</div>${secBtn('tskip',esc(S('flow.skip')))}${priBtn(last?'tskip':'tnext',esc(S(last?'flow.done':'flow.next')))}</div></div></div>`}
  return '';
}
function renderOv(){
  $('#ov').innerHTML=ovHTML();
  const h=$('#hold');if(h)wireHold(h);
  if(st.lock&&!rm()){const s=$('#ov .sheet');if(s&&nodeSt(st.lock)!=='fog')s.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:200,delay:260})}
  if(st.tut)placeSpot();
  renderPanel();
}
function wireHold(h){
  const start=e=>{e.preventDefault();h.classList.add('on');clearTimeout(holdT);holdT=setTimeout(()=>{st.gateOK=true;renderOv()},2000)};
  const stop=()=>{h.classList.remove('on');clearTimeout(holdT)};
  h.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,stop));
  h.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e)});h.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stop()});
}
/* آموزش */
function tutSteps(kind){
  if(kind==='map')return[{k:'flow.tut.map1',sel:'[data-t=here]',pos:'bottom'},{k:'flow.tut.map2',sel:'[data-t=here]',pos:'bottom'},{k:'flow.tut.map.lock',sel:'.mn[data-state=locked]',pos:'bottom'},{k:'v5.flow.tut.base',sel:'[data-t=base]',pos:'bottom'},{k:'flow.tut.map3',sel:'[data-t=menu]',pos:'bottom'}].filter(s=>$('#app').querySelector(s.sel));
  return[{k:'flow.tut.scene1',sel:'[data-t=arr]',pos:'top'},{k:'flow.tut.scene2',sel:'[data-t=pull]',pos:'top'},{k:'flow.tut.scene3',sel:'[data-t=help]',pos:'top'}];
}
function startTut(kind){st.overlay=null;st.peek=null;st.lock=null;st.tut={kind,steps:tutSteps(kind),i:0};renderOv()}
function placeSpot(){
  const step=st.tut.steps[st.tut.i];const el=$('#app').querySelector(step.sel);const sp=$('#spot');if(!el||!sp)return;
  const body=el.closest('.mapbody');
  if(body&&el.classList.contains('mn')){const p=st.pos&&st.pos[el.dataset.n];if(p)body.scrollTop=Math.max(0,p.hy-body.clientHeight*.3)}
  const pr=$('#phone').getBoundingClientRect();let r=el.getBoundingClientRect();
  if(el.classList.contains('mn')){
    const lb=A(`.ml[data-for="${el.dataset.n}"]`);const U=[r];if(lb)U.push(lb.getBoundingClientRect());
    if(el.dataset.t==='here'){const gd=A('#guide');if(gd)U.push(gd.getBoundingClientRect())}
    r={left:Math.min(...U.map(x=>x.left)),right:Math.max(...U.map(x=>x.right)),top:Math.min(...U.map(x=>x.top)),bottom:Math.max(...U.map(x=>x.bottom))};
  }
  if(step.sel==='[data-t=arr]'){const ar=[...$('#app').querySelectorAll('[data-t=arr],[data-act=arr]')].map(x=>x.getBoundingClientRect());r={left:Math.min(...ar.map(x=>x.left)),right:Math.max(...ar.map(x=>x.right)),top:Math.min(...ar.map(x=>x.top)),bottom:Math.max(...ar.map(x=>x.bottom))}}
  const pad=6;sp.style.cssText=`left:${r.left-pr.left-pad}px;top:${r.top-pr.top-pad}px;width:${r.right-r.left+pad*2}px;height:${r.bottom-r.top+pad*2}px`;
}
function afterRender(){
  if(st.scr==='env'){const b=A('.envbody');if(b)b.scrollTop=0}
  if(st.scr==='map'){
    layoutMap();const b=A('#mapbody');
    if(st.mapTop!==null){b.scrollTop=st.mapTop;st.mapTop=null}
    else if(!st.tut){scrollMapTo(st.here,false)}
    b.addEventListener('scroll',updateMe,{passive:true});
    updateMe();
    if(st.tutOn&&!st.tutDone.map)setTimeout(()=>{if(st.scr==='map'&&!st.tut&&!st.tutDone.map&&!st.overlay)startTut('map')},900);
  }
  if(st.scr==='box'){const b=A('#boxbody');b.scrollTop=st.boxTop||0;b.addEventListener('scroll',()=>{st.boxTop=b.scrollTop;updateJump()},{passive:true});updateJump()}
  if(st.scr==='scene'&&st.cur==='M07'&&st.tier===0&&st.tutOn&&!st.tutDone.scene)setTimeout(()=>{if(st.scr==='scene'&&!st.tut&&!st.tutDone.scene)startTut('scene')},450);
}
/* ---------- رندر (با انتقال نور روز↔شب ۱٫۲ث فقط با انتخاب کودک؛ هر دو صفحه در DOM می‌مانند) ---------- */
let xfT=null;
function render(opts={}){
  const keepTop=st.scr==='map'&&A('#mapbody')?A('#mapbody').scrollTop:null;
  const f={map:mapScreen,env:envScreen,scene:sceneScreen,box:boxScreen,prac:pracScreen}[st.scr];
  const nl=lightOf(),nw=worldOf();
  const old0=$('#appold');if(old0){old0.remove();clearTimeout(xfT)}
  let app=$('#app');
  const changed=app.dataset.light!==nl||app.dataset.world!==nw;
  if(opts.fade&&changed&&!rm()&&app.innerHTML.trim()){
    app.id='appold';app.style.pointerEvents='none';
    const nu=document.createElement('div');nu.id='app';nu.className='appl fadein';nu.dataset.world=nw;nu.dataset.light=nl;
    $('#phone').insertBefore(nu,$('#cv'));nu.innerHTML=f();
    xfT=setTimeout(()=>{const o=$('#appold');if(o)o.remove();nu.classList.remove('fadein')},1250);
  }else{app.dataset.world=nw;app.dataset.light=nl;app.innerHTML=f()}
  if(keepTop!==null&&st.keepMap){st.mapTop=keepTop;st.keepMap=false}
  renderOv();renderCard(false);afterRender();
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(st.scr==='map')layoutMap()});
/* ---------- پنل بازبینی ---------- */
function noteKey(){if(st.card)return'n.card';if(st.lock)return'n.lock';if(st.overlay==='gate')return'n.gate';if(st.overlay==='menu')return'n.menu';if(st.overlay==='help')return'n.help';if(st.overlay==='search')return'n.search';if(st.peek)return'n.peek';if(st.tut)return'n.tut';return{map:'n.map',env:'n.env',scene:'n.scene',box:'n.box',prac:'n.prac'}[st.scr]}
function renderPanel(){
  const cur=st.card?'card':st.lock?'lock':st.overlay==='gate'?'gate':st.overlay==='menu'?'menu':st.overlay==='help'?'help':st.overlay==='search'?'search':st.peek?'peek':st.tut?'tut':st.scr;
  const items=[['map','scr.map'],['peek','scr.peek'],['lock','scr.lock'],['env','scr.env'],['scene','scr.scene'],['card','scr.card'],['box','scr.box'],['prac','scr.prac'],['tut','scr.tut'],['menu','scr.menu'],['search','scr.search'],['help','scr.help'],['gate','scr.gate']];
  const n=R[noteKey()]||{what:'',real:'',ask:''};
  $('#rv').innerHTML=`<h2>${esc(R['panel.title'])}</h2><div class="rs">${esc(R['banner'])}</div>
   <h3>${esc(R['panel.screens'])}</h3><div class="lst">${items.map(([k,t])=>`<button class="${cur===k?'on':''}" data-rv="${k}">${esc(R[t])}</button>`).join('')}</div>
   <h3>${esc(R['panel.sample'])}</h3><div class="seg">${['start','mid','end'].map(k=>`<button class="${st.sample===k?'on':''}" data-sample="${k}">${esc(R['sample.'+k])}</button>`).join('')}</div>
   <div class="lst" style="margin-top:6px"><button data-rv="advance">${esc(R['panel.advance'])}</button></div>
   <h3>${esc(R['panel.band'])}</h3><div class="seg">${[1,2,3].map(b=>`<button class="${st.band===b?'on':''}" data-band="${b}">${esc(D.card[b].band)}</button>`).join('')}</div>
   <h3>${esc(R['panel.settings'])}</h3>
   <label class="tg"><input type="checkbox" data-tg="fogClear" ${st.fogClear?'checked':''}>${esc(R['panel.fog'])}</label>
   <label class="tg"><input type="checkbox" data-tg="teacher" ${st.teacher?'checked':''}>${esc(R['panel.teacher'])}</label>
   <label class="tg"><input type="checkbox" data-tg="storyLight" ${st.storyLight?'checked':''}>${esc(R['panel.story'])}</label>
   <label class="tg"><input type="checkbox" data-tg="tutOn" ${st.tutOn?'checked':''}>${esc(R['panel.tut'])}</label>
   <label class="tg"><input type="checkbox" data-tg="rm" ${document.body.classList.contains('rm')?'checked':''}>${esc(R['panel.rm'])}</label>
   <div class="lst" style="margin-top:6px"><button data-rv="reset">${esc(R['panel.reset'])}</button></div>
   <div class="note"><b>${esc(R['panel.what'])}</b><p>${esc(n.what)}</p><b>${esc(R['panel.real'])}</b><p>${esc(n.real)}</p><b>${esc(R['panel.ask'])}</b><p>${esc(n.ask)}</p></div>`;
}
/* advance: کودک محیط را تمام کرد؛ راهنما به گام بعد می‌رود */
function advance(){
  const from=st.here;if(!st.visited.has(from))st.visited.add(from);
  st.seen.add(from);
  const next=D.order.find(i=>vis(i)&&nodeSt(i)!=='fog'&&nodeSt(i)!=='locked'&&!st.visited.has(i)&&!(N[i].trial));
  st.here=next||from;st.arrive={from};st.nav=[];st.card=null;go('map',{},false,false);
}
/* ---------- رویدادها ---------- */
document.addEventListener('click',e=>{
  const rv=e.target.closest('[data-rv]');
  if(rv){const k=rv.dataset.rv;document.body.classList.remove('rvopen');
    if(k==='reset'){Object.assign(st,{band:1,teacher:false,storyLight:false,tutOn:true,tutDone:{map:false,scene:false},nav:[],prac:0,ord:[2,1,0],gateOK:false,card:null,boxTop:0,search:false,q:'',mq:''});loadSample('mid');st.cur='M07';go('map',{},false,false);return}
    if(k==='advance'){advance();return}
    st.nav=[];st.gateOK=false;st.card=null;st.peek=null;st.lock=null;st.overlay=null;st.tut=null;
    const G=(s,p)=>go(s,p||{},false,false);
    if(k==='map')G('map');
    else if(k==='peek'){G('map');st.peek=st.here;renderOv()}
    else if(k==='lock'){G('map');const id=D.order.find(i=>vis(i)&&nodeSt(i)==='locked');if(id){st.lock=id;renderOv();scrollMapTo(id,false)}}
    else if(k==='env')G('env',{cur:'M07'});
    else if(k==='scene')G('scene',{cur:'M07',tier:0});
    else if(k==='card'){G('scene',{cur:'M07',tier:0});openCard('M07','scene',document.querySelector('[data-t=lesson]'))}
    else if(k==='box')G('box',{boxTop:0});
    else if(k==='prac')G('prac',{prac:0});
    else if(k==='tut'){if(st.scr!=='map'&&st.scr!=='scene')G('map');st.tutDone[st.scr]=false;startTut(st.scr==='map'?'map':'scene')}
    else if(k==='menu'){if(st.scr!=='map'&&st.scr!=='scene')G('map');st.overlay='menu';renderOv()}
    else if(k==='search'){if(st.scr!=='map'&&st.scr!=='scene')G('map');st.overlay='search';st.mq='';renderOv()}
    else if(k==='help'){G('scene',{cur:'M07',tier:0});st.overlay='help';st.hint=1;renderOv()}
    else if(k==='gate'){st.overlay='gate';st.gateOK=false;st.gateTab='report';st.gateVia='menu';renderOv()}
    return}
  const smp=e.target.closest('[data-sample]');if(smp){loadSample(smp.dataset.sample);st.nav=[];go('map',{},false,false);return}
  const bd=e.target.closest('[data-band]');if(bd){st.band=+bd.dataset.band;const keep=st.card;st.keepMap=true;render();if(keep){st.card=keep;renderCard(false)}return}
  const t=e.target.closest('#rvt');if(t){document.body.classList.toggle('rvopen');return}
  const a=e.target.closest('[data-act]');
  if(!a){const cf=e.target.closest('.cface');if(cf&&!e.target.closest('button,.prob,.cbd'))flipCard();return}
  const act=a.dataset.act,id=a.dataset.id;
  switch(act){
   case'back':back();break;
   case'toMap':st.nav=[];st.overlay=null;go('map',{},false);break;
   case'node':{const s=nodeSt(id);if(s==='locked'||s==='fog'){st.lock=id;st.peek=null;renderOv()}else{st.peek=id;st.lock=null;renderOv()}break}
   case'cardlock':st.lock=id;renderOv();break;
   case'closeov':st.peek=null;st.lock=null;st.overlay=null;st.gateOK=false;renderOv();break;
   case'lockgo':{st.lock=null;st.overlay=null;st.peek=null;if(st.scr!=='map'){st.nav=[];st.mapTop=null;go('map',{},false)}else renderOv();
     setTimeout(()=>{scrollMapTo(id,true);const nd=A(`.mn[data-n="${id}"]`);if(nd&&!rm()){nd.classList.add('flash');setTimeout(()=>nd.classList.remove('flash'),900)}},60);break}
   case'mapfind':{st.overlay=null;if(st.scr!=='map'){st.nav=[];st.mapTop=null;go('map',{},false)}else renderOv();
     setTimeout(()=>{scrollMapTo(id,true);const nd=A(`.mn[data-n="${id}"]`);if(nd&&!rm()){nd.classList.add('flash');setTimeout(()=>nd.classList.remove('flash'),900)}},60);break}
   case'srch':st.overlay='search';st.mq='';renderOv();{const q=$('#mq');if(q)q.focus()}break;
   case'me':scrollMapTo(st.here,true);break;
   case'menumap':st.overlay=null;renderOv();scrollMapTo(st.here,true);break;
   case'enter':go('env',{cur:id});break;
   case'card3':{const i=+a.dataset.i;st.ord=st.ord.filter(x=>x!==i).concat(i);updateStack();break}
   case'start':{e.stopPropagation();go('scene',{tier:+a.dataset.i});break}
   case'arr':st.arr=a.dataset.v;render();break;
   case'pull':st.pulled=true;render();break;
   case'lesson':openCard(st.cur,'scene',a);break;
   case'menu':st.overlay='menu';st.peek=null;st.lock=null;renderOv();break;
   case'help':st.overlay='help';st.hint=0;renderOv();break;
   case'hint':st.hint=Math.min(3,st.hint+1);renderOv();break;
   case'box':st.nav=[];st.overlay=null;go('box',{boxTop:0},false);break;
   case'prac':st.nav=[];st.overlay=null;go('prac',{prac:0},false);break;
   case'jump':{const s=document.getElementById('sh-'+a.dataset.ch);const b=A('#boxbody');if(s&&b){b.scrollTo({top:s.offsetTop-6,behavior:rm()?'auto':'smooth'})}break}
   case'search':st.search=!st.search;if(!st.search)st.q='';{const bt=st.boxTop;render();A('#boxbody').scrollTop=bt;if(st.search){const q=A('#q');if(q)q.focus()}}break;
   case'opencard':openCard(id,'box',a);break;
   case'swapcard':if(nodeSt(id)==='locked'){st.lock=id;renderOv()}else swapCard(id);break;
   case'flip':flipCard();break;
   case'closecard':closeCard();break;
   case'put':{st.coll.add(id);st.seen.add(id);const f=$('#cbk .cfoot');if(f)f.innerHTML=plate('ui-plate--16 ui-plate--teal',pico('box')+esc(S('flow.box.collected')));if(!rm()&&f)f.animate([{transform:'scale(.9)',opacity:.4},{transform:'none',opacity:1}],{duration:260});refreshBox();break}
   case'gogame':{e.stopPropagation();if(nodeSt(id)==='locked'){st.lock=id;renderOv()}else{st.card=null;$('#cv').innerHTML='';go('env',{cur:id})}break}
   case'ans':{const box=a.closest('.prob');const fb=box.querySelector('.fb');const p=PROB[st.band];
     if(+a.dataset.ok){box.querySelectorAll('.opts .ui-btn').forEach(x=>x.classList.remove('no'));a.classList.add('ok');fb.textContent=S(p.ok);const pn=$('#pn');if(pn)pn.style.display='block'}
     else{a.classList.add('no');fb.textContent=S('flow.card.q.retry')}break}
   case'pstart':st.prac=1;render();break;
   case'pnext':st.prac=2;render();break;
   case'replay':{const k=st.scr==='scene'?'scene':'map';if(st.scr!=='map'&&st.scr!=='scene'){st.nav=[];go('map',{},false)}st.tutDone[k]=false;st.overlay=null;startTut(k);break}
   case'gate':st.overlay='gate';st.gateOK=false;st.gateTab=a.dataset.tab||'report';st.gateVia=a.dataset.via||'menu';renderOv();break;
   case'gtab':st.gateTab=a.dataset.v;renderOv();break;
   case'tnext':st.tut.i++;renderOv();break;
   case'tskip':st.tutDone[st.tut.kind]=true;st.tut=null;renderOv();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){st.q=e.target.value;refreshBox()}
  if(e.target.id==='mq'){st.mq=e.target.value;const w=$('#sresw');if(w)w.innerHTML=searchRes()}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cd-strip')){e.preventDefault();e.target.click();return}
  if(e.key==='Escape'){if(st.tut){st.tutDone[st.tut.kind]=true;st.tut=null;renderOv()}else if(st.peek||st.overlay||st.lock){st.peek=null;st.lock=null;st.overlay=null;st.gateOK=false;renderOv()}else if(st.card)closeCard()}});
document.addEventListener('change',e=>{const g=e.target.closest('[data-tg]');if(!g)return;const k=g.dataset.tg;
  if(k==='rm'){document.body.classList.toggle('rm',g.checked);renderPanel();return}
  st[k]=g.checked;
  if(k==='fogClear'&&g.checked&&st.scr==='map'&&!rm()){const f=document.querySelector('[data-fog]');if(f){f.style.transition='opacity .6s';f.style.opacity=0;setTimeout(()=>{st.keepMap=true;render()},600);return}}
  if(k==='teacher'||k==='fogClear'||k==='storyLight'){st.keepMap=true;render()}else renderPanel()});
window.addEventListener('resize',()=>{if(st.tut)placeSpot();if(st.scr==='map')layoutMap()});
$('#rvt').textContent=R['panel.toggle'];$('#rvb').textContent=R['banner'];
render();
window.__st=st;
</script>
