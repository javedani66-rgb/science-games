:root{--navy:#241a5e;--edge:#120c3a;--cream:#fff4d2;--cream2:#fff9e6;--teal:#2fb8a8;--violet:#8a4fd0;--sky:#d5ecf4;--sea:#2a8fc4;--ease:cubic-bezier(.22,.9,.25,1);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e7e2d3;color:var(--navy);font:400 16px/1.6 Vazirmatn,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--navy);outline-offset:3px}
img{display:block;max-width:none}
#rv{height:44px;background:#2b3a2b;color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:14px}
#rv .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rv button{background:#fff;color:#2b3a2b;border-radius:999px;padding:0 10px;min-height:32px;font-size:14px;font-weight:700}
#rv button[aria-pressed=true]{background:var(--cream);outline:2px solid #fff}
#app{position:relative;max-width:430px;margin:0 auto;height:calc(100% - 44px);overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;background:linear-gradient(var(--sky) 0%,#8fcfe6 38%,var(--sea) 100%)}
#head{flex:none;padding:14px 16px 0;text-align:center}
.title{margin:0;font:400 58px/1.1 Lalezar,Vazirmatn,sans-serif;color:var(--cream);-webkit-text-stroke:10px var(--navy);paint-order:stroke fill;text-shadow:0 4px 0 var(--edge);word-spacing:.35em}
.sub{display:block;width:fit-content;max-width:100%;margin:8px auto 0;background:var(--cream);border:3px solid var(--navy);border-radius:24px;box-shadow:0 3px 0 var(--edge);padding:2px 18px;font-size:17px;font-weight:700}
#sc{position:relative;flex:1 1 190px;min-height:130px;margin:14px 16px 0;border:4px solid var(--navy);border-radius:26px;box-shadow:0 6px 0 var(--edge);overflow:hidden;background:#3f9a3a;direction:ltr}
#pan{position:absolute;left:0;top:0}
#pan img{position:absolute}
#pg{inset:0;width:100%;height:100%}
#ch{left:56%;bottom:37%;height:50%;filter:drop-shadow(0 0 1px #fff4d2) drop-shadow(0 0 1px #fff4d2) drop-shadow(0 0 4px rgba(255,244,210,.8));transform-origin:50% 100%;animation:br 3.2s ease-in-out infinite}
@keyframes br{50%{transform:scaleY(1.015)}}
#pn{flex:none;margin:12px 16px 0;background:var(--cream);border:4px solid var(--navy);border-radius:28px;box-shadow:0 6px 0 var(--edge);padding:12px 12px 12px;display:flex;flex-direction:column;gap:8px}
#hello{margin:0;text-align:center;font-size:18px;font-weight:700;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:4px solid var(--navy);border-radius:22px;background:var(--teal);box-shadow:0 5px 0 var(--edge);font:400 32px/1 Lalezar,Vazirmatn,sans-serif;color:var(--navy);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.btn svg{width:28px;height:28px;flex:none}
#here{margin:0;text-align:center;font-size:15px;font-weight:700}
#here[hidden],#tiles[hidden]{display:none}
#tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:6px 2px;border:3.5px solid var(--navy);border-radius:18px;background:var(--cream2);box-shadow:0 4px 0 var(--edge);font-size:15px;font-weight:700;line-height:1.3;transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
.tile svg{width:30px;height:30px}
.tile .nw{position:absolute}
#bot{flex:none;display:flex;justify-content:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#grown{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px 0 12px;border:3px solid var(--navy);border-radius:26px;background:var(--violet);color:var(--cream);box-shadow:0 4px 0 var(--edge);font-size:14px;font-weight:700;touch-action:none;user-select:none}
#grown svg.ring{width:34px;height:34px;flex:none;transform:rotate(-90deg)}
#grown circle{fill:none;stroke-width:5}
#rg0{stroke:rgba(255,244,210,.35)}#rg1{stroke:var(--cream);stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25}
#grown .tx{display:flex;flex-direction:column;line-height:1.3;text-align:start}
#grown .tx small{font-size:14px;font-weight:400}
#shd{position:fixed;inset:44px 0 0;z-index:20;background:rgba(18,12,58,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#shd[hidden]{display:none}
#sheet{width:100%;max-width:398px;background:var(--cream);border:4px solid var(--navy);border-radius:28px;box-shadow:0 6px 0 var(--edge);padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;animation:up .28s var(--ease) both}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#sheet p{margin:0;font-size:18px;font-weight:700;text-align:center;line-height:1.7}
.btn2{min-height:52px;background:var(--cream2);font:700 18px/1.3 Vazirmatn,sans-serif;box-shadow:0 4px 0 var(--edge);border-radius:18px}
#fade{position:fixed;inset:0;z-index:30;background:#120c3a;opacity:0;pointer-events:none}
@media (max-height:700px){.title{font-size:44px;-webkit-text-stroke:8px var(--navy)}#head{padding-top:8px}.btn{min-height:56px}.tile{min-height:66px}#bot{padding-top:8px}#pn{margin-top:8px}#sc{margin-top:8px}}
@media (prefers-reduced-motion:reduce){#ch{animation:none}#sheet{animation:none}.btn,.tile{transition:none}}
</style>
</head>

const S0={"entry.title": {"text": "جهان علوم", "kind": "title", "where_fa": "عنوان بازی روی منوی ورود", "context_fa": "مصوب مالک ۲۶ اکتبر (D189)؛ متن نهایی با ویرایش فارسی", "band": "همه", "status": "draft"}, "entry.sub": {"text": "سرزمین ماشین‌های ساده", "kind": "title", "where_fa": "زیرعنوان زیر نام بازی (سوتیتر)", "context_fa": "مصوب مالک ۲۶ اکتبر (D189)", "band": "همه", "status": "draft"}, "entry.hello.first": {"text": "سلام! بیا شروع کنیم.", "kind": "ui", "where_fa": "جملهٔ بالای دکمهٔ شروع در اولین ورود", "context_fa": "پیش‌نویس", "band": "همه", "status": "draft"}, "entry.hello": {"text": "سلام {name}!", "kind": "ui", "where_fa": "سلام بالای دکمهٔ ادامه", "context_fa": "{name} همان اسمی است که کودک خودش نوشته (D77)", "band": "همه", "status": "draft"}, "entry.start": {"text": "شروع", "kind": "button", "where_fa": "دکمهٔ اصلی در اولین ورود", "context_fa": "پیش‌نویس", "band": "همه", "status": "draft"}, "entry.cont": {"text": "ادامه", "kind": "button", "where_fa": "دکمهٔ اصلی وقتی کودک قبلاً بازی کرده", "context_fa": "پیش‌نویس", "band": "همه", "status": "draft"}, "entry.here": {"text": "اینجایی: {place}", "kind": "ui", "where_fa": "خط زیر دکمهٔ ادامه؛ جایی که کودک مانده", "context_fa": "{place} نام ایستگاه؛ بدون درصد و عدد", "band": "همه", "status": "draft"}, "entry.cards": {"text": "کارت‌دان", "kind": "button", "where_fa": "کاشی کارت‌دان (جعبهٔ کارت)", "context_fa": "همان واژهٔ منوی بازی", "band": "همه", "status": "draft"}, "entry.practice": {"text": "تمرین", "kind": "button", "where_fa": "کاشی تمرین", "context_fa": "همان واژهٔ منوی بازی", "band": "همه", "status": "draft"}, "entry.guide": {"text": "راهنما", "kind": "button", "where_fa": "کاشی راهنما (آموزش بازی)", "context_fa": "همان واژهٔ منوی بازی", "band": "همه", "status": "draft"}, "entry.grown": {"text": "ویژهٔ بزرگ‌ترها", "kind": "button", "where_fa": "دکمهٔ کوچک گوشهٔ پایین", "context_fa": "با نگه‌داشتن ۲ ثانیه باز می‌شود (B38)", "band": "همه", "status": "draft"}, "entry.hold": {"text": "نگه دار ۲ ثانیه", "kind": "ui", "where_fa": "راهنمای دکمهٔ ویژهٔ بزرگ‌ترها", "context_fa": "پیش‌نویس", "band": "همه", "status": "draft"}, "entry.sheet.close": {"text": "بستن", "kind": "button", "where_fa": "دکمهٔ بستن برگهٔ پیام ماکت", "context_fa": "فقط ماکت", "band": "همه", "status": "draft"}, "entry.mock.start": {"text": "در بازی واقعی: اولین بار ← انتخاب شخصیت و اسم ← آموزش کوتاه روی نقشه ← نقشه.", "kind": "ui", "where_fa": "پیام ماکت بعد از «شروع»", "context_fa": "فقط ماکت", "band": "همه", "status": "draft"}, "entry.mock.cont": {"text": "در بازی واقعی: یکراست به نقشه، همان‌جا که کودک مانده بود.", "kind": "ui", "where_fa": "پیام ماکت بعد از «ادامه»", "context_fa": "فقط ماکت", "band": "همه", "status": "draft"}, "entry.mock.cards": {"text": "در بازی واقعی: کارت‌دان باز می‌شود و «برگرد» به همین صفحه برمی‌گردد.", "kind": "ui", "where_fa": "پیام ماکت بعد از کاشی کارت‌دان", "context_fa": "فقط ماکت", "band": "همه", "status": "draft"}, "entry.mock.practice": {"text": "در بازی واقعی: صفحهٔ تمرین باز می‌شود (اختیاری).", "kind": "ui", "where_fa": "پیام ماکت بعد از کاشی تمرین", "context_fa": "فقط ماکت", "band": "همه", "status": "draft"}, "entry.mock.guide": {"text": "در بازی واقعی: آموزش بازی باز می‌شود (قابل تکرار).", "kind": "ui", "where_fa": "پیام ماکت بعد از کاشی راهنما", "context_fa": "فقط ماکت", "band": "همه", "status": "draft"}, "entry.mock.grown": {"text": "در بازی واقعی: نمای معلم، کد پیشرفت و تنظیمات. در ماکت باز نمی‌شود.", "kind": "ui", "where_fa": "پیام ماکت بعد از نگه‌داشتن", "context_fa": "فقط ماکت", "band": "همه", "status": "draft"}},R={"banner": "ماکت منوی ورود به بازی (۲۶ اکتبر). ماکت است، نه بازی؛ با کودک یا گوشی واقعی آزموده نشده. متن‌ها پیش‌نویس‌اند.", "mode.a": "اولین بار", "mode.b": "کودک برگشته", "mode.t": "مسیر تمام‌شده", "sample.name": "مینا", "sample.place.b": "پیست اسکی روی یخ", "sample.place.t": "مخفی‌گاه هیولا", "note": "اسم و جای نمونه فقط برای نمایش‌اند. هیچ ستاره، امتیاز یا شمارنده‌ای نیست؛ ورود و رفتن فقط با لمس کودک (B4/B5). صدا و موسیقی بعداً تصمیم گرفته می‌شود."};
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','fa');
const S=k=>(S0[k]||{}).text||k,$=id=>document.getElementById(id);
let mode='a';
/* حالت‌ها: a = اولین بار (فقط «شروع»)، b = کودک برگشته، t = مسیر تمام‌شده (مثل b، جای دیگر) */
function render(){
 const first=mode==='a',place=mode==='t'?R['sample.place.t']:R['sample.place.b'];
 $('t').textContent=S('entry.title');$('sb').textContent=S('entry.sub');
 $('hello').textContent=first?S('entry.hello.first'):S('entry.hello').replace('{name}',R['sample.name']);
 $('gol').textContent=S(first?'entry.start':'entry.cont');
 $('here').hidden=first;$('here').textContent=S('entry.here').replace('{place}',place);
 $('tiles').hidden=first;$('tc').textContent=S('entry.cards');$('tp').textContent=S('entry.practice');$('tg').textContent=S('entry.guide');
 $('gl').textContent=S('entry.grown');$('hl').textContent=S('entry.hold');$('sx').textContent=S('entry.sheet.close');
 $('rvt').textContent=R.banner;
 for(const [id,m] of [['ma','a'],['mb','b'],['mt','t']]){$(id).textContent=R['mode.'+m];$(id).setAttribute('aria-pressed',mode===m)}
 fit();
}
for(const [id,m] of [['ma','a'],['mb','b'],['mt','t']])$(id).onclick=()=>{mode=m;render()};
let lastFocus=null;
function sheet(key){lastFocus=document.activeElement;$('sm').textContent=S(key);$('shd').hidden=false;$('sx').focus()}
function closeSheet(){$('shd').hidden=true;if(lastFocus)lastFocus.focus()}
$('sx').onclick=closeSheet;$('shd').onclick=e=>{if(e.target.id==='shd')closeSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('shd').hidden)closeSheet()});
const rm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
$('go').onclick=()=>{const k=mode==='a'?'entry.mock.start':'entry.mock.cont',f=$('fade');
 if(rm()){sheet(k);return}
 const an=f.animate([{opacity:0},{opacity:1}],{duration:450,fill:'forwards'});an.finished.then(()=>{sheet(k);an.cancel()})};
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>sheet('entry.mock.'+b.dataset.k));
/* B38: «ویژهٔ بزرگ‌ترها» = نگه‌داشتن ۲ ثانیه (بدون پرسش ریاضی)؛ رها کردن زودتر = لغو */
{const g=$('grown'),r=$('rg1'),L=94.25;let t0=0,raf=0,on=false;
 const stop=()=>{on=false;cancelAnimationFrame(raf);r.style.strokeDashoffset=L};
 const tick=()=>{if(!on)return;const p=Math.min(1,(performance.now()-t0)/2000);r.style.strokeDashoffset=L*(1-p);if(p>=1){stop();sheet('entry.mock.grown')}else raf=requestAnimationFrame(tick)};
 const start=()=>{if(on)return;on=true;t0=performance.now();raf=requestAnimationFrame(tick)};
 g.addEventListener('pointerdown',e=>{e.preventDefault();start()});['pointerup','pointercancel','pointerleave'].forEach(n=>g.addEventListener(n,stop));
 g.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();start()}});g.addEventListener('keyup',stop);g.addEventListener('blur',stop);
 g.addEventListener('contextmenu',e=>e.preventDefault())}
/* تصویر همیشه کادر را می‌پوشاند؛ پایین (دروازهٔ شروع و جاده) در دید می‌ماند */
function fit(){const sc=$('sc'),W=sc.clientWidth,H=sc.clientHeight,AR=780/440,ph=Math.max(H,W/AR),pw=ph*AR,pan=$('pan');
 pan.style.width=pw+'px';pan.style.height=ph+'px';pan.style.left=((W-pw)/2)+'px';pan.style.top=(H-ph)+'px'}
addEventListener('resize',fit);render();
</script>
