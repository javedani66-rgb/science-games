/* لایه‌های ثابت انتقال: هر لایه یک id (با پیشوند صفحه) و data-for؛ فقط opacity عوض می‌شود. روز←شب مستقیم 1.2ث. غروب میان‌یابی نیست. */
.lt-layer{opacity:0;transition:opacity var(--light-transition) ease-in-out}
[data-light="day"] .lt-layer[data-for~="day"],[data-light="dusk"] .lt-layer[data-for~="dusk"],[data-light="night"] .lt-layer[data-for~="night"]{opacity:1}
.lt-layer[data-for="windows"]{opacity:0}[data-light="night"] .lt-layer[data-for="windows"]{opacity:1}
@media (prefers-reduced-motion: reduce){.lt-layer{transition:none}}
/* شدت rim/سایهٔ بناهای env (کلاس‌های .elit/.esh در node_*.svg مقدار ثابت دارند؛ این‌ها آن‌ها را به نور وصل می‌کنند). شخصیت‌ها خودشان var(--l-lit-a) و var(--l-shade-a) می‌خوانند. */
[data-light] .elit{opacity:var(--l-nlit-a,.3)}
[data-light] .esh{opacity:var(--l-nshade-a,.22)}

:root{--navy:#241a5e;--edge:#120c3a;--cream:#fff3c4;--gold:#ffd23f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;display:flex;flex-direction:column;background:#10083a;color:var(--navy);font:400 16px/1.6 Vazirmatn,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--cream);outline-offset:2px}
#rv{min-height:40px;background:#2b3a2b;color:#fff;display:flex;align-items:center;padding:6px 16px;font-size:14px;gap:8px;flex-wrap:wrap}
#rv span{flex:1;min-width:0}
#root{height:100%;display:flex;flex-direction:column}
#page{display:flex;flex-direction:column;flex:1;min-height:0}
#sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;background:#16788c;scrollbar-width:none}
#sc::-webkit-scrollbar{display:none}
#world{position:relative;width:390px;height:1620px;transform-origin:0 0}
#world svg.map{position:absolute;left:0;top:0;display:block}
.hit{position:absolute;border-radius:24px;min-width:48px;min-height:48px}
.hit:focus-visible{outline:4px solid var(--gold)}
.hit.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#boat{position:absolute;left:0;top:0;width:130px;height:130px;display:none;pointer-events:none}
#boat svg{display:block}
.foam{position:absolute;left:0;top:0;width:26px;height:10px;margin:-5px 0 0 -13px;border-radius:50%;background:var(--cream);opacity:0;pointer-events:none}
#fig{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#tilt{transform-origin:50% 58%}
#fimg{height:56px;width:auto;max-width:none;display:block;transform-origin:50% 100%;
 filter:drop-shadow(2.5px 0 0 var(--cream)) drop-shadow(-2.5px 0 0 var(--cream)) drop-shadow(0 2.5px 0 var(--cream)) drop-shadow(0 -2.5px 0 var(--cream))}
#bar{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#d5ecf4;border-top:3px solid var(--navy);display:flex;align-items:center;gap:10px;min-height:76px}
#st{flex:1;min-width:0;margin:0;text-align:center;background:var(--cream);border:2.6px solid var(--navy);border-radius:24px;padding:4px 14px;min-height:48px;display:flex;align-items:center;justify-content:center}
.btn{min-height:56px;min-width:96px;border:3.5px solid var(--navy);border-radius:18px;background:var(--gold);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:16px;padding:6px 12px}
.btn[hidden]{display:none}
.btn.sec{background:var(--cream)}
.pr{transform-box:fill-box;transform-origin:center;animation:stamp .32s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.pr{animation:none}}
</style>

/* پرش دراماتیک به جای قبلاً‌رفته (D86): یک پرش بلند با چرخش و له‌شدن؛ حدود نیم‌ثانیه */
async function dramatic(a,b){const A=NODES[a],B=NODES[b],seaB=isSea(B.y),dist=Math.hypot(B.x-A.x,B.y-A.y),hgt=Math.min(260,90+dist*.18);
 const y0=isSea(A.y)?A.y-4:A.y,y1=seaB?B.y-4:B.y;
 await tween(150,p=>{setTilt(0,0,1-.18*Math.sin(p*Math.PI/2))});
 await tween(520,p=>{const x=A.x+(B.x-A.x)*p,y=y0+(y1-y0)*p-4*hgt*p*(1-p);placeFig(x,y);if(boat.style.display==='block')placeBoat(x,y-SEAT,0);setTilt(360*p,0,1+.12*Math.sin(p*Math.PI));follow(y)},ease);
 setOutfit(seaB);showBoat(seaB);if(seaB)placeBoat(B.x,B.y-SEAT-4,0);
 await tween(220,p=>{setTilt(0,0,1-.14*Math.sin(p*Math.PI))});setTilt(0,0,1);placeFig(B.x,y1)}
async function run(fn){if(busy)return;busy=true;skip=false;$('skip').hidden=reduce;$('again').hidden=true;try{await fn()}finally{busy=false;skip=false;$('skip').hidden=true;$('again').hidden=false}}
function status(){$('st').textContent=T('here').replace('%s',NODES[here].title||'')||T('hint')}
async function go(id){if(busy||id===here)return;const up=nextUp();
 if(visited.has(id)){await run(()=>dramatic(here,id));here=id}
 else if(id===up){await run(()=>travel(here,id));visited.add(id);here=id;showPrints(true)}
 else{const e=document.querySelector('[data-id="'+id+'"]');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');return}
 status();refreshRing();updateTrail()}
const ring=document.createElement('div');ring.style.cssText='position:absolute;pointer-events:none;border:4px solid #ffd23f;border-radius:50%;opacity:.95;box-shadow:0 0 0 3px #241a5e';world.appendChild(ring);
function refreshRing(){const n=NODES[here],q=pd(n),rx=q.rx+7,ry=q.ry+q.w/2+5;ring.style.left=(n.x-rx)+'px';ring.style.top=(n.y+q.w/2+2-ry)+'px';ring.style.width=(2*rx)+'px';ring.style.height=(2*ry)+'px';ring.style.clipPath='inset(50% -6px -6px -6px)';ring.style.borderWidth='3.5px';ring.style.boxShadow='0 0 0 2.5px #241a5e'}
ids.forEach(i=>{const n=NODES[i],h=n.hit;const b=document.createElement('button');b.className='hit';b.dataset.id=i;b.setAttribute('aria-label',T('node.label').replace('%s',n.title||i));
 b.style.cssText='left:'+h[0]+'px;top:'+h[1]+'px;width:'+Math.max(48,h[2])+'px;height:'+Math.max(48,h[3])+'px';b.onclick=()=>go(i);world.appendChild(b)});
$('skip').onclick=()=>{skip=true};
$('again').onclick=()=>{if(busy)return;visited.clear();ORDER.filter(i=>NODES[i].y>=1200).forEach(i=>visited.add(i));here='E03';putAt(here);status();refreshRing();sc.scrollTop=Math.max(0,NODES[here].y*k-sc.clientHeight*.55);updateTrail();resetPrints();showPrints(true)};
fit();putAt(here);status();refreshRing();updateTrail();showPrints(false);addEventListener('load',()=>{fit();sc.scrollTop=Math.max(0,NODES[here].y*k-sc.clientHeight*.55)});
</script>
