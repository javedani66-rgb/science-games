<script>
const S={{STRINGS}};const REV={{REVIEW}};const NODES={{NODES}};const IM={{IMAGES}};const PATHD={{PATHD}};const COAST={{COAST}};
const T=k=>S['maptravel.'+k].text;const $=id=>document.getElementById(id);
$('rvt').textContent=REV.note;$('rvl').textContent=REV.legend;$('skip').textContent=T('skip');$('again').textContent=T('again');$('fin').textContent=T('finish');$('ovt').textContent=T('hide.title');$('t_rev').textContent=T('hide.review');$('t_card').textContent=T('hide.cards');$('t_sea').textContent=T('hide.sea');$('t_cr').textContent=T('hide.credits');$('ovc').textContent=T('hide.close');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let skip=false,busy=false;
const sc=$('sc'),world=$('world'),fig=$('fig'),tilt=$('tilt'),fimg=$('fimg'),boat=$('boat');
let k=1;
function fit(){k=Math.min(1.2,sc.clientWidth/390);world.style.transform='scale('+k+')';world.style.marginBottom=(({{H}}*k)-{{H}})+'px';world.style.width='390px'}
addEventListener('resize',fit);
/* هندسهٔ مسیر */
const NS='http://www.w3.org/2000/svg';const pth=document.createElementNS(NS,'path');pth.setAttribute('d',PATHD);document.querySelector('svg.map').appendChild(pth);pth.setAttribute('fill','none');pth.style.display='none';
const L=pth.getTotalLength(),samp=[];for(let s=0;s<=L;s+=2){const p=pth.getPointAtLength(s);samp.push([p.x,p.y,s])}
function sOf(n){let best=1e9,bs=0;for(const p of samp){const d=(p[0]-n.x)**2+(p[1]-n.y)**2;if(d<best){best=d;bs=p[2]}}return bs}
const ids=Object.keys(NODES);ids.forEach(i=>NODES[i].s=sOf(NODES[i]));
const ORDER=ids.sort((a,b)=>NODES[a].s-NODES[b].s);
const isSea=(y,x)=>y<COAST&&!(x!==undefined&&x>=JX-6&&y>=JTIP); /* با x: راهِ اسکله (x≥۳۳۴ و y≥۹۵۸) خشکی حساب می‌شود */
function leg(a,b){const pts=[];const s0=NODES[a].s,s1=NODES[b].s,dir=s1>s0?1:-1;for(let s=s0;dir>0?s<=s1:s>=s1;s+=3*dir){const p=pth.getPointAtLength(s);pts.push([p.x,p.y])}const A=NODES[a],B=NODES[b];while(pts.length>2&&inOuter(A,pts[0][0],pts[0][1]))pts.shift();while(pts.length>2&&inOuter(B,pts[pts.length-1][0],pts[pts.length-1][1]))pts.pop(); /* R19: ردِ مسیر داخل سکوی مبدأ/مقصد حذف شود تا کودک اول به مرکز سکو و بعد برنگردد */
 pts.unshift(stand(A));pts.push(stand(B));return pts}
/* وضعیت */
let here='E03';const visited=new Set(ORDER.filter(i=>NODES[i].y>=1200));const done=new Set(ORDER.slice(0,ORDER.indexOf('E03'))); /* D137: ردپاهای بند پس از «تکمیل ایستگاه» می‌آیند */
const NEXT=()=>ORDER.slice().reverse().find(i=>!visited.has(i)&&true);
function nextId(){const r=ORDER.filter(i=>!visited.has(i));return r.length?r.reduce((m,i)=>NODES[i].s>NODES[m].s?i:m,r[0]):null} // اولین ناانجام در راه (از پایین)
function nextUp(){const vs=ORDER.filter(i=>visited.has(i));if(!vs.length)return ORDER[0];const top=vs.reduce((m,i)=>NODES[i].s>NODES[m].s?i:m,vs[0]);const idx=ORDER.indexOf(top);return ORDER[idx+1]||null}
/* ردپا و نقطه‌چین بنفش (B76/D94/D95): خشکی و اسکله = ردپا روی کل راه؛ دریا = نقطه‌چین بنفش تا گرهٔ بعدی */
const svgMap=document.querySelector('svg.map');
const landG=svgMap.querySelector('g[clip-path="url(#cl_land)"]'),seaG=svgMap.querySelector('#seadots');
const prints=document.createElementNS(NS,'g');prints.id='prints';(svgMap.querySelector('#env_labels')||svgMap.lastElementChild).before(prints);
/* ردپا فقط پس از گذر از هر مرحله، از همان ایستگاه (روی سطح آن) تا ایستگاه بعد حک می‌شود (D99) */
/* R17-09: اسکلهٔ چوبی از شن شروع می‌شود (y≈۱۰۶۸) و روی آب تا نوک ۹۵۶ می‌رود؛ پایه‌ها در آب؛ سکوی سنگی حذف شد. راه ساحلی زیر انتهای اسکله به آن می‌رسد.
   R17-07: پلهٔ سنگی کوچک (آپرون) راهِ بالای بارانداز را به لبهٔ سکوی M02 می‌چسباند. خط دور یک‌پارچه: اول همهٔ شکل‌ها با خط دور، بعد پر. */
const JX=343,JTIP=956,JDOT=964,JEND=1070,BERTH=[298,964];
const jet=document.createElementNS(NS,'g');jet.id='jetty';jet.setAttribute('filter','url(#env_wob)');
(function(){const Q=(x,y,w,h,r,f,sw)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+f+'" stroke="#241a5e" stroke-width="'+sw+'" stroke-linejoin="round"/>';
 const x0=JX-13.5,w=27,DECK_END=1112;let h='';
 /* R18: عرض عرشه = عرض راه (۳۳ با خط دور)؛ راه از زیر پله‌های ورودی ادامه می‌یابد و خط دورِ سرمه‌ای‌شان یکی است؛ پلهٔ سنگی حذف شد */
 /* R19b: عرشه تا زیر لبهٔ پشتی سکوی M02 ادامه دارد (اسکله پیش از گروه M02 در DOM است، پس سکو روی آن می‌نشیند)؛ بدون پله و تخته‌ٔ کج */
 h+='<rect x="'+(x0+3)+'" y="962" width="'+w+'" height="76" rx="6" fill="#0c0838" opacity=".28"/>';
 [966,1004,1034].forEach(y=>{[x0-2,x0+w+2].forEach(px=>{h+=Q(px-3,y-5,6,11,3,'#7a4a28',2.6)})});
 h+=Q(x0,JTIP,w,DECK_END-JTIP,5,'#c98f52',5.5);
 for(let y=JTIP+8;y<DECK_END-4;y+=9)h+='<path d="M'+(x0+3)+','+y+' H'+(x0+w-3)+'" stroke="#8a5a30" stroke-width="2.2" stroke-linecap="round"/>';
 jet.innerHTML=h})();
{const m2=svgMap.querySelector('g.node[data-id="M02"]');(m2||prints).before(jet)}
/* ردپا (D99/D100/D101): هر ایستگاه یک سکوی بالا آمده است. ردپا از پهلوی سکو (جایی که دیواره باریک دیده می‌شود) روی سطح بالایی می‌رود،
   از بدنهٔ ساختمان نمی‌گذرد و بیرون سکو روی زمین راه را دنبال می‌کند. */
const pd=n=>({rx:n.pad[0],ry:n.pad[1],w:n.pad[2],bh:n.pad[3]});
const inOuter=(n,x,y)=>{const q=pd(n),dx=x-n.x,dy=y-n.y-q.w/2;return (dx/(q.rx+14))**2+(dy/(q.ry+q.w/2+12))**2<1};
const inBuild=(x,y)=>Object.values(NODES).some(n=>{const q=pd(n);return Math.abs(x-n.x)<q.rx*.72&&y<n.y-q.ry*.5&&y>n.y-q.bh-q.ry});
const onJetty=(x,y)=>x>JX-7&&x<JX+7&&y>JTIP+12&&y<1070; /* جاده روی اسکله و سکوی فرود؛ دیوارهٔ سکو (۱۰۵۶ تا ۱۰۷۲) ردپا ندارد */
const onWall=()=>false;
function legPoly(k){const A=NODES[ORDER[k]],B=NODES[ORDER[k+1]],sB=B.s;
 // فقط راهِ بیرون از سکوها؛ ردپا روی ایستگاه نمی‌افتد (D102)
 const pts=[];let i=samp.findIndex(p=>p[2]>=A.s);
 while(i<samp.length&&inOuter(A,samp[i][0],samp[i][1]))i++;
 for(;i<samp.length&&samp[i][2]<sB&&!inOuter(B,samp[i][0],samp[i][1]);i++)pts.push([samp[i][0],samp[i][1]]);
 return pts}
/* حریم ردپا (D112): جعبهٔ هر بخش از ایستگاه (سکو، بنا، پیچ، ...؛ بدون سایه) + حاشیه؛ ردپا باید از همهٔ آن‌ها ≥ ۱۵px (لبهٔ ردپا) فاصله داشته باشد */
const EXC=[],PRINT_R=10,GAP=15,POFF=5.2,PSC=.9; /* R17-10: ردپا کوچک‌تر و نزدیک‌تر به محور تا کاملاً داخل پر راه (۲۲ واحد) بماند */
(function(){const mr=svgMap.getBoundingClientRect(),kk=mr.width/390;
 svgMap.querySelectorAll('g.node').forEach(g=>{const u=g.querySelector('use');if(!u)return;const sym=document.querySelector(u.getAttribute('href'));if(!sym)return;
  const vb=(sym.getAttribute('viewBox')||'0 0 200 190').split(/\s+/).map(Number);
  const tg=document.createElementNS(NS,'g');tg.setAttribute('transform','translate('+u.x.baseVal.value+' '+u.y.baseVal.value+') scale('+(u.width.baseVal.value/vb[2])+' '+(u.height.baseVal.value/vb[3])+')');tg.style.visibility='hidden';
  [...sym.children].forEach(c=>{if(c.tagName==='defs'||/_(shadow|lit|shade)$/.test(c.id))return;const cl=c.cloneNode(true);cl.removeAttribute('id');tg.appendChild(cl)});
  svgMap.appendChild(tg);
  [...tg.children].forEach(c=>{const r=c.getBoundingClientRect();if(r.width<1||r.height<1)return;EXC.push([(r.left-mr.left)/kk,(r.top-mr.top)/kk,(r.right-mr.left)/kk,(r.bottom-mr.top)/kk])});
  tg.remove()})})();
const nearStn=(x,y,g)=>EXC.some(b=>{const dx=Math.max(b[0]-x,0,x-b[2]),dy=Math.max(b[1]-y,0,y-b[3]);return Math.hypot(dx,dy)<(g===undefined?GAP:g)+PRINT_R});
const PLACED=[];
(function(){
 for(let k=0;k<ORDER.length-1;k++){const P=legPoly(k);let acc=0,side=1,need=0;
  for(let m=1;m<P.length;m++){const [x0,y0]=P[m-1],[x1,y1]=P[m],L=Math.hypot(x1-x0,y1-y0);if(!L)continue;const ang=Math.atan2(y1-y0,x1-x0);
   while(need<=L){const x=x0+(x1-x0)*need/L,y=y0+(y1-y0)*need/L;need+=26;
    const jt=onJetty(x,y),po=jt?5:POFF; /* روی عرشه: ردپا یک‌درمیان چپ/راست داخل عرشه؛ حریم بنای بارانداز کوچک‌تر (عرشه راه تنهاست) */
    if(!(y>=COAST+14||jt)||onWall(x,y)||y>{{H}}-8||(!jt&&inBuild(x,y))||Object.values(NODES).some(n=>inOuter(n,x,y))||(!jt&&nearStn(x-Math.sin(ang)*po*side,y+Math.cos(ang)*po*side))||PLACED.some(q=>Math.hypot(q[0]-x,q[1]-y)<19))continue;PLACED.push([x,y]);
    const g=document.createElementNS(NS,'g');g.dataset.leg=k;g.dataset.px=(x-Math.sin(ang)*po*side).toFixed(1);g.dataset.py=(y+Math.cos(ang)*po*side).toFixed(1);g.dataset.s=k*100000+acc+need;g.style.display='none';
    g.setAttribute('transform','translate('+(x-Math.sin(ang)*po*side).toFixed(1)+' '+(y+Math.cos(ang)*po*side).toFixed(1)+') rotate('+(ang*180/Math.PI+90).toFixed(0)+')');
    g.innerHTML='<g class="pr"><g transform="scale('+(PSC*side)+' '+PSC+')" fill="#a66be8" stroke="#2a0f5e" stroke-width="1" stroke-linejoin="round"><path d="M-3.1,-1.5 C-3.2,-3.4 -1.6,-4.2 0.2,-4.2 C2,-4.2 3.3,-3.4 3.2,-1.2 C3.1,0.8 2.1,1.6 2,3 C1.9,4.8 0.9,5.8 -0.5,5.8 C-1.9,5.8 -2.4,4.6 -2.3,3 C-2.2,1.5 -3,0.6 -3.1,-1.5Z"/><circle cx="-1.9" cy="-6.1" r="1.6"/><circle cx="0.4" cy="-7.1" r="1.25"/><circle cx="2.2" cy="-6.6" r="1.15"/><circle cx="3.5" cy="-5.3" r="1.05"/><circle cx="4" cy="-3.6" r=".95"/></g></g>';
    side=-side;prints.appendChild(g)}
   need-=L;acc+=L}}})();
/* animate=true: ردپاهای تازه یکی‌یکی (از ایستگاه به سمت بعد) حک می‌شوند */
function showPrints(animate){const fresh=[];prints.childNodes.forEach(g=>{const vis=done.has(ORDER[+g.dataset.leg]);if(!vis){g.style.display='none';g.dataset.on='';return}
  if(g.dataset.on)return;g.dataset.on='1';g.style.display='';fresh.push(g)});
 fresh.sort((u,v)=>u.dataset.s-v.dataset.s).forEach((g,n)=>{const e=g.firstChild;e.style.animation='none';void e.getBoundingClientRect();e.style.animationDelay=animate?(n*55)+'ms':'0ms';e.style.animation=animate?'':'none'})}
function resetPrints(){prints.childNodes.forEach(g=>{g.style.display='none';g.dataset.on=''})}
/* R17-26: نقطه‌چین قایق؛ هر بند (از گرهٔ A تا B) فاصلهٔ یکنواخت دارد: از نوک اسکله / لبهٔ سکو شروع و به لبهٔ سکوی بعد می‌رسد (آخرین نقطه کنار لبه، نه زیر سکو) */
const DOT_STEP=18,DOT_EDGE=9;

async function go(id){if(busy)return;if(id===here){if(id==='M12')openHide();return} /* D143: ورود به مخفی‌گاه مثل بقیهٔ ایستگاه‌ها: لمس خود ایستگاه، نه دکمهٔ جدا */
 const up=nextUp();
 if(visited.has(id)){await run(()=>dramatic(here,id));here=id}
 else if(id===up){if(!done.has(ORDER[ORDER.indexOf(up)-1])){const e=document.querySelector('[data-id="'+id+'"]');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');$('st').textContent=T('needfin');return}await run(()=>travel(here,id));curLeg=-1;visited.add(id);here=id;showPrints(true)}
 else{const e=document.querySelector('[data-id="'+id+'"]');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');return}
 status();refreshRing();updateTrail()}
const ring=document.createElement('div');ring.style.cssText='position:absolute;pointer-events:none;border:4px solid #ffd23f;border-radius:50%;opacity:.95;box-shadow:0 0 0 3px #241a5e';world.appendChild(ring);
function updateLocks(){document.querySelectorAll('.lock').forEach(l=>l.classList.toggle('open',visited.has(l.dataset.lock)))} /* R20: قفل ایستگاه پس از رسیدن کودک باز می‌شود (محو آرام) */
function fadeRing(){const old=document.getElementById('ringG');if(!old)return;old.id='ringOld';old.style.opacity=0;setTimeout(()=>old.remove(),reduce?0:520)}
function refreshRing(){updateLocks();ring.style.display='none';const old=document.getElementById('ringG');if(old)old.remove();
 const n=NODES[here],q=pd(n),g=n.rg||[0,0,0],rx=q.rx+5+g[0],ry=q.ry+q.w/2+3+g[1],cx=n.x+g[2],cy=n.y+q.w/2+2;
 const nd=svgMap.querySelector('.node[data-id="'+here+'"]');if(!nd)return;
 const G=document.createElementNS('http://www.w3.org/2000/svg','g');G.id='ringG';
 const mk=(w,c)=>{const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',rx);e.setAttribute('ry',ry);e.setAttribute('fill','none');e.setAttribute('stroke',c);e.setAttribute('stroke-width',w);return e};
 G.appendChild(mk(9.5,'#241a5e'));G.appendChild(mk(4,'#ffd23f'));
 G.style.opacity=0;nd.parentNode.insertBefore(G,nd);void G.getBoundingClientRect();G.style.opacity=1}
ids.forEach(i=>{const n=NODES[i],h=n.hit;const b=document.createElement('button');b.className='hit';b.dataset.id=i;b.setAttribute('aria-label',T('node.label').replace('%s',n.title||i));
 b.style.cssText='left:'+h[0]+'px;top:'+h[1]+'px;width:'+Math.max(48,h[2])+'px;height:'+Math.max(48,h[3])+'px';b.onclick=()=>go(i);world.appendChild(b)});
$('skip').onclick=()=>{skip=true};
$('again').onclick=()=>{if(busy)return;visited.clear();done.clear();ORDER.filter(i=>NODES[i].y>=1200).forEach(i=>visited.add(i));ORDER.slice(0,ORDER.indexOf('E03')).forEach(i=>done.add(i));here='E03';putAt(here);status();refreshRing();sc.scrollTop=Math.max(0,NODES[here].y*k-sc.clientHeight*.55);updateTrail();resetPrints();showPrints(true)};
fit();putAt(here);status();refreshRing();updateTrail();showPrints(false);addEventListener('load',()=>{fit();sc.scrollTop=Math.max(0,NODES[here].y*k-sc.clientHeight*.55)});
</script>
