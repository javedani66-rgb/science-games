<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نقشه و سفر</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(data:font/woff2;base64,{{FONT_VR}}) format("woff2")}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(data:font/woff2;base64,{{FONT_VB}}) format("woff2")}
@font-face{font-family:Lalezar;font-weight:400;src:url(data:font/woff2;base64,{{FONT_L}}) format("woff2")}
{{LIGHTCSS}}
:root{--navy:#241a5e;--edge:#120c3a;--cream:#fff3c4;--gold:#ffd23f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;display:flex;flex-direction:column;background:#10083a;color:var(--navy);font:400 16px/1.6 Vazirmatn,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--cream);outline-offset:2px}
#rv{min-height:40px;background:#2b3a2b;color:#fff;display:flex;align-items:center;padding:6px 16px;font-size:14px;gap:8px;flex-wrap:wrap}
#rv span{flex:1;min-width:0}
#root{height:100%;display:flex;flex-direction:column}
#page{display:flex;flex-direction:column;flex:1;min-height:0}
#sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;background:#16788c;scrollbar-width:none}
#sc::-webkit-scrollbar{display:none}
#world{position:relative;width:390px;height:{{H}}px;transform-origin:0 0}
#world svg.map{position:absolute;left:0;top:0;display:block}
.hit{position:absolute;border-radius:24px;min-width:48px;min-height:48px}
.hit:focus-visible{outline:4px solid var(--gold)}
.hit.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#boat{position:absolute;left:0;top:0;width:130px;height:130px;display:none;pointer-events:none}
#boat svg{display:block}
.foam{position:absolute;left:0;top:0;width:26px;height:10px;margin:-5px 0 0 -13px;border-radius:50%;background:var(--cream);opacity:0;pointer-events:none}
#fig{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#tilt{transform-origin:50% 58%}
#fimg{height:56px;width:auto;max-width:none;display:block;transform-origin:50% 100%;
 filter:drop-shadow(2.5px 0 0 var(--cream)) drop-shadow(-2.5px 0 0 var(--cream)) drop-shadow(0 2.5px 0 var(--cream)) drop-shadow(0 -2.5px 0 var(--cream))}
#bar{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#d5ecf4;border-top:3px solid var(--navy);display:flex;align-items:center;gap:10px;min-height:76px}
#st{flex:1;min-width:0;margin:0;text-align:center;background:var(--cream);border:2.6px solid var(--navy);border-radius:24px;padding:4px 14px;min-height:48px;display:flex;align-items:center;justify-content:center}
.btn{min-height:56px;min-width:96px;border:3.5px solid var(--navy);border-radius:18px;background:var(--gold);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:16px;padding:6px 12px}
.btn[hidden]{display:none}
.btn.sec{background:var(--cream)}
.pr{transform-box:fill-box;transform-origin:center;animation:stamp .32s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.pr{animation:none}}
</style>
</head>
<body data-light="day">
{{SPRITE}}
<div id="rv"><span id="rvt"></span><span id="rvl"></span></div>
<div id="page">
<div id="sc"><div id="world">{{MAPSVG}}
<div id="foams"></div>
<div id="boat"><svg width="130" height="130" viewBox="0 0 120 120" aria-hidden="true"><use href="#env_dec_city_sail" width="120" height="120"/></svg></div>
<div id="fig"><div id="tilt"><img id="fimg" alt=""></div></div>
</div></div>
<div id="bar"><p id="st" aria-live="polite"></p><button class="btn" id="skip" hidden></button><button class="btn sec" id="again"></button></div>
</div>
<script>
const S={{STRINGS}};const REV={{REVIEW}};const NODES={{NODES}};const IM={{IMAGES}};const PATHD={{PATHD}};const COAST={{COAST}};
const T=k=>S['maptravel.'+k].text;const $=id=>document.getElementById(id);
$('rvt').textContent=REV.note;$('rvl').textContent=REV.legend;$('skip').textContent=T('skip');$('again').textContent=T('again');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let skip=false,busy=false;
const sc=$('sc'),world=$('world'),fig=$('fig'),tilt=$('tilt'),fimg=$('fimg'),boat=$('boat');
let k=1;
function fit(){k=Math.min(1.2,sc.clientWidth/390);world.style.transform='scale('+k+')';world.style.marginBottom=(({{H}}*k)-{{H}})+'px';world.style.width='390px'}
addEventListener('resize',fit);
/* هندسهٔ مسیر */
const NS='http://www.w3.org/2000/svg';const pth=document.createElementNS(NS,'path');pth.setAttribute('d',PATHD);document.querySelector('svg.map').appendChild(pth);pth.setAttribute('fill','none');pth.style.display='none';
const L=pth.getTotalLength(),samp=[];for(let s=0;s<=L;s+=2){const p=pth.getPointAtLength(s);samp.push([p.x,p.y,s])}
function sOf(n){let best=1e9,bs=0;for(const p of samp){const d=(p[0]-n.x)**2+(p[1]-n.y)**2;if(d<best){best=d;bs=p[2]}}return bs}
const ids=Object.keys(NODES);ids.forEach(i=>NODES[i].s=sOf(NODES[i]));
const ORDER=ids.sort((a,b)=>NODES[a].s-NODES[b].s);
const isSea=y=>y<JTIP;
function leg(a,b){const pts=[];const s0=NODES[a].s,s1=NODES[b].s,dir=s1>s0?1:-1;for(let s=s0;dir>0?s<=s1:s>=s1;s+=3*dir){const p=pth.getPointAtLength(s);pts.push([p.x,p.y])}pts.unshift(stand(NODES[a]));pts.push(stand(NODES[b]));return pts}
/* وضعیت */
let here='E03';const visited=new Set(ORDER.filter(i=>NODES[i].y>=1200));
const NEXT=()=>ORDER.slice().reverse().find(i=>!visited.has(i)&&true);
function nextId(){const r=ORDER.filter(i=>!visited.has(i));return r.length?r.reduce((m,i)=>NODES[i].s>NODES[m].s?i:m,r[0]):null} // اولین ناانجام در راه (از پایین)
function nextUp(){const vs=ORDER.filter(i=>visited.has(i));if(!vs.length)return ORDER[0];const top=vs.reduce((m,i)=>NODES[i].s>NODES[m].s?i:m,vs[0]);const idx=ORDER.indexOf(top);return ORDER[idx+1]||null}
/* ردپا و نقطه‌چین بنفش (B76/D94/D95): خشکی و اسکله = ردپا روی کل راه؛ دریا = نقطه‌چین بنفش تا گرهٔ بعدی */
const svgMap=document.querySelector('svg.map');
const landG=svgMap.querySelector('g[clip-path="url(#cl_land)"]'),seaG=svgMap.querySelector('g[clip-path="url(#cl_sea)"]');
const prints=document.createElementNS(NS,'g');prints.id='prints';(svgMap.querySelector('#env_labels')||svgMap.lastElementChild).before(prints);
/* ردپا فقط پس از گذر از هر مرحله، از همان ایستگاه (روی سطح آن) تا ایستگاه بعد حک می‌شود (D99) */
/* D118: سکوی فرود (سنگی، هم‌سبک سکوها) + اسکلهٔ چوبی در امتداد راه (عمودی در x=362)؛ خط دور یک‌پارچه:
   اول همهٔ شکل‌ها با خط دور تیره، بعد همه با رنگ پر بدون خط (درز ندارد) */
const JX=362,JTIP=972,JDOT=968,BERTH=[321,986];
const jet=document.createElementNS(NS,'g');jet.id='jetty';jet.setAttribute('filter','url(#env_wob)');
(function(){const R=(x,y,w,h,r)=>'x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'"';
 const shapes=[[336,1040,52,26,11],[336,1030,52,26,11],[348,JTIP,28,68,5]];
 let h='<g fill="#241a5e" stroke="#241a5e" stroke-width="11" stroke-linejoin="round">'+shapes.map(s=>'<rect '+R(...s)+'/>').join('')+'</g>';
 h+='<rect '+R(336,1040,52,26,11)+' fill="#6e72a8"/><rect '+R(348,JTIP,28,68,5)+' fill="#c98f52"/><rect '+R(336,1030,52,26,11)+' fill="#cfd3e2"/>';
 for(let y=JTIP+7;y<1022;y+=10)h+='<path d="M351,'+y+' L373,'+y+'" stroke="#8a5a30" stroke-width="2.4" stroke-linecap="round"/>';
 h+='<rect x="348" y="1023" width="28" height="6" fill="#7a4a28"/>';
 h+='<path d="M343,1043 l9,3 M372,1048 l9,-3" stroke="#9a9fc6" stroke-width="2.6" stroke-linecap="round"/>';
 [[347,JTIP+3],[377,JTIP+3]].forEach(p=>{h+='<rect x="'+(p[0]-5)+'" y="'+(p[1]-8)+'" width="10" height="14" rx="3" fill="#7a4a28" stroke="#241a5e" stroke-width="3.5"/>'});
jet.innerHTML=h})();
prints.before(jet);
/* ردپا (D99/D100/D101): هر ایستگاه یک سکوی بالا آمده است. ردپا از پهلوی سکو (جایی که دیواره باریک دیده می‌شود) روی سطح بالایی می‌رود،
   از بدنهٔ ساختمان نمی‌گذرد و بیرون سکو روی زمین راه را دنبال می‌کند. */
const pd=n=>({rx:n.pad[0],ry:n.pad[1],w:n.pad[2],bh:n.pad[3]});
const inOuter=(n,x,y)=>{const q=pd(n),dx=x-n.x,dy=y-n.y-q.w/2;return (dx/(q.rx+14))**2+(dy/(q.ry+q.w/2+12))**2<1};
const inBuild=(x,y)=>Object.values(NODES).some(n=>{const q=pd(n);return Math.abs(x-n.x)<q.rx*.72&&y<n.y-q.ry*.5&&y>n.y-q.bh-q.ry});
const onJetty=(x,y)=>x>JX-10&&x<JX+10&&y>JTIP+10&&y<1054; /* جاده روی اسکله و سکوی فرود؛ دیوارهٔ سکو (۱۰۵۶ تا ۱۰۷۲) ردپا ندارد */
const onWall=(x,y)=>x>334&&y>1054&&y<1074;
function legPoly(k){const A=NODES[ORDER[k]],B=NODES[ORDER[k+1]],sB=B.s;
 // فقط راهِ بیرون از سکوها؛ ردپا روی ایستگاه نمی‌افتد (D102)
 const pts=[];let i=samp.findIndex(p=>p[2]>=A.s);
 while(i<samp.length&&inOuter(A,samp[i][0],samp[i][1]))i++;
 for(;i<samp.length&&samp[i][2]<sB&&!inOuter(B,samp[i][0],samp[i][1]);i++)pts.push([samp[i][0],samp[i][1]]);
 return pts}
/* حریم ردپا (D112): جعبهٔ هر بخش از ایستگاه (سکو، بنا، پیچ، ...؛ بدون سایه) + حاشیه؛ ردپا باید از همهٔ آن‌ها ≥ ۱۵px (لبهٔ ردپا) فاصله داشته باشد */
const EXC=[],PRINT_R=13,GAP=15;
(function(){const mr=svgMap.getBoundingClientRect(),kk=mr.width/390;
 svgMap.querySelectorAll('g.node').forEach(g=>{const u=g.querySelector('use');if(!u)return;const sym=document.querySelector(u.getAttribute('href'));if(!sym)return;
  const vb=(sym.getAttribute('viewBox')||'0 0 200 190').split(/\s+/).map(Number);
  const tg=document.createElementNS(NS,'g');tg.setAttribute('transform','translate('+u.x.baseVal.value+' '+u.y.baseVal.value+') scale('+(u.width.baseVal.value/vb[2])+' '+(u.height.baseVal.value/vb[3])+')');tg.style.visibility='hidden';
  [...sym.children].forEach(c=>{if(c.tagName==='defs'||/_shadow$/.test(c.id))return;const cl=c.cloneNode(true);cl.removeAttribute('id');tg.appendChild(cl)});
  svgMap.appendChild(tg);
  [...tg.children].forEach(c=>{const r=c.getBoundingClientRect();if(r.width<1||r.height<1)return;EXC.push([(r.left-mr.left)/kk,(r.top-mr.top)/kk,(r.right-mr.left)/kk,(r.bottom-mr.top)/kk])});
  tg.remove()})})();
const nearStn=(x,y)=>EXC.some(b=>{const dx=Math.max(b[0]-x,0,x-b[2]),dy=Math.max(b[1]-y,0,y-b[3]);return Math.hypot(dx,dy)<GAP+PRINT_R});
(function(){
 for(let k=0;k<ORDER.length-1;k++){const P=legPoly(k);let acc=0,side=1,need=0;
  for(let m=1;m<P.length;m++){const [x0,y0]=P[m-1],[x1,y1]=P[m],L=Math.hypot(x1-x0,y1-y0);if(!L)continue;const ang=Math.atan2(y1-y0,x1-x0);
   while(need<=L){const x=x0+(x1-x0)*need/L,y=y0+(y1-y0)*need/L;need+=26;
    if(!(y>=COAST+14||onJetty(x,y))||onWall(x,y)||y>{{H}}-8||inBuild(x,y)||Object.values(NODES).some(n=>inOuter(n,x,y))||nearStn(x-Math.sin(ang)*6*side,y+Math.cos(ang)*6*side))continue;
    const g=document.createElementNS(NS,'g');g.dataset.leg=k;g.dataset.s=k*100000+acc+need;g.style.display='none';
    g.setAttribute('transform','translate('+(x-Math.sin(ang)*6*side).toFixed(1)+' '+(y+Math.cos(ang)*6*side).toFixed(1)+') rotate('+(ang*180/Math.PI+90).toFixed(0)+')');
    g.innerHTML='<g class="pr"><g fill="#f1dcff" stroke="#2a0f5e" stroke-width="2"><ellipse cx="0" cy="2.5" rx="5.2" ry="7"/><circle cx="-4.6" cy="-5.6" r="2.4"/><circle cx="0" cy="-8.4" r="2.5"/><circle cx="4.6" cy="-5.6" r="2.4"/></g></g>';
    side=-side;prints.appendChild(g)}
   need-=L;acc+=L}}})();
/* animate=true: ردپاهای تازه یکی‌یکی (از ایستگاه به سمت بعد) حک می‌شوند */
function showPrints(animate){const fresh=[];prints.childNodes.forEach(g=>{const vis=visited.has(ORDER[+g.dataset.leg]);if(!vis){g.style.display='none';g.dataset.on='';return}
  if(g.dataset.on)return;g.dataset.on='1';g.style.display='';fresh.push(g)});
 fresh.sort((u,v)=>u.dataset.s-v.dataset.s).forEach((g,n)=>{const e=g.firstChild;e.style.animation='none';void e.getBoundingClientRect();e.style.animationDelay=animate?(n*55)+'ms':'0ms';e.style.animation=animate?'':'none'})}
function resetPrints(){prints.childNodes.forEach(g=>{g.style.display='none';g.dataset.on=''})}
const trail=document.createElementNS(NS,'g');trail.id='trail';trail.setAttribute('filter','url(#env_wob)');seaG.parentNode.insertBefore(trail,seaG.nextSibling);
function updateTrail(){trail.innerHTML='';const b=nextUp();if(!b)return;const a=ORDER[ORDER.indexOf(b)-1]||here;let s0=NODES[a].s,s1=NODES[b].s;if(s0>s1)[s0,s1]=[s1,s0];
 let d='',gap=true;for(let s=s0;s<=s1;s+=4){const p=pth.getPointAtLength(s);if(p.y>=JDOT){gap=true;continue}d+=(gap?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1);gap=false}
 if(!d)return;trail.innerHTML='<path d="'+d+'" fill="none" stroke="#241a5e" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 17"/><path d="'+d+'" fill="none" stroke="#b07af0" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 17"/>'}
/* کاراکتر و قایق */
const SEAT=27,FH=56;
const scaleAt=()=>1;
function setOutfit(sea){fimg.src=sea?IM.sailor:IM.construction}
function placeFig(x,y){fig.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-100%)'}
function placeBoat(x,y,r){boat.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%) rotate('+r+'deg)'}
function setTilt(rot,bob,sq){tilt.style.transform='rotate('+rot+'deg) translateY('+bob+'px)';fimg.style.transform='scaleY('+(sq||1)+')'}
function showBoat(v){boat.style.display=v?'block':'none'}
/* قایق کنار سکو در آب پهلو می‌گیرد؛ کودک روی سکو می‌ایستد (D104) */
const dock=n=>{const q=pd(n),s=n.x<195?1:-1;return[n.x+s*(q.rx+30),n.y+q.w/2+6]};
const stand=n=>n.st?[n.x+n.st[0],n.y+n.st[1]]:[n.x,n.y+pd(n).ry*.6]; /* جای ایستادن: جلوی سکو، پایین مرکز بیضی بالایی (جلوی بنا) */
const padFig=stand;
function putAt(id){const n=NODES[id],sea=isSea(n.y);setOutfit(sea);showBoat(sea);if(sea){const d=dock(n);placeBoat(d[0],d[1]-SEAT-4,0);const f=padFig(n);placeFig(f[0],f[1])}else{const f=stand(n);placeFig(f[0],f[1])}setTilt(0,0)}
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function follow(y){if(skip||reduce)return;const t=y*k-sc.clientHeight*.55;sc.scrollTop=Math.max(0,t)}
function tween(ms,fn,e){return new Promise(res=>{if(reduce||skip){fn(1);res();return}const t0=performance.now();(function f(t){if(skip){fn(1);res();return}const p=Math.min(1,Math.max(0,(t-t0)/ms));fn(e?e(p):p);p<1?requestAnimationFrame(f):res()})(t0)})}
function cum(pts){const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return c}
function at(pts,c,d){let i=0;while(i<c.length-2&&d>c[i+1])i++;const u=c[i+1]>c[i]?Math.min(1,(d-c[i])/(c[i+1]-c[i])):1;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*u,pts[i][1]+(pts[i+1][1]-pts[i][1])*u]}
/* تلوتلوی عروسکی روی خشکی */
async function walk(pts){if(pts.length<2)return;const c=cum(pts),tot=c[c.length-1],SPD=130,STEP=40,A=5.5;
 await tween(tot/SPD*1000,p=>{const d=p*tot,[x,y]=at(pts,c,d);const env=Math.min(1,d/14,(tot-d)/18),ph=d/STEP*Math.PI,sn=Math.abs(Math.sin(ph));placeFig(x,y);setTilt(A*Math.sin(ph)*env,-2.5*sn*env,1-.03*(1-sn)*env);follow(y)});
 setTilt(0,0);const l=pts[pts.length-1];placeFig(l[0],l[1])}
/* قایق */
const foams=[];for(let i=0;i<8;i++){const d=document.createElement('div');d.className='foam';$('foams').appendChild(d);foams.push(d)}
const hist=[];
async function sail(pts){if(pts.length<2)return;const c=cum(pts),tot=c[c.length-1];hist.length=0;
 await tween(Math.max(1500,tot/95*1000),p=>{const [x,y]=at(pts,c,p*tot);const env=Math.min(1,p*6,(1-p)*6),roll=2.6*Math.sin(p*Math.PI*Math.max(2,tot/45))*env,bob=1.4*Math.sin(p*Math.PI*Math.max(3,tot/30))*env;
  placeBoat(x,y-SEAT-4+bob,roll);placeFig(x,y-4+bob);setTilt(-roll*.7,0);hist.push([x,y+6]);if(hist.length>70)hist.shift();
  foams.forEach((f,i)=>{const h=hist[hist.length-1-i*5];if(!h){f.style.opacity=0;return}f.style.opacity=Math.max(0,.75-i*.1)*env;f.style.transform='translate('+h[0]+'px,'+h[1]+'px) scale('+(1+i*.12)+')'});follow(y)},ease);
 foams.forEach(f=>f.style.opacity=0);setTilt(0,0)}
async function hopTo(a,b,h){await tween(380,p=>{placeFig(a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p-4*h*p*(1-p));setTilt(6*Math.sin(p*Math.PI)*(b[0]>a[0]?1:-1),0,1+.05*Math.sin(p*Math.PI))});
 await tween(150,p=>{setTilt(0,0,1-.07*Math.sin(p*Math.PI))});setTilt(0,0,1)}
/* سفر عادی به گرهٔ تازه: پاها روی خشکی، قایق روی دریا؛ در ساحل پرش */
const pts_last_land=(runs,r)=>{const i=runs.indexOf(r),q=runs[i-1];return q?q.pts[q.pts.length-1]:[JX,JTIP]};
async function travel(a,b){const pts=leg(a,b);const runs=[];let cur=[pts[0]],m=isSea(pts[0][1]);
 for(let t=1;t<pts.length;t++){const mt=isSea(pts[t][1]);cur.push(pts[t]);if(mt!==m){runs.push({m,pts:cur});cur=[pts[t]];m=mt}}
 runs.push({m,pts:cur});let sea=runs[0].m;
 const NA=NODES[a],NB=NODES[b],seaA=isSea(NA.y),seaB=isSea(NB.y);
 if(seaA){const d=dock(NA),r0=runs[0];r0.pts=[d,...r0.pts.filter(p=>!inOuter(NA,p[0],p[1]))];const f=padFig(NA);await hopTo(f,[d[0],d[1]-4],16)}
 if(seaB){const rl=runs[runs.length-1];if(rl.m)rl.pts=[...rl.pts.filter(p=>!inOuter(NB,p[0],p[1])),dock(NB)]}
 for(const r of runs){
  if(r.m!==sea){const p0=r.pts[0];
   if(r.m){const f0=pts_last_land(runs,r);setOutfit(true);showBoat(true);placeBoat(BERTH[0],BERTH[1]-SEAT-4,0);await hopTo(f0,[BERTH[0],BERTH[1]-4],18);r.pts=[BERTH,...r.pts.filter(p=>p[1]<JDOT)]}
   else{await hopTo([p0[0],p0[1]-4],p0,18);setOutfit(false);showBoat(false)}
   sea=r.m}
  if(r.m)await sail(r.pts);else await walk(r.pts)}
 const e=NODES[b];if(!isSea(e.y)){setOutfit(false);showBoat(false);const f=stand(e);placeFig(f[0],f[1])}
 else{const d=dock(e),f=padFig(e);placeBoat(d[0],d[1]-SEAT-4,0);await hopTo([d[0],d[1]-4],f,16);placeFig(f[0],f[1])}}
/* پرش دراماتیک به جای قبلاً‌رفته (D86): یک پرش بلند با چرخش و له‌شدن؛ حدود نیم‌ثانیه */
async function dramatic(a,b){const A=NODES[a],B=NODES[b],seaB=isSea(B.y),dist=Math.hypot(B.x-A.x,B.y-A.y),hgt=Math.min(260,90+dist*.18);
 const y0=stand(A)[1],y1=stand(B)[1];
 await tween(150,p=>{setTilt(0,0,1-.18*Math.sin(p*Math.PI/2))});
 await tween(520,p=>{const x=A.x+(B.x-A.x)*p,y=y0+(y1-y0)*p-4*hgt*p*(1-p);placeFig(x,y);setTilt(360*p,0,1+.12*Math.sin(p*Math.PI));follow(y)},ease);
 setOutfit(seaB);showBoat(seaB);if(seaB){const d=dock(B);placeBoat(d[0],d[1]-SEAT-4,0)}
 await tween(220,p=>{setTilt(0,0,1-.14*Math.sin(p*Math.PI))});setTilt(0,0,1);placeFig(stand(B)[0],y1)}
async function run(fn){if(busy)return;busy=true;skip=false;$('skip').hidden=reduce;$('again').hidden=true;try{await fn()}finally{busy=false;skip=false;$('skip').hidden=true;$('again').hidden=false}}
function status(){$('st').textContent=T('here').replace('%s',NODES[here].title||'')||T('hint')}
async function go(id){if(busy||id===here)return;const up=nextUp();
 if(visited.has(id)){await run(()=>dramatic(here,id));here=id}
 else if(id===up){await run(()=>travel(here,id));visited.add(id);here=id;showPrints(true)}
 else{const e=document.querySelector('[data-id="'+id+'"]');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');return}
 status();refreshRing();updateTrail()}
const ring=document.createElement('div');ring.style.cssText='position:absolute;pointer-events:none;border:4px solid #ffd23f;border-radius:50%;opacity:.95;box-shadow:0 0 0 3px #241a5e';world.appendChild(ring);
function refreshRing(){const n=NODES[here],q=pd(n),g=n.rg||[0,0,0],rx=q.rx+4+g[0],ry=q.ry+q.w/2+3+g[1];ring.style.left=(n.x+g[2]-rx)+'px';ring.style.top=(n.y+q.w/2+2-ry)+'px';ring.style.width=(2*rx)+'px';ring.style.height=(2*ry)+'px';ring.style.clipPath='inset('+Math.max(0,ry-q.w/2-2)+'px -6px -6px -6px)';ring.style.borderWidth='3.5px';ring.style.boxShadow='0 0 0 2.5px #241a5e'}
ids.forEach(i=>{const n=NODES[i],h=n.hit;const b=document.createElement('button');b.className='hit';b.dataset.id=i;b.setAttribute('aria-label',T('node.label').replace('%s',n.title||i));
 b.style.cssText='left:'+h[0]+'px;top:'+h[1]+'px;width:'+Math.max(48,h[2])+'px;height:'+Math.max(48,h[3])+'px';b.onclick=()=>go(i);world.appendChild(b)});
$('skip').onclick=()=>{skip=true};
$('again').onclick=()=>{if(busy)return;visited.clear();ORDER.filter(i=>NODES[i].y>=1200).forEach(i=>visited.add(i));here='E03';putAt(here);status();refreshRing();sc.scrollTop=Math.max(0,NODES[here].y*k-sc.clientHeight*.55);updateTrail();resetPrints();showPrints(true)};
fit();putAt(here);status();refreshRing();updateTrail();showPrints(false);addEventListener('load',()=>{fit();sc.scrollTop=Math.max(0,NODES[here].y*k-sc.clientHeight*.55)});
