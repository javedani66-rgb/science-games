<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(data:font/woff2;base64,{{FONT_VR}}) format("woff2")}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(data:font/woff2;base64,{{FONT_VB}}) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;font:400 16px/1.6 Vazirmatn,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#gm{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#1b2a41}
#gm[hidden],#gp[hidden]{display:none}
#gbar{flex:none;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:#241a5e;border-bottom:3px solid #120c3a}
#gbar button{min-height:48px;min-width:48px;padding:0 16px;border-radius:14px;border:3px solid #120c3a;font-weight:700;font-size:17px;color:#241a5e;background:#fff4d2;box-shadow:0 3px 0 #120c3a}
#gbar button:focus-visible,#gpbox button:focus-visible{outline:4px solid #fff;outline-offset:2px}
#gf{flex:1 1 auto;width:100%;border:0;background:#fff;min-height:0}
#gp{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(18,12,58,.78);padding:16px}
#gpbox{width:100%;max-width:400px;background:#fff4d2;border:4px solid #241a5e;border-radius:24px;padding:20px 18px;box-shadow:0 6px 0 #120c3a;color:#241a5e;text-align:center}
#gpbox h2{margin:0 0 6px;font-size:26px;line-height:1.4}
#gpbox p{margin:0 0 14px;font-size:16px;font-weight:700}
#gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#gg button,#gc{min-height:56px;border-radius:16px;border:3.5px solid #241a5e;background:#fff;font-weight:700;font-size:20px;color:#241a5e;box-shadow:0 4px 0 #120c3a}
#gg button[aria-pressed=true]{background:#2fb8a8;color:#fff}
#gc{margin-top:12px;width:100%;background:#fff4d2;font-size:18px}
</style>
</head>
<body>
<iframe id="fr"></iframe>
<div id="gm" hidden role="dialog" aria-modal="true"><div id="gbar"><button type="button" id="gback"></button><button type="button" id="gchg"></button></div><iframe id="gf"></iframe></div>
<div id="gp" hidden role="dialog" aria-modal="true"><div id="gpbox"><h2 id="gpt"></h2><p id="gpn"></p><div id="gg"></div><button type="button" id="gc"></button></div></div>
<script>
const STR={{STRINGS}};
const PAGES={{PAGES}};
const GAME={{GAME}};
const T=(k,o)=>{let s=(STR['demo.harbor.'+k]||{}).text||k;for(const x in (o||{}))s=s.replace('{'+x+'}',o[x]);return s};
/* index in the game's GRADES list: اول=8, دوم=0 … ششم=4 (harborBand maps 8,0 to 1-2; 1,2 to 3-4; 3,4 to 5-6) */
const GIDX={1:8,2:0,3:1,4:2,5:3,6:4};
const NS='smdemo:',$=id=>document.getElementById(id);
const lsGet=k=>{try{return localStorage.getItem(NS+k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(NS+k,v)}catch(e){}};
document.title=T('frame.title');$('gm').setAttribute('aria-label',T('game.title'));$('gback').textContent=T('game.back');$('gc').textContent=T('grade.cancel');$('gpt').textContent=T('grade.title');$('gpn').textContent=T('grade.note');
/* ---- the mockup pages: each is shown in the big frame; their own page changes (location.href=...) are caught by a small shim ---- */
const SHIM=(n,h)=>'<script>(function(){var N='+JSON.stringify(n)+',H='+JSON.stringify(h)+';window.__L={get href(){return N+".html"+H},set href(u){parent.postMessage({smnav:String(u)},"*")},get hash(){return H},get pathname(){return "/"+N+".html"}};window.__DEMOHARBOR=function(t){parent.postMessage({smharbor:t},"*")};try{history.replaceState=function(){}}catch(e){}})();<\/script>';
function openPage(url){const m=/^([a-z]+)\.html(#.*)?$/.exec(url);if(!m||!PAGES[m[1]]){console.warn('unknown page',url);return}
  const h=PAGES[m[1]].replace(/<head>/,'<head>'+SHIM(m[1],m[2]||''));$('fr').srcdoc=h;$('fr').dataset.page=m[1]}
/* ---- grade choice ---- */
function askGrade(cancelable,done){const box=$('gg');box.innerHTML='';const cur=lsGet('grade');
  for(let k=1;k<=6;k++){const b=document.createElement('button');b.type='button';b.textContent=T('grade.'+k);b.setAttribute('aria-pressed',String(cur==String(k)));b.dataset.g=k;b.onclick=()=>{lsSet('grade',String(k));$('gp').hidden=true;done(k)};box.appendChild(b)}
  $('gc').hidden=!cancelable;$('gc').onclick=()=>{$('gp').hidden=true};$('gp').hidden=false;box.firstChild.focus()}
/* ---- the real game, inside the full-screen cover ---- */
let CH=null;
const GAMEWRAP=(cfg)=>'<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>(function(){var P="smdemo:game:",M={};function S(){return{getItem:function(k){try{return localStorage.getItem(P+k)}catch(e){return M[k]===undefined?null:M[k]}},setItem:function(k,v){try{localStorage.setItem(P+k,v)}catch(e){M[k]=String(v)}},removeItem:function(k){try{localStorage.removeItem(P+k)}catch(e){delete M[k]}},clear:function(){M={}},key:function(){return null},get length(){return 0}}}try{Object.defineProperty(window,"localStorage",{value:S(),configurable:true})}catch(e){}var c='+JSON.stringify(cfg)+';c.exit=function(){parent.postMessage({smexit:1},"*")};window.__START=c})();<\/script></head><body>'+GAME+'</body></html>';
function launch(ch){CH=ch;const g=+lsGet('grade');if(!(g>=1&&g<=6)){askGrade(true,()=>launch(ch));return}
  let sv=null;try{const s=JSON.parse(localStorage.getItem('sw-save-v1'));sv=s&&s.profiles&&s.profiles[s.cur]}catch(e){}
  const cfg={env:'harbor',challenge:ch,grade:GIDX[g],name:(sv&&sv.name)||'',t:sv&&Number.isInteger(sv.ch)?Math.max(0,Math.min(7,sv.ch)):0};
  $('gchg').textContent=T('game.grade',{g:T('grade.'+g).replace('پایهٔ ','')});
  $('gf').srcdoc=GAMEWRAP(cfg);$('gm').hidden=false;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!localStorage.getItem('sw-reduce'))$('gm').animate([{transform:'translateX(100%)'},{transform:'none'}],{duration:500,easing:'cubic-bezier(.22,.08,.16,1)'});
  $('gback').focus()}
function closeGame(){$('gm').hidden=true;$('gf').srcdoc='<!doctype html><title></title>';CH=null}
$('gback').onclick=closeGame;
$('gchg').onclick=()=>{const ch=CH;askGrade(true,()=>launch(ch))};
addEventListener('message',e=>{const d=e.data||{};
  if(d.smnav){const u=d.smnav;
    if(/^overview\.html#o-a/.test(u)&&!(+lsGet('grade')>=1)){askGrade(false,()=>openPage(u));return}   /* new player: after the character, ask the grade once */
    openPage(u)}
  else if(d.smharbor!==undefined)launch(['green','orange','red'][d.smharbor]);
  else if(d.smexit)closeGame()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('gm').hidden&&$('gp').hidden)closeGame()});
openPage('index.html');
</script>
</body>
</html>
