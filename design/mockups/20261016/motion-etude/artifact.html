:root{--navy:#241a5e;--edge:#120c3a;--cream:#fff3c4;--gold:#ffd23f;--sea:#16788c;--sand:#f0cf7a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#e7e2d3;color:var(--navy);font:400 16px/1.6 Vazirmatn,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--navy);outline-offset:3px}
#rv{min-height:40px;background:#2b3a2b;color:#fff;display:flex;align-items:center;padding:6px 16px;font-size:14px}
#app{max-width:430px;margin:0 auto;background:#d5ecf4;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 40px)}
.title{margin:0;text-align:center;font:400 30px/1.3 Lalezar,Vazirmatn,sans-serif;color:var(--cream);-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;text-shadow:0 3px 0 var(--edge);word-spacing:.6em}
#stagewrap{position:relative;width:100%;margin-inline:auto;border:3.5px solid var(--navy);border-radius:28px;overflow:hidden;box-shadow:0 4px 0 var(--edge);background:var(--sea);isolation:isolate}
#world{position:absolute;left:0;top:0;width:360px;height:560px;transform-origin:0 0}
#world svg.bg{position:absolute;left:0;top:0}
#boat{position:absolute;left:0;top:0;width:160px;height:160px}
#boat svg{display:block}
.foam{position:absolute;left:0;top:0;width:30px;height:12px;margin:-6px 0 0 -15px;border-radius:50%;background:var(--cream);opacity:0}
#fig{position:absolute;left:0;top:0;transform-origin:0 0}
#tilt{transform-origin:50% 58%}
#fimg{height:76px;width:auto;max-width:none;display:block;transform-origin:50% 100%;
 filter:drop-shadow(2.5px 0 0 var(--cream)) drop-shadow(-2.5px 0 0 var(--cream)) drop-shadow(0 2.5px 0 var(--cream)) drop-shadow(0 -2.5px 0 var(--cream))}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 4.2s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes wv{from{transform:translateX(-6px);opacity:.45}to{transform:translateX(6px);opacity:1}}
.bob{transform-box:fill-box;transform-origin:50% 90%;animation:bo 3.2s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes bo{from{transform:translateY(-2px) rotate(-3deg)}to{transform:translateY(2px) rotate(3deg)}}
html.reduce .wv,html.reduce .bob{animation:none!important}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:56px;border:3.5px solid var(--navy);border-radius:18px;background:var(--gold);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:18px;padding:6px 12px}
.btn.sec{flex:0 0 auto;background:var(--cream);font-size:16px;min-width:96px}
.btn:active{box-shadow:0 4px 0 var(--edge);filter:brightness(.95)}
.btn[hidden]{display:none}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.chip{height:72px;border:3.5px solid var(--navy);border-radius:18px;background:var(--cream);box-shadow:0 3px 0 var(--edge);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-width:0}
.chip[aria-pressed=true]{background:var(--gold)}
.chip img{height:64px;width:auto;max-width:none}
.note{font-size:14px;margin:0;text-align:center}
#bar{position:sticky;bottom:0;margin:auto -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#d5ecf4;border-top:3px solid var(--navy);display:flex;flex-direction:column;gap:8px}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

const BOAT1={x:132,y:200};
async function sail(){const P0=[BOAT0.x,BOAT0.y],P1=[335,320],P2=[150,330],P3=[BOAT1.x,BOAT1.y];hist.length=0;
 await tween(4200,p=>{const [x,y]=bez(p,P0,P1,P2,P3);
  const env=Math.min(1,p*6,(1-p)*6),roll=2.6*Math.sin(p*Math.PI*6)*env,bob=1.8*Math.sin(p*Math.PI*9)*env;
  boatPos.x=x;boatPos.y=y+bob;boatPos.r=roll;placeBoat(boatPos.x,boatPos.y,boatPos.r);
  placeFig(x,y+bob+SEAT.y);setTilt(-roll*.7,0);
  hist.push([x,y+62]);if(hist.length>60)hist.shift();
  foams.forEach((f,i)=>{const h=hist[hist.length-1-i*6];if(!h){f.style.opacity=0;return}f.style.opacity=Math.max(0,.75-i*.1)*env;f.style.transform='translate('+h[0]+'px,'+h[1]+'px) scale('+(1+i*.12)+')'})},ease);
 foams.forEach(f=>f.style.opacity=0);setTilt(0,0)}
const POS={start:[38,545],pier:[198,424],pad2:[168,206],end:[226,190]};
async function run(fn){if(busy)return;busy=true;skip=false;$('go').hidden=true;$('skip').hidden=reduce;$('status').textContent=T('status.moving');
 try{await fn()}finally{busy=false;skip=false;$('skip').hidden=true;$('go').hidden=false}}
const STEPS=[
 ()=>walk([POS.start,[95,505],[145,478],POS.pier]),
 async()=>{const s=[BOAT0.x+SEAT.x,BOAT0.y+SEAT.y];await hop(POS.pier,s,24);boatPos.x=BOAT0.x;boatPos.y=BOAT0.y;await dip();await sail();await dip();await hop([boatPos.x,boatPos.y+SEAT.y],POS.pad2,24)},
 ()=>walk([POS.pad2,[200,198],POS.end]),
 async()=>{reset()}];
const AUTO=async()=>{await STEPS[0]();await STEPS[1]();await STEPS[2]()};
function reset(){placeFig(POS.start[0],POS.start[1]);setTilt(0,0);boatPos.x=BOAT0.x;boatPos.y=BOAT0.y;boatPos.r=0;placeBoat(BOAT0.x,BOAT0.y,0);foams.forEach(f=>f.style.opacity=0)}
function ui(){$('go').textContent=T(stage?'btn.again':'btn.go');$('status').textContent=T(stage?'status.3':'status.0')}
$('go').onclick=async()=>{if(busy)return;await run(stage?STEPS[3]:AUTO);stage=stage?0:1;ui()};
$('skip').textContent=T('btn.skip');$('skip').onclick=()=>{skip=true};
function redUi(){$('red').textContent=T(reduce?'btn.reduce.on':'btn.reduce.off');$('red').setAttribute('aria-pressed',reduce);document.documentElement.classList.toggle('reduce',reduce)}
$('red').onclick=()=>{reduce=!reduce;if(busy){skip=true;$('skip').hidden=true}redUi()};
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-label',T('chip.label').replace('%d',i+1));
 b.setAttribute('aria-pressed',i===0);b.innerHTML='<img alt="" src="'+IM[n].thumb+'">';b.onclick=()=>{if(busy)return;ch=i;pick()};$('chips').appendChild(b)});
function pick(){fimg.src=IM[NAMES[ch]].big;[...$('chips').children].forEach((c,i)=>c.setAttribute('aria-pressed',i===ch))}
pick();reset();redUi();fit();ui();addEventListener('load',fit);
</script>
</div>
