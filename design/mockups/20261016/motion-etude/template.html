<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اسکله و حرکت</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(data:font/woff2;base64,{{FONT_VR}}) format("woff2")}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(data:font/woff2;base64,{{FONT_VB}}) format("woff2")}
@font-face{font-family:Lalezar;font-weight:400;src:url(data:font/woff2;base64,{{FONT_L}}) format("woff2")}
:root{--navy:#241a5e;--edge:#120c3a;--cream:#fff3c4;--gold:#ffd23f;--sea:#16788c;--sand:#f0cf7a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#e7e2d3;color:var(--navy);font:400 16px/1.6 Vazirmatn,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--navy);outline-offset:3px}
#rv{min-height:40px;background:#2b3a2b;color:#fff;display:flex;align-items:center;padding:6px 16px;font-size:14px}
#app{max-width:430px;margin:0 auto;background:#d5ecf4;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 40px)}
.title{margin:0;text-align:center;font:400 30px/1.3 Lalezar,Vazirmatn,sans-serif;color:var(--cream);-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;text-shadow:0 3px 0 var(--edge);word-spacing:.6em}
#stagewrap{position:relative;width:100%;margin-inline:auto;border:3.5px solid var(--navy);border-radius:28px;overflow:hidden;box-shadow:0 4px 0 var(--edge);background:var(--sea);isolation:isolate}
#world{position:absolute;left:0;top:0;width:360px;height:560px;transform-origin:0 0}
#world svg.bg{position:absolute;left:0;top:0}
#boat{position:absolute;left:0;top:0;width:160px;height:160px}
#boat svg{display:block}
.foam{position:absolute;left:0;top:0;width:30px;height:12px;margin:-6px 0 0 -15px;border-radius:50%;background:var(--cream);opacity:0}
#fig{position:absolute;left:0;top:0;transform-origin:0 0}
#tilt{transform-origin:50% 58%}
#fimg{height:76px;width:auto;max-width:none;display:block;transform-origin:50% 100%;
 filter:drop-shadow(2.5px 0 0 var(--cream)) drop-shadow(-2.5px 0 0 var(--cream)) drop-shadow(0 2.5px 0 var(--cream)) drop-shadow(0 -2.5px 0 var(--cream))}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 4.2s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes wv{from{transform:translateX(-6px);opacity:.45}to{transform:translateX(6px);opacity:1}}
.bob{transform-box:fill-box;transform-origin:50% 90%;animation:bo 3.2s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes bo{from{transform:translateY(-2px) rotate(-3deg)}to{transform:translateY(2px) rotate(3deg)}}
html.reduce .wv,html.reduce .bob{animation:none!important}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:56px;border:3.5px solid var(--navy);border-radius:18px;background:var(--gold);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:18px;padding:6px 12px}
.btn.sec{flex:0 0 auto;background:var(--cream);font-size:16px;min-width:96px}
.btn:active{box-shadow:0 4px 0 var(--edge);filter:brightness(.95)}
.btn[hidden]{display:none}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.chip{height:72px;border:3.5px solid var(--navy);border-radius:18px;background:var(--cream);box-shadow:0 3px 0 var(--edge);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-width:0}
.chip[aria-pressed=true]{background:var(--gold)}
.chip img{height:64px;width:auto;max-width:none}
.note{font-size:14px;margin:0;text-align:center}
#bar{position:sticky;bottom:0;margin:auto -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#d5ecf4;border-top:3px solid var(--navy);display:flex;flex-direction:column;gap:8px}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="rv"><span id="rvt"></span></div>
{{SPRITE}}
<main id="app">
<h1 class="title" id="ttl"></h1>
<div id="stagewrap" role="img"><div id="world">
<svg class="bg" width="360" height="560" viewBox="0 0 360 560" aria-hidden="true">
 <rect width="360" height="560" fill="#16788c"/><rect width="360" height="90" fill="#1c8aa3" opacity=".4"/>
 <g id="waves"></g>
 <g class="bob" style="--d:-.8s"><use href="#env_dec_city_lighthouse" x="4" y="296" width="100" height="100"/></g>
 <g class="bob" style="--d:-1.6s"><use href="#env_dec_city_buoy" x="290" y="282" width="54" height="54"/></g>
 <g class="bob" style="--d:-2.4s"><use href="#env_dec_city_buoy" x="22" y="206" width="46" height="46"/></g>
 <g class="bob" style="--d:-.3s"><use href="#env_dec_city_crate" x="296" y="150" width="62" height="62"/></g>
 <use href="#node_12" x="70" y="18" width="220" height="209"/>
 <path d="M0 560V476C60 458 110 484 170 472C230 460 290 486 360 468V560Z" fill="#f0cf7a"/>
 <path d="M0 476C60 458 110 484 170 472C230 460 290 486 360 468" fill="none" stroke="#f9e6a8" stroke-width="7" opacity=".7"/>
 <path id="road" d="M30 560C60 526 100 506 145 480L170 442" fill="none" stroke="#241a5e" stroke-width="34" stroke-linecap="round"/>
 <path d="M30 560C60 526 100 506 145 480L170 442" fill="none" stroke="#736985" stroke-width="26" stroke-linecap="round"/>
 <path d="M30 560C60 526 100 506 145 480L170 442" fill="none" stroke="#fff3c4" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13" opacity=".8"/>
 <use href="#node_10" x="85" y="293" width="170" height="161"/>
</svg>
<div id="foams"></div>
<div id="boat"><svg width="160" height="160" viewBox="0 0 120 120" aria-hidden="true"><use href="#env_dec_city_sail" width="120" height="120"/></svg></div>
<div id="fig"><div id="tilt"><img id="fimg" alt=""></div></div>
</div></div>
<div class="row"><button class="btn sec" id="red" aria-pressed="false" style="flex:1"></button></div>
<div class="chips" id="chips"></div>
<p class="note" id="note"></p>
<div id="bar"><p id="status" aria-live="polite"></p><div class="row"><button class="btn" id="go"></button><button class="btn sec" id="skip" hidden></button></div></div>
</main>
<script>
const S={{STRINGS}};const REV={{REVIEW}};const IM={{IMAGES}};const NAMES={{NAMES}};
const T=k=>S['motionetude.'+k].text;const $=id=>document.getElementById(id);
$('ttl').textContent=T('title');$('stagewrap').setAttribute('aria-label',T('stage.label'));
$('rvt').textContent=REV.note;$('note').textContent=REV.sizes;
const W=360,H=560;
let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,skip=false,busy=false,stage=0,ch=0;
const wrap=$('stagewrap'),world=$('world'),fig=$('fig'),tilt=$('tilt'),fimg=$('fimg'),boat=$('boat');
function fit(){const pw=wrap.parentElement.clientWidth-32,top=wrap.getBoundingClientRect().top+scrollY,avail=innerHeight-top-$('bar').offsetHeight-16;
 const k=Math.max(.45,Math.min(pw/W,(avail-7)/H));wrap.style.width=(W*k+7)+'px';wrap.style.height=(H*k+7)+'px';world.style.transform='scale('+k+')'}
addEventListener('resize',fit);
/* موج‌ها (خط‌های روشن روی دریا مثل نقشه) */
(function(){let r=7,g='';const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 for(let i=0;i<26;i++){const x=8+rnd()*320,y=20+rnd()*430,n=1+Math.floor(rnd()*3);let d='M0 0';for(let k=0;k<n;k++)d+=(k?'t':'q')+(k?'12 0':'6 -7 12 0');
  g+='<g transform="translate('+x.toFixed(0)+' '+y.toFixed(0)+')"><g class="wv" style="--d:'+(-rnd()*4).toFixed(1)+'s;animation-duration:'+(3.4+rnd()*2).toFixed(1)+'s"><path d="'+d+'" fill="none" stroke="#5db3c6" stroke-width="2.6" stroke-linecap="round"/></g></g>'}
 $('waves').innerHTML=g})();
/* ردپای کف روی آب */
const foams=[];for(let i=0;i<8;i++){const d=document.createElement('div');d.className='foam';$('foams').appendChild(d);foams.push(d)}
const hist=[];
const scaleAt=y=>Math.min(1,.88+.12*(y-120)/360);
function placeFig(x,y){fig.style.transform='translate('+x+'px,'+y+'px) scale('+scaleAt(y)+') translate(-50%,-100%)'}
function placeBoat(x,y,rot){boat.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%) rotate('+rot+'deg)'}
const BOAT0={x:272,y:400},SEAT={x:0,y:34};
function setTilt(rot,bob,sq){tilt.style.transform='rotate('+rot+'deg) translateY('+bob+'px)';fimg.style.transform='scaleY('+(sq||1)+')'}
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function tween(ms,fn,e){return new Promise(res=>{if(reduce||skip){fn(1);res();return}
 const t0=performance.now();(function f(t){if(skip){fn(1);res();return}const p=Math.min(1,Math.max(0,(t-t0)/ms));fn(e?e(p):p);p<1?requestAnimationFrame(f):res()})(t0)})}
/* تلوتلوی عروسکی: چرخش اندک چپ‌وراست حول ناف + بالا و پایین ریز؛ هر قدم ≈۳۵۰ms */
async function walk(pts){const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d}
 const SPD=70,STEP=24.5,A=5.5;
 await tween(tot/SPD*1000,p=>{const d=p*tot;let a=d,i=0;while(i<seg.length-1&&a>seg[i]){a-=seg[i];i++}
  const u=seg[i]?Math.min(1,a/seg[i]):1,x=pts[i][0]+(pts[i+1][0]-pts[i][0])*u,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*u;
  const env=Math.min(1,d/16,(tot-d)/22),ph=d/STEP*Math.PI,sn=Math.abs(Math.sin(ph));placeFig(x,y);setTilt(A*Math.sin(ph)*env,-3*sn*env,1-.03*(1-sn)*env)});
 setTilt(0,0);const l=pts[pts.length-1];placeFig(l[0],l[1])}
async function hop(a,b,h){await tween(400,p=>{placeFig(a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p-4*h*p*(1-p));setTilt(6*Math.sin(p*Math.PI)*(b[0]>a[0]?1:-1),0,1+.05*Math.sin(p*Math.PI))});
 await tween(160,p=>{setTilt(0,0,1-.07*Math.sin(p*Math.PI))});setTilt(0,0,1)}
const boatPos={x:BOAT0.x,y:BOAT0.y,r:0};
async function dip(){await tween(420,p=>{const k=Math.exp(-4*p)*Math.sin(p*Math.PI*3);placeBoat(boatPos.x,boatPos.y+3.5*k,boatPos.r+2.5*k)})}
const bez=(p,a,b,c,d)=>{const q=1-p;return[q*q*q*a[0]+3*q*q*p*b[0]+3*q*p*p*c[0]+p*p*p*d[0],q*q*q*a[1]+3*q*q*p*b[1]+3*q*p*p*c[1]+p*p*p*d[1]]};
const BOAT1={x:132,y:200};
async function sail(){const P0=[BOAT0.x,BOAT0.y],P1=[335,320],P2=[150,330],P3=[BOAT1.x,BOAT1.y];hist.length=0;
 await tween(4200,p=>{const [x,y]=bez(p,P0,P1,P2,P3);
  const env=Math.min(1,p*6,(1-p)*6),roll=2.6*Math.sin(p*Math.PI*6)*env,bob=1.8*Math.sin(p*Math.PI*9)*env;
  boatPos.x=x;boatPos.y=y+bob;boatPos.r=roll;placeBoat(boatPos.x,boatPos.y,boatPos.r);
  placeFig(x,y+bob+SEAT.y);setTilt(-roll*.7,0);
  hist.push([x,y+62]);if(hist.length>60)hist.shift();
  foams.forEach((f,i)=>{const h=hist[hist.length-1-i*6];if(!h){f.style.opacity=0;return}f.style.opacity=Math.max(0,.75-i*.1)*env;f.style.transform='translate('+h[0]+'px,'+h[1]+'px) scale('+(1+i*.12)+')'})},ease);
 foams.forEach(f=>f.style.opacity=0);setTilt(0,0)}
const POS={start:[38,545],pier:[198,424],pad2:[168,206],end:[226,190]};
async function run(fn){if(busy)return;busy=true;skip=false;$('go').hidden=true;$('skip').hidden=reduce;$('status').textContent=T('status.moving');
 try{await fn()}finally{busy=false;skip=false;$('skip').hidden=true;$('go').hidden=false}}
const STEPS=[
 ()=>walk([POS.start,[95,505],[145,478],POS.pier]),
 async()=>{const s=[BOAT0.x+SEAT.x,BOAT0.y+SEAT.y];await hop(POS.pier,s,24);boatPos.x=BOAT0.x;boatPos.y=BOAT0.y;await dip();await sail();await dip();await hop([boatPos.x,boatPos.y+SEAT.y],POS.pad2,24)},
 ()=>walk([POS.pad2,[200,198],POS.end]),
 async()=>{reset()}];
const AUTO=async()=>{await STEPS[0]();await STEPS[1]();await STEPS[2]()};
function reset(){placeFig(POS.start[0],POS.start[1]);setTilt(0,0);boatPos.x=BOAT0.x;boatPos.y=BOAT0.y;boatPos.r=0;placeBoat(BOAT0.x,BOAT0.y,0);foams.forEach(f=>f.style.opacity=0)}
function ui(){$('go').textContent=T(stage?'btn.again':'btn.go');$('status').textContent=T(stage?'status.3':'status.0')}
$('go').onclick=async()=>{if(busy)return;await run(stage?STEPS[3]:AUTO);stage=stage?0:1;ui()};
$('skip').textContent=T('btn.skip');$('skip').onclick=()=>{skip=true};
function redUi(){$('red').textContent=T(reduce?'btn.reduce.on':'btn.reduce.off');$('red').setAttribute('aria-pressed',reduce);document.documentElement.classList.toggle('reduce',reduce)}
$('red').onclick=()=>{reduce=!reduce;if(busy){skip=true;$('skip').hidden=true}redUi()};
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-label',T('chip.label').replace('%d',i+1));
 b.setAttribute('aria-pressed',i===0);b.innerHTML='<img alt="" src="'+IM[n].thumb+'">';b.onclick=()=>{if(busy)return;ch=i;pick()};$('chips').appendChild(b)});
function pick(){fimg.src=IM[NAMES[ch]].big;[...$('chips').children].forEach((c,i)=>c.setAttribute('aria-pressed',i===ch))}
pick();reset();redUi();fit();ui();addEventListener('load',fit);
</script>
</body>
</html>
