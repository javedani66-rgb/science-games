:root{color-scheme:light;--page:#EDF4F7;--card:#FFFFFF;--ink:#1B2A41;--muted:#56677F;--line:#D4E1E9;--soft:#F2F7FA;--ok:#1F8A4C;--bad:#C93B22;--focus:#1E6FD9;--c:#3B6FD4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"VazirLocal",Vazirmatn,Tahoma,sans-serif;font-size:17px;line-height:1.8;direction:rtl;padding-inline:16px;padding-block:14px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.disp{font-family:"LalezarLocal","VazirLocal",Tahoma,sans-serif;font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch;font-size:16px;line-height:1.85}
svg text{font-family:"VazirLocal",Tahoma,sans-serif}

/* buttons */
.chip-btn{border:0;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);border-radius:999px;padding:6px 16px;min-height:44px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover{box-shadow:inset 0 0 0 2px var(--c)}
.chip-btn.fill{background:var(--c);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn{border:0;border-radius:14px;padding:8px 20px;min-height:52px;font-weight:700;font-size:17px;cursor:pointer;background:var(--soft);box-shadow:inset 0 0 0 2px var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{box-shadow:inset 0 0 0 2px var(--c)}
.btn.go{background:#22965A;color:#fff;box-shadow:0 4px 0 #17703F}
.btn.go:active{transform:translateY(3px);box-shadow:0 1px 0 #17703F}
.btn.pri{background:var(--c);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.45;cursor:default;transform:none}

/* home */
.hero{display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(32px,8vw,50px)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 14px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.st{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(27,42,65,.06),0 12px 26px -16px rgba(27,42,65,.5);transition:transform .18s}
.st:hover{transform:translateY(-3px)}
.st:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.st svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.stb{display:flex;flex-direction:column;padding:10px 16px 14px;gap:0;border-top:5px solid var(--c)}
.stb .k{font-size:13px;font-weight:700;color:var(--muted)}
.stb .n{font-family:"LalezarLocal","VazirLocal",Tahoma,sans-serif;font-size:27px;color:var(--c);line-height:1.35}
.stb .s{color:var(--muted);font-size:15px;line-height:1.6}
.stb .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;font-weight:700}
.minis{display:inline-flex;gap:2px;align-items:center;white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bar .chip-btn{padding:6px 12px;font-size:14px;white-space:nowrap}
.bar .mid{min-width:0}
.bar .mid{display:flex;flex-direction:column;align-items:center;line-height:1.3;text-align:center}
.bar .mid b{font-family:"LalezarLocal","VazirLocal",Tahoma,sans-serif;font-weight:400;font-size:24px;color:var(--c)}
.bar .mid small{font-size:13px;font-weight:700;color:var(--muted)}

/* hub */
.hubhead{display:flex;flex-direction:column;gap:6px}
.hubhead h2{font-size:clamp(32px,8vw,44px);color:var(--c)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 2px var(--line);min-height:120px;position:relative}
.mode:hover{box-shadow:inset 0 0 0 3px var(--c)}
.mode:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mode .t{font-weight:700;font-size:18px}
.mode .d{font-size:14px;color:var(--muted);line-height:1.7}
.mode .tag{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;background:var(--tc,var(--c));border-radius:999px;padding:1px 10px}
.mode .st3{margin-top:auto;display:flex;gap:2px}
.mode.lock{cursor:default;background:#EAF0F3;box-shadow:inset 0 0 0 2px var(--line)}
.mode.lock .t,.mode.lock .d{color:#8FA1B3}
.mode.lab{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));color:#fff;box-shadow:none}
.mode.lab .d{color:rgba(255,255,255,.88)}
.sect{font-size:14px;font-weight:700;color:var(--muted);margin-top:4px}

/* board */
.board{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 26px -18px rgba(27,42,65,.5)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;background:#DCE6EC;display:inline-block}
.dots i.cur{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.dots i.p2{background:#22965A}.dots i.p1{background:#E5A50A}.dots i.p0{background:#D0563E}
.score{font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center}
.hearts{display:inline-flex;gap:2px}
.prompt{margin:0;font-weight:700;font-size:18px;line-height:1.8}
.prompt small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.scw{border-radius:16px;overflow:hidden;background:#F4FAFD}
@media (max-width:520px){.board{padding:10px}.scw{margin-inline:-6px;border-radius:12px}}
#sc{display:block;width:100%;height:auto;max-height:66vh;aspect-ratio:640/520;touch-action:none;user-select:none;-webkit-user-select:none}
.counter{display:flex;flex-wrap:wrap;gap:6px}
.counter:empty,.formula:empty,.ctrl:empty,.nav:empty{display:none}
.cc{background:var(--soft);border-radius:12px;padding:4px 12px;font-size:15px;display:inline-flex;gap:6px;align-items:baseline}
.cc b{font-size:18px;font-variant-numeric:tabular-nums}
.cc.l{box-shadow:inset 3px 0 0 #2F6BD0}.cc.r{box-shadow:inset 3px 0 0 #D8452B}.cc.n{box-shadow:inset 3px 0 0 #7A3FC8}
.formula{background:#FFF8E1;border-radius:12px;padding:6px 12px;font-size:16px;font-weight:700;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.formula .fl{font-size:13px;color:#8A6D1E;font-weight:700}
.formula .okm{color:var(--ok)}.formula .nom{color:var(--bad)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .hint{font-size:14px;color:var(--muted);width:100%}
.mcq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.mcq .btn{min-height:58px;font-size:16px;line-height:1.5;padding:8px 12px}
.mcq .btn.right{background:#DDF3E6;box-shadow:inset 0 0 0 3px #22965A}
.mcq .btn.wrong{background:#FDE3DC;box-shadow:inset 0 0 0 3px #D0563E}
.stp{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:16px;padding:6px}
.stp button{border:0;background:#fff;box-shadow:inset 0 0 0 2px var(--line);border-radius:12px;min-width:48px;min-height:46px;font-weight:700;font-size:16px;cursor:pointer}
.stp output{min-width:70px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stp .u{font-size:14px;color:var(--muted);font-weight:700;padding-inline-end:6px}
.opt{border:0;background:var(--soft);border-radius:14px;padding:6px 12px;min-height:50px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:inset 0 0 0 2px transparent}
.opt svg{width:36px;height:28px;flex:none}
.opt:hover{box-shadow:inset 0 0 0 2px var(--line)}
.opt.sel{background:#FFF3D1;box-shadow:inset 0 0 0 3px #F0B429}
.fb{margin:0;min-height:1.8em;font-weight:700;line-height:1.8}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}.fb.info{color:var(--ink)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.toggles{display:flex;flex-wrap:wrap;gap:6px;border-top:2px dashed var(--line);padding-top:10px}
.tg{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--soft);border-radius:999px;padding:4px 12px 4px 6px;min-height:40px;font-size:14px;font-weight:700;cursor:pointer}
.tg .sw{width:34px;height:20px;border-radius:999px;background:#C5D3DC;position:relative;flex:none;transition:background .15s}
.tg .sw::after{content:"";position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:right .15s}
.tg[aria-pressed="true"] .sw{background:var(--c)}
.tg[aria-pressed="true"] .sw::after{right:17px}

/* overlays */
.ovl{position:fixed;inset:0;background:rgba(18,30,48,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;animation:fade .2s}
.sheet{background:var(--card);border-radius:24px;max-width:600px;width:100%;max-height:calc(100% - 24px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet p{margin:0}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{color:var(--c);font-size:32px}
.res{text-align:center;align-items:center}
.res h2{font-size:38px;color:var(--ink)}
.bigst{display:flex;gap:6px;justify-content:center}
.bigst span{animation:pop .5s var(--d) both;display:inline-flex}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards;z-index:11;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(560deg)}}
.rem{background:#FFF4D2;border-radius:14px;padding:10px 14px;font-weight:700}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex span{background:var(--soft);border-radius:999px;padding:2px 12px;font-size:14px}
.vids{display:flex;flex-direction:column;gap:8px}
.vids a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:14px;padding:8px 12px;font-weight:700;line-height:1.5}
.vids a:hover{box-shadow:inset 0 0 0 2px var(--line)}
.play-ic{width:34px;height:34px;flex:none}

function minCoins(t,vals){const dp=Array(t+1).fill(Infinity);dp[0]=0;const g=vals.reduce((a,b)=>gcd(a,b));for(let s=g;s<=t;s+=g)for(const v of vals)if(v<=s&&dp[s-v]+1<dp[s])dp[s]=dp[s-v]+1;return dp[t];}
function gcd(a,b){return b?gcd(b,a%b):a;}
function minCoinsStr(t,vals,u){const out=[];let s=t;const vs=vals.slice().sort((a,b)=>b-a);
  while(s>0){let best=null;for(const v of vs)if(v<=s&&minCoins(s-v,vals)+1===minCoins(s,vals)){best=v;break;}if(best==null)break;out.push(best);s-=best;}
  return out.map(v=>wLabelLong(v,u)).join(" + ");}

const LV_MASS={myA:20,myB:15,myC:30};
function brickSvg(x,yb,m,hl){const w=52,h=m/5*13+3;let s=`<rect x="${x-w/2}" y="${yb-h}" width="${w}" height="${h}" rx="3" fill="#C8553D" stroke="${hl?"#1E6FD9":"#8E3322"}" stroke-width="${hl?3.5:1.5}"/>`;
  for(let y=yb-13;y>yb-h+2;y-=13)s+=`<line x1="${x-w/2}" y1="${y}" x2="${x+w/2}" y2="${y}" stroke="#EBA08E" stroke-width="1.5"/>`;
  return `<g>${s}${KID()?"":T(x,yb-h/2+4,`${fa(m)} کیلو`,{size:m===5?11:13,col:"#fff",halo:false})}</g>`;}
const lvItemH=it=>it.k==="b"?it.m/5*13+3:OB[it.id].h*.85;
function lvItemSvg(it,x,yb,hl){if(it.k==="b")return brickSvg(x,yb,it.m,hl);return `<g transform="translate(${x} ${yb}) scale(.85)">${OB[it.id].d}</g>`;}
const lvM=it=>it.k==="b"?it.m:LV_MASS[it.id];

function makeLever(A,cfg){
  const svg=A.svg,P=A.P;A.view(cfg.edit?520:404);const PX=52,CX=320,CY=290;
  const st={stacks:{},pieces:(cfg.pieces||[]).map((m,i)=>({id:i,it:typeof m==="number"?{k:"b",m}:{k:"o",id:m},used:false})),inf:cfg.inf||null,edit:cfg.edit||"",sup:cfg.sup!==false,a:0,sel:null,hover:null,busy:false,hide:cfg.hide||{}};
  (cfg.items||[]).forEach(([p,it])=>{(st.stacks[p]=st.stacks[p]||[]).push(Object.assign({fixed:1},typeof it==="number"?{k:"b",m:it}:{k:"o",id:it}));});
  const tq=side=>Object.keys(st.stacks).reduce((s,p)=>{p=+p;if((side==="L"&&p<0)||(side==="R"&&p>0))s+=Math.abs(p)*st.stacks[p].reduce((a,it)=>a+lvM(it),0);return s;},0);
  const termStr=side=>Object.keys(st.stacks).map(Number).filter(p=>side==="L"?p<0:p>0).sort((a,b)=>Math.abs(a)-Math.abs(b)).filter(p=>st.stacks[p].length).map(p=>{const hid=st.stacks[p].some(it=>st.hide[it.id]);return hid?`؟ × ${fa(Math.abs(p))}`:`${fa(st.stacks[p].reduce((a,it)=>a+lvM(it),0))} × ${fa(Math.abs(p))}`;}).join(" + ")||"۰";
  const hasHidden=side=>Object.keys(st.stacks).map(Number).some(p=>(side==="L"?p<0:p>0)&&st.stacks[p].some(it=>st.hide[it.id]));
  const canEdit=p=>!A.locked&&st.sup&&(st.edit==="both"||(st.edit==="R"&&p>0)||(st.edit==="L"&&p<0));
  function render(){const tL=tq("L"),tR=tq("R"),bal=!st.sup&&tL===tR;
    let s=bgRoom(380);
    s+=`<g transform="translate(20 20)"><rect width="140" height="40" rx="12" fill="#fff" stroke="#C7D3DE" stroke-width="2"/><rect x="14" y="13" width="112" height="14" rx="7" fill="${bal?"#CDEFD9":"#E9EFF3"}" stroke="${bal?GRN:"#B8C6D3"}" stroke-width="2"/><line x1="70" y1="10" x2="70" y2="30" stroke="${bal?GRN:"#9FB0C0"}" stroke-width="2"/><circle cx="${70+clamp(st.a*3.2,-46,46)}" cy="20" r="6" fill="${bal?GRN:"#7D8CA3"}"/></g>`+T(90,78,bal?"تراز است":"تراز",{size:13,col:bal?GRN:MUT,halo:false});
    s+=`<path d="M${CX} ${CY} L${CX-36} 380 H${CX+36}Z" fill="#6B4A2B"/><path d="M${CX} ${CY} L${CX-18} 380 H${CX}Z" fill="#8A6443"/>`;
    if(st.sup)for(const x of[86,554])s+=`<rect x="${x-11}" y="${CY}" width="22" height="${380-CY}" fill="#E8590C"/><path d="M${x-11} ${CY+20} l22 -12 M${x-11} ${CY+44} l22 -12 M${x-11} ${CY+68} l22 -12" stroke="#fff" stroke-width="4" opacity=".6"/>`;
    let g=`<rect x="${CX-282}" y="${CY-12}" width="564" height="12" rx="5" fill="#D08A4B"/><rect x="${CX-282}" y="${CY-12}" width="564" height="4" rx="2" fill="#EAB47C"/>`;
    for(let p=-5;p<=5;p++){if(!p)continue;const x=CX+p*PX;g+=`<line x1="${x}" y1="${CY-12}" x2="${x}" y2="${CY}" stroke="#8A5427" stroke-width="2"/>`+T(x,CY+26,fa(Math.abs(p)),{size:19,col:"#6B4A2B",halo:false});}
    for(let p=-5;p<=5;p++){if(!p)continue;const x=CX+p*PX,items=st.stacks[p]||[];let yb=CY-12;
      if(canEdit(p)&&(st.sel||st.hover===p)){g+=`<g data-zone="pos" data-p="${p}" style="cursor:pointer"><circle cx="${x}" cy="${CY-24}" r="${st.hover===p?20:15}" fill="${st.hover===p?"#FFF3C4":"#fff"}" stroke="#F0B429" stroke-width="2.5" stroke-dasharray="4 3"/></g>`;}
      else if(canEdit(p))g+=`<g data-zone="pos" data-p="${p}"><rect x="${x-24}" y="${CY-90}" width="48" height="90" fill="#fff" fill-opacity="0"/></g>`;
      items.forEach((it,i)=>{const drag=canEdit(p)&&!it.fixed;g+=`<g ${drag?`data-drag="stk" data-p="${p}" data-i="${i}" style="cursor:grab"`:""}>${lvItemSvg(it,x,yb)}</g>`;yb-=lvItemH(it)+1;});
      if(S.forces&&items.length){const m=items.reduce((a,it)=>a+lvM(it),0),hid=items.some(it=>st.hide[it.id]),len=hid?40:16+m*1.6;g+=arrow(x,CY+40,x,CY+40+len,9,p<0?BLUE:RED,.9);}}
    s+=`<g transform="rotate(${st.a} ${CX} ${CY})">${g}</g>`;
    if(st.edit){s+=trayPanel("",404);
      const list=st.inf?st.inf.map((m,i)=>({id:"i"+i,it:typeof m==="number"?{k:"b",m}:{k:"o",id:m}})):st.pieces.filter(pc=>!pc.used);const n=list.length;
      list.forEach((pc,j)=>{const x=320+(j-(n-1)/2)*Math.min(96,560/Math.max(n,1)),sel=st.sel&&st.sel.pid===pc.id;s+=`<g data-drag="tray" data-pid="${pc.id}" style="cursor:grab"><rect x="${x-44}" y="418" width="88" height="90" rx="12" fill="${sel?"#FFF3C4":"#fff"}" fill-opacity="${sel?1:0}"/><g transform="translate(${x} 500) scale(1.25) translate(${-x} -500)">${lvItemSvg(pc.it,x,500,sel)}</g></g>`;});}
    P.paint(s);
    const hl=hasHidden("L"),hr=hasHidden("R");

  function render(){let s=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F4EA"/><stop offset="1" stop-color="#F7FCF8"/></linearGradient></defs><rect width="640" height="520" fill="url(#sg)"/>`;

        P.paint(s);}

  render();return{st,render,mark(i,ok){st.done={i,ok};render();},clear(){st.done=null;render();}};}

function sortPick(r,dmax,n,withC,hardFirst){let pool=ITEMS.filter(it=>it[2]<=dmax&&(withC||it[1]!==6));if(hardFirst)pool=pool.filter(it=>it[2]>=2);
  let pick6=[];const byCat={};pool.forEach(it=>(byCat[it[1]]=byCat[it[1]]||[]).push(it));const cats=shuffle(r,Object.keys(byCat));
  if(withC){pick6=shuffle(r,byCat[6]).slice(0,2);cats.filter(c=>c!=="6").slice(0,n-2).forEach(c=>pick6.push(pick(r,byCat[c])));}else cats.slice(0,n).forEach(c=>pick6.push(pick(r,byCat[c])));
  while(pick6.length<n)pick6.push(pick(r,pool));return shuffle(r,pick6).map(item=>({item,nb:withC?7:6}));}

function kidSort(r,set){const G1=["الاکلنگ","سرسرهٔ پارک","چاقو","درِ بطری آب","دستگیرهٔ در","میلهٔ پرچم مدرسه"],G2=["جارو","رمپ ویلچر","تبر","پیچ لولای در","فرمان ماشین","چاه با قرقرهٔ بالای سرش"],G3=["دربازکن نوشابه","تختهٔ بار زدن کامیون","نوک میخ","درِ شیشهٔ مربا","پیچ‌گوشتی","جرثقیل"];
  const names=set===0?G1:set===1?G2:shuffle(r,G1.concat(G2,G3)).slice(0,6);const pool=set===2?names:shuffle(r,names);return pool.map(n=>({item:ITEMS.find(it=>it[0]===n),nb:6}));}

function ltrMath(h){return h.replace(/(\(?[۰-۹0-9][۰-۹0-9٫/]*(?:\s*(?:[a-zA-Z]+\s*)?[×÷+−=≈<>]\s*[۰-۹0-9][۰-۹0-9٫/]*)+(?:\s*(?:N|J|m|kg|g)\b)?\)?)/g,m=>{let tail="";if(m.endsWith(")")&&!m.startsWith("(")){m=m.slice(0,-1);tail=")";}if(m.startsWith("(")&&!m.endsWith(")")){return "("+`<span dir="ltr" class="eqi">${m.slice(1)}</span>`+tail;}return `<span dir="ltr" class="eqi">${m}</span>`+tail;});}
function mixLevel(k,d0,title,desc){return{title,desc,gen:r=>Array.from({length:6},(_,i)=>ST[k].endless(r,d0+i*.2))};}
function levelsOf(k){const s=ST[k],cur=s.levels;if(S.track==="a")return s.kid;
  const sel=ix=>ix.map(i=>cur[i]);
  if(S.track==="b")return[...(s.bLv?sel(s.bLv):[cur[0],cur[1],cur[2]]),mixLevel(k,2.6,"همه با هم","چالش‌های گوناگون از همهٔ مرحله‌ها، کمی سخت‌تر.")];
  return[...(s.cLv?sel(s.cLv):[cur[1],cur[2],cur[3]]),mixLevel(k,5,"قهرمان","چالش‌های سخت و تصادفی از همهٔ انواع.")];}
const starsFor=(p,m)=>p>=m*.9?3:p>=m*.66?2:p>=m*.4?1:0;
function setC(k){document.documentElement.style.setProperty("--c",ST[k]?ST[k].c:"#3B6FD4");}

function home(){epoch++;closeOv();setC("scale");
  const tot=ORDER.reduce((a,k)=>a+starsOfSt(k),0);
  app.innerHTML=`<header class="hero"><h1>کارگاه ماشین‌های ساده</h1><p class="lead">از نیرو شروع کن، بعد ترازو، اهرم و بقیهٔ ماشین‌ها. هر ایستگاه یک آزمایشگاه آزاد دارد و چهار مرحله که هر کدام یک چیز تازه یاد می‌دهد.</p>
  <div class="toolbar">${TESTMODE?`<button class="chip-btn trackchip" id="tk" type="button">${S.track?`مسیر: ${TRACKS[S.track].n} (${TRACKS[S.track].g})`:"انتخاب پایه"}</button>`:`<button class="chip-btn trackchip" id="tk" type="button">→ نقشهٔ سفر</button>`}<span class="pill">${starSvg(true,20)}<b>${fa(tot)}</b> ستاره</span><button class="chip-btn" id="fm" type="button">${KID()?"قانون‌ها":"فرمول‌ها"}</button><button class="chip-btn" id="gl" type="button">واژه‌نامه</button></div></header>
  <div class="stations">${ORDER.map((k,i)=>{const s=ST[k],pg=PG(k),next=pg.lv.findIndex(v=>!v);return `<button class="st" data-k="${k}" type="button" style="--c:${s.c}"><svg viewBox="0 20 640 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s.art()}</svg><span class="stb"><span class="k">ایستگاه ${fa(i+1)}</span><span class="n">${s.name}</span><span class="s">${s.sub}</span><span class="m"><span>${next<0?"همهٔ مرحله‌ها تمام شد":next===0&&!pg.lv[0]?"شروع کن":`مرحلهٔ ${fa(next+1)}`}</span><span class="minis">${starSvg(starsOfSt(k)>0,16)} ${fa(starsOfSt(k))} از ${fa((S.track?levelsOf(k).length:4)*3)}</span></span></span></button>`;}).join("")}</div>
  ${TESTMODE?`<footer class="foot"><span>ستاره‌ها روی همین دستگاه ذخیره می‌شوند.</span><button id="rs" type="button">پاک کردن همهٔ ستاره‌ها</button></footer>`:""}`;
  app.querySelectorAll(".st").forEach(b=>b.onclick=()=>hub(b.dataset.k));$("#tk").onclick=TESTMODE?chooseTrack:()=>jmap({});
  $("#fm").onclick=()=>openFormulas();$("#gl").onclick=openGloss;
  const rs=$("#rs");if(rs){let armed=false;rs.onclick=()=>{if(!armed){armed=true;rs.textContent="مطمئنی؟ دوباره بزن";setTimeout(()=>{armed=false;rs.textContent="پاک کردن همهٔ ستاره‌ها";},3000);return;}S.prog={};save();home();};}
  window.scrollTo(0,0);if(!S.track&&TESTMODE)chooseTrack();}
function chooseTrack(){const o=overlay(`<div class="sheet"><div class="shead"><h2 style="color:var(--ink)">پایه‌ات را انتخاب کن</h2>${S.track?`<button class="chip-btn" id="cx" type="button">بستن</button>`:""}</div><p class="lead">بازی برای هر گروه سنی مرحله‌ها و متن‌های جدا دارد. ستاره‌های هر مسیر جدا ذخیره می‌شوند و هر وقت خواستی می‌توانی مسیر را عوض کنی.</p><div class="tracks">${Object.entries(TRACKS).map(([id,tr])=>`<button class="trk ${S.track===id?"sel":""}" data-t="${id}" type="button" style="--tc:${tr.c}"><span class="g">${tr.g}</span><span class="t">${tr.n}</span><span class="d">${tr.d}</span></button>`).join("")}</div></div>`,"انتخاب پایه");
  o.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.track=b.dataset.t;save();applyNums();closeOv();home();});const cx=o.querySelector("#cx");if(cx)cx.onclick=closeOv;(o.querySelector(".trk.sel")||o.querySelector(".trk")).focus();}

function hub(k){epoch++;closeOv();setC(k);const s=ST[k],pg=PG(k);
  let h=`<div class="bar"><button class="chip-btn" id="bk" type="button">→ همهٔ ایستگاه‌ها</button><button class="chip-btn fill" id="df" type="button">تعریف و فیلم</button></div>
  <div class="hubhead"><h2>${s.name}</h2><p class="lead">${KID()?KIDINTRO[k]:s.intro}</p></div>
  <div class="modes"><button class="mode lab" id="lab" type="button"><span class="t">آزمایشگاه</span><span class="d">آزادانه امتحان کن. امتیاز و مرحله ندارد؛ فقط کشف کردن.</span></button></div>
  <div class="sect">مرحله‌ها · مسیر ${TRACKS[S.track||"c"].n} (${TRACKS[S.track||"c"].g}) · برای باز شدن مرحلهٔ بعد، دست‌کم یک ستاره بگیر</div><div class="modes">`;
  levelsOf(k).forEach((lv,i)=>{const open=i===0||pg.lv[i-1]>0,stn=pg.lv[i];h+=`<button class="mode ${open?"":"lock"}" data-l="${i+1}" type="button" ${open?"":"disabled"} style="--tc:${TIER[Math.min(3,i)].c}"><span class="tag">مرحلهٔ ${fa(i+1)}</span><span class="t">${open?"":LOCK+" "}${lv.title}</span><span class="d">${lv.desc}</span><span class="st3">${[1,2,3].map(j=>starSvg(j<=stn,18)).join("")}</span></button>`;});
  const eOpen=pg.lv[1]>0;h+=`<button class="mode ${eOpen?"":"lock"}" id="end" type="button" ${eOpen?"":"disabled"} style="--tc:#1B2A41"><span class="tag">بی‌پایان</span><span class="t">${eOpen?"":LOCK+" "}چالش بی‌پایان</span><span class="d">${eOpen?"سه جان داری. هر جواب درست، چالش بعدی را سخت‌تر می‌کند.":"بعد از گرفتن ستارهٔ مرحلهٔ ۲ باز می‌شود."}</span><span class="st3" style="font-size:14px;font-weight:700">${pg.best?"بهترین رکورد: "+fa(pg.best):""}</span></button></div>
  <div><button class="chip-btn" id="fx" type="button">${KID()?"قانون این ایستگاه":"فرمول‌های این ایستگاه"}</button></div>`;
  app.innerHTML=h;$("#bk").onclick=home;$("#df").onclick=()=>openDef(k);$("#fx").onclick=()=>openFormulas(k);$("#lab").onclick=()=>playLab(k);
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>playLevel(k,+b.dataset.l));if(eOpen)$("#end").onclick=()=>playEndless(k);window.scrollTo(0,0);}

function tgBtn(key,label){return `<button class="tg" type="button" data-tg="${key}" aria-pressed="${S[key]?"true":"false"}"><span class="sw"></span>${label}</button>`;}
function board(k,head){epoch++;closeOv();setC(k);const s=ST[k];
  app.innerHTML=`<div class="bar"><button class="chip-btn" id="bk" type="button">→ ${head.backLabel}</button><div class="mid"><b>${s.name}</b><small>${head.sub}</small></div><button class="chip-btn fill" id="df" type="button">تعریف و فیلم</button></div>
  <section class="board">${head.mode!=="lab"?`<div class="phead"><div class="dots" id="dots"></div><div class="score" id="scr"></div></div>`:""}
  <p class="prompt" id="pr"></p><div class="scw"><svg id="sc" viewBox="0 0 640 520" role="img" aria-label="صحنهٔ آزمایش"></svg></div>
  <div class="counter" id="ct" aria-live="polite"></div><div class="ctrl" id="cl"></div><p class="fb" id="fb" aria-live="polite"></p><div class="nav" id="nv"></div><div class="formula" id="fm"></div>
  <div class="toggles">${tgBtn("forces","نمایش نیروها")}${tgBtn("nums","نمایش عددها")}${tgBtn("formula","نمایش فرمول")}</div></section>`;
  const svg=$("#sc");let fmHtml="";
  const P0=makePainter(svg);const A={svg,P:P0,hint:d=>P0.hint(d),view:h=>{svg.setAttribute("viewBox",`0 0 640 ${h}`);svg.style.aspectRatio=`640/${h}`;},tries:0,locked:false,lab:head.mode==="lab",refresh:null,done:null,onLane:null,
    prompt:h=>{if(KID()&&head.mode==="lab")h=KIDLAB[k];const i=h.indexOf("<small>");let main=h,sub="";if(i>=0){main=h.slice(0,i);sub=h.slice(i+7).replace("</small>","");}const pr=$("#pr");main=ltrMath(main);sub=ltrMath(sub);pr.innerHTML=main+(sub&&!KID()?`<button class="helpb" type="button" aria-expanded="false">راهنما</button><small class="help" hidden>${sub}</small>`:"");const hb=pr.querySelector(".helpb");if(hb)hb.onclick=()=>{const s2=pr.querySelector(".help");s2.hidden=!s2.hidden;hb.setAttribute("aria-expanded",String(!s2.hidden));};},counter:h=>{const e=$("#ct");if(e)e.innerHTML=h||"";},
    formula:h=>{fmHtml=h||"";const e=$("#fm");if(e)e.innerHTML=S.formula?fmHtml:"";},
    ctrl:h=>{const c=$("#cl");c.innerHTML=h||"";return c;},fb:(m,c)=>{const e=$("#fb");if(!e)return;e.innerHTML=ltrMath(m||"");e.className="fb "+(c||"");},
    nav:h=>{const n=$("#nv");n.innerHTML=h||"";return n;},
    judge(ok,m){if(A.locked||A.lab)return ok;if(KID()&&m.k)m=Object.assign({},m,m.k);
      if(ok){const pts=m.pts!=null?m.pts:(A.tries===0?2:1);A.locked=true;A.fb(`${pts===2?"آفرین!":"درست شد."} ${m.ok||""} <span style="white-space:nowrap">(+${fa(pts)} امتیاز)</span>`,"ok");if(A.done)A.done(pts);return true;}
      A.tries++;if(A.tries<2){A.fb(KID()?`دوباره امتحان کن. ${m.retry||""}`:`نه هنوز. ${m.retry||""} یک فرصت دیگر داری.`,"no");return false;}
      A.locked=true;A.fb(`${m.final||""}`,"no");if(A.done)A.done(0);return false;}};
  app.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const key=b.dataset.tg;S[key]=!S[key];save();applyNums();b.setAttribute("aria-pressed",S[key]?"true":"false");A.formula(fmHtml);if(A.refresh)A.refresh();});
  $("#bk").onclick=head.back;$("#df").onclick=()=>openDef(k);
  return A;}

function playLab(k){const A=board(k,{mode:"lab",backLabel:"ایستگاه",sub:"آزمایشگاه",back:()=>hub(k)});ST[k].lab(A);window.scrollTo(0,0);}
function dotsHtml(n,i,res){return Array.from({length:n},(_,j)=>`<i class="${res[j]!=null?"p"+res[j]:j===i?"cur":""}" title="چالش ${fa(j+1)}"></i>`).join("");}
function playLevel(k,L,ctx){const s=ST[k],LV=levelsOf(k),lv=LV[L-1];const r=rng((Date.now()^hash(k+L))>>>0);const specs=ctx&&ctx.resume?ctx.resume.specs:lv.gen(r);const res=ctx&&ctx.resume?ctx.resume.res.slice():[];let i=ctx&&ctx.resume?ctx.resume.i:0;
  const keep=()=>{if(ctx&&ctx.keep)ctx.keep({specs,res,i});};keep();
  function show(){const A=board(k,{mode:"level",backLabel:ctx?"نقشه":"ایستگاه",sub:ctx?ctx.sub:`مرحلهٔ ${fa(L)}: ${lv.title}`,back:ctx?()=>{keep();ctx.back();}:()=>hub(k)});
    const upd=()=>{$("#dots").innerHTML=dotsHtml(specs.length,i,res);$("#scr").innerHTML=`چالش ${fa(i+1)} از ${fa(specs.length)} · امتیاز: ${fa(res.reduce((a,b)=>a+(b||0),0))} از ${fa(specs.length*2)}`;};upd();
    A.done=pts=>{res[i]=pts;upd();if(ctx&&ctx.keep)ctx.keep({specs,res,i:i+1<specs.length?i+1:i,done:i+1>=specs.length});const n=A.nav("");const b=btn(n,i+1<specs.length?"چالش بعدی ←":"دیدن نتیجه","go",()=>{i++;if(i<specs.length){show();$("#pr").scrollIntoView({block:"start",behavior:reduceMotion?"auto":"smooth"});}else finish();});later(50,()=>b.focus({preventScroll:true}));};
    if(window.__TEST||window.__JT)window.__T={spec:specs[i],MASS,LV_MASS,k,i};s.mount(specs[i],A);}
  function finish(){const pts=res.reduce((a,b)=>a+b,0),max=specs.length*2,stars=starsFor(pts,max),pg=PG(k);if(stars>pg.lv[L-1])pg.lv[L-1]=stars;save();
    if(ctx){ctx.finish(stars,pts,max);return;}
    const nextOpen=L<LV.length&&PG(k).lv[L-1]>0;
    const o=overlay(`<div class="sheet res"><h2>${stars===3?"عالی بود!":stars===2?"آفرین!":stars===1?"خوب بود!":"دوباره امتحان کن"}</h2><div class="bigst">${[1,2,3].map(j=>`<span style="--d:${j*.18}s">${starSvg(j<=stars,52)}</span>`).join("")}</div><p><b>${fa(pts)}</b> امتیاز از ${fa(max)}</p><p class="lead">${stars===0?"برای باز شدن مرحلهٔ بعد، دست‌کم یک ستاره لازم است. تعریف‌ها را بخوان و دوباره بازی کن.":stars<3?"برای سه ستاره، بیشتر چالش‌ها را در بار اول درست جواب بده.":"همهٔ چالش‌ها را عالی حل کردی."}</p><div class="nav" style="justify-content:center">${nextOpen?`<button class="btn go" id="rn" type="button">مرحلهٔ بعد</button>`:""}<button class="btn" id="rr" type="button">دوباره</button><button class="btn" id="rh" type="button">ایستگاه</button></div></div>`,"نتیجهٔ مرحله",s.c);
    if(nextOpen)o.querySelector("#rn").onclick=()=>playLevel(k,L+1);o.querySelector("#rr").onclick=()=>playLevel(k,L);o.querySelector("#rh").onclick=()=>hub(k);(o.querySelector("#rn")||o.querySelector("#rr")).focus();if(stars>=2)confetti();}
  show();window.scrollTo(0,0);}
function playEndless(k,ctx){const s=ST[k];const r=rng((Date.now()^hash(k+"e"))>>>0);let lives=3,d=1,score=0,count=0,right=0;
  function show(){const A=board(k,{mode:"endless",backLabel:ctx?"نقشه":"ایستگاه",sub:ctx?ctx.sub:"چالش بی‌پایان",back:ctx?ctx.back:()=>hub(k)});
    const upd=()=>{$("#dots").innerHTML=`<span class="hearts">${[0,1,2].map(j=>heart(j<lives)).join("")}</span>`;$("#scr").innerHTML=ctx?`جواب درست: ${fa(right)} از ${fa(ctx.goal)}`:`چالش ${fa(count+1)} · امتیاز: ${fa(score)} · سختی: ${fa(Math.floor(d))}`;};upd();
    A.done=pts=>{count++;if(pts===0)lives--;else{score+=pts;d+=.4;right++;}upd();if(ctx&&right>=ctx.goal){later(700,()=>ctx.win());return;}const n=A.nav("");const b=btn(n,lives>0?"چالش بعدی ←":"پایان بازی","go",()=>{if(lives>0){show();$("#pr").scrollIntoView({block:"start",behavior:reduceMotion?"auto":"smooth"});}else finish();});later(50,()=>b.focus({preventScroll:true}));};
    const sp=s.endless(r,KID()?Math.min(d,1.9):d);if(window.__TEST||window.__JT)window.__T={spec:sp,MASS,LV_MASS,k,d};s.mount(sp,A);}
  function finish(){const pg=PG(k),rec=score>pg.best;if(rec)pg.best=score;save();if(ctx){ctx.lose(right);return;}
    const o=overlay(`<div class="sheet res"><h2>${rec?"رکورد تازه!":"بازی تمام شد"}</h2><p><b>${fa(score)}</b> امتیاز در ${fa(count)} چالش</p><p class="lead">بهترین رکورد تو: ${fa(pg.best)}</p><div class="nav" style="justify-content:center"><button class="btn go" id="ra" type="button">دوباره</button><button class="btn" id="rh" type="button">ایستگاه</button></div></div>`,"پایان چالش بی‌پایان",s.c);
    o.querySelector("#ra").onclick=()=>playEndless(k);o.querySelector("#rh").onclick=()=>hub(k);o.querySelector("#ra").focus();if(rec)confetti();}
  show();window.scrollTo(0,0);}

function openDef(k){const s=ST[k],D=DEFS[k];
  const o=overlay(`<div class="sheet"><div class="shead"><h2>${s.name}</h2><button class="chip-btn" id="cx" type="button">بستن</button></div><svg viewBox="0 20 640 360" preserveAspectRatio="xMidYMid slice" style="width:100%;height:auto;border-radius:16px;display:block;aspect-ratio:16/9" aria-hidden="true">${s.art()}</svg>${D.paras.map(p=>`<p>${p}</p>`).join("")}<div class="rem">یادت باشد: ${D.rule}</div><div class="sect">نمونه‌ها در زندگی</div><div class="ex">${D.ex.map(e=>`<span>${e}</span>`).join("")}</div><div class="sect">${KID()?"قانون":"فرمول‌ها"}</div><div class="fcards">${FORMULAS.filter(f=>f.k===k).map(fcard).join("")||"<p class='lead'>این ایستگاه فرمول ندارد.</p>"}</div><div class="sect">فیلم‌ها و شبیه‌سازها</div><div class="vids">${D.vids.map(id=>{const v=V[id];return `<a href="${v[1]}" target="_blank" rel="noopener"><svg class="play-ic" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="${s.c}"/><path d="M14 11 L24 17 L14 23Z" fill="#fff"/></svg><span>${v[0]}<small>${v[2]}</small></span></a>`;}).join("")}</div><p class="lead">فیلم‌های آپارات بدون فیلترشکن باز می‌شوند.</p></div>`,"تعریف "+s.name,s.c);
  o.querySelector("#cx").onclick=closeOv;o.querySelector("#cx").focus();}
function fcard(f){if(KID())return f.rule?`<div class="fcard" style="--c:${ST[f.k].c}"><span class="gr">${ST[f.k].name}</span><h3>${f.t}</h3><div class="exm" style="font-size:18px;font-weight:700">${f.rule}</div></div>`:"";return `<div class="fcard" style="--c:${ST[f.k].c}"><span class="gr">${ST[f.k].name} · ${f.g==="b"?"از پایهٔ چهارم":"پایهٔ پنجم و ششم"}</span><h3>${f.t}</h3><div class="eq"><span class="eqx" dir="ltr">${f.eq()}</span></div><div class="lg" style="justify-content:center">${f.lg().map(([s,m])=>`<span class="lgi"><span dir="ltr">${s}</span>: ${m}</span>`).join("")}</div><div class="exm">مثال: ${f.ex} <span class="eqx" dir="ltr" style="font-size:16px">${f.exq()}</span></div></div>`;}
function openFormulas(k){const list=k?FORMULAS.filter(f=>f.k===k).concat(FORMULAS.filter(f=>f.k!==k)):FORMULAS;
  const o=overlay(`<div class="sheet"><div class="shead"><h2 style="color:var(--ink)">${KID()?"قانون‌ها":"فرمول‌ها"}</h2><button class="chip-btn" id="cx" type="button">بستن</button></div><p class="lead">${KID()?"قانون هر ماشین ساده در یک جمله.":"هر فرمول با نمادهای علمی و یک مثال حل‌شده. فرمول‌ها از چپ به راست خوانده می‌شوند."}</p><div class="fcards">${list.map(fcard).join("")}</div></div>`,"فرمول‌ها",k?ST[k].c:null);
  o.querySelector("#cx").onclick=closeOv;o.querySelector("#cx").focus();}
function openGloss(){const o=overlay(`<div class="sheet"><div class="shead"><h2 style="color:var(--ink)">واژه‌نامه</h2><button class="chip-btn" id="cx" type="button">بستن</button></div><dl class="gl">${GLOSS.map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join("")}</dl></div>`,"واژه‌نامه");o.querySelector("#cx").onclick=closeOv;o.querySelector("#cx").focus();}


/* ================= نقشهٔ سفر: ۱۲ منزل، به ترتیب جلسه‌های کلاس ================= */

const JP=()=>curP();
const trk=p=>trackOfG(p.g);
const missions=(p,i)=>STOPS[i].m[trk(p)];
const mStars=(p,i,j)=>{const [k,L]=missions(p,i)[j];const key=trk(p)+":"+k;const pg=p.S.prog[key];return pg?pg.lv[L-1]||0:0;};
const stopDone=(p,i)=>missions(p,i).every((_,j)=>mStars(p,i,j)>0);
const curStop=p=>{for(let i=0;i<12;i++)if(!stopDone(p,i))return i;return 12;};
const minStars=(p,i)=>Math.min(...missions(p,i).map((_,j)=>mStars(p,i,j)));
const totStars=p=>{let t=0;for(let i=0;i<12;i++)missions(p,i).forEach((_,j)=>t+=mStars(p,i,j));return t;};
const firstOpen=(p,i)=>{const ms=missions(p,i);for(let j=0;j<ms.length;j++)if(!mStars(p,i,j))return j;return 0;};
const mName=(p,i,j)=>{const [k,L]=missions(p,i)[j];return levelsOf(k)[L-1].title;};
function newProfile(name,g,t){return{id:"p"+Date.now().toString(36),name,g,t,S:{prog:{},nums:true,forces:true,formula:true,track:trackOfG(g)},home:Array(12).fill(0),side:Array(12).fill(0),words:Array(12).fill(0),at:null,coach:1};}

/* ---------- کد پیشرفت (داخل پیام معلم؛ همهٔ ستاره‌ها را نگه می‌دارد) ---------- */
const ABC="بپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی",B31=31n,CMASK=0x5A3F9C1E07B4D268A3C5F1n,CLEN=23;
function makeCode(p){let v=0n;const add=(x,b)=>{v=(v<<BigInt(b))|BigInt(x);};add(p.g,3);add(p.t,2);
  for(let i=0;i<12;i++)for(let j=0;j<3;j++)add(j<missions(p,i).length?mStars(p,i,j):0,2);
  for(let i=0;i<12;i++)add(p.home[i]?1:0,1);for(let i=0;i<12;i++)add(p.side[i]?1:0,1);
  add(Number(v%2039n),11);v^=CMASK;const out=[];for(let k=0;k<CLEN;k++){out.unshift(ABC[Number(v%B31)]);v/=B31;}return out.map((c,x)=>c+(x===CLEN-1?"":(x%4===3?" ":"\u200c"))).join("");}
function readCode(str){const s=(str||"").replace(/[\s\-‌]/g,"").replace(/ي/g,"ی").replace(/ك/g,"ک");if(s.length!==CLEN)return null;let v=0n;for(const ch of s){const k=ABC.indexOf(ch);if(k<0)return null;v=v*B31+BigInt(k);}v^=CMASK;
  const ck=Number(v&2047n);v>>=11n;if(Number(v%2039n)!==ck)return null;const take=b=>{const x=Number(v&((1n<<BigInt(b))-1n));v>>=BigInt(b);return x;};
  const side=[],home=[],st=[];for(let i=11;i>=0;i--)side[i]=take(1);for(let i=11;i>=0;i--)home[i]=take(1);
  for(let i=11;i>=0;i--){st[i]=[];for(let j=2;j>=0;j--)st[i][j]=take(2);}const t=take(2),g=take(3);if(g>4)return null;return{g,t,st,home,side};}
function applyCode(p,r){p.g=r.g;p.t=r.t;const tr=trackOfG(r.g);p.S.track=tr;p.S.prog=p.S.prog||{};
  for(let i=0;i<12;i++)STOPS[i].m[tr].forEach(([k,L],j)=>{const key=tr+":"+k;const pg=p.S.prog[key]||(p.S.prog[key]={lv:[0,0,0,0,0],best:0});pg.lv[L-1]=Math.max(pg.lv[L-1]||0,r.st[i][j]);});
  p.home=r.home.slice();p.side=r.side.slice();p.words=p.words.map((w,i)=>w||(i<=curStop(p)?1:0));p.at=null;}
function codeFromMsg(txt){const m=(txt||"").match(/کد\s*:\s*([^\n]+)/);if(m){const r=readCode(m[1]);if(r)return r;}const t=(txt||"").replace(/[\s‌]/g,"");for(let a=0;a+CLEN<=t.length;a++){const r=readCode(t.slice(a,a+CLEN));if(r)return r;}return null;}
function teacherMsg(p){return `کارگاه ماشین‌های ساده\nنام: ${p.name}\nپایه: ${GRADES[p.g]}\n${curStop(p)>=12?"هر ۱۲ منزل تمام شد":`منزل: ${fa(curStop(p)+1)} از ۱۲`} · ستاره: ${fa(totStars(p))}\nکد: ${makeCode(p)}`;}

   <p class="j-note">${stopDone(p,i)?"این منزل تمام شده. هر وقت خواستی دوباره بازی کن.":`با گرفتن دست‌کم یک ستاره در هر ${L.main}، منزل بعدی باز می‌شود.`}</p>`,`منزل ${fa(i+1)}`,Ld.hex);
  o.querySelector("#jcx").onclick=closeOv;o.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>runMission(i,+b.dataset.m));
  o.querySelector("#jsd").onclick=()=>runSide(i);o.querySelector("#jlab").onclick=()=>{const k=missions(p,i)[0][0];const A=board(k,{mode:"lab",backLabel:"نقشه",sub:"آزمایشگاه",back:()=>jmap({})});ST[k].lab(A);window.scrollTo(0,0);};
  o.querySelector("#jdf").onclick=()=>openDef(missions(p,i)[0][0]);
  const hh=o.querySelector("#jhh");if(hh)wireHold(hh,()=>{p.home[i]=1;save();jtoast("کار خانه تأیید شد.");stopSheet(i);});o.querySelector("#jcx").focus();}
function sideSheet(i){const p=JP(),K=KID(),goal=SIDEG[trk(p)][landOf(i)];
  const o=jsheet(`<div class="shead"><div><span class="j-tag" style="background:#C98A06">${WL().side}${K?"":" · اختیاری"}</span><h2 style="color:var(--ink)">منزل ${fa(i+1)}</h2></div><button class="chip-btn" id="jcx" type="button">بستن</button></div>
   <p class="j-say">${K?`${fa(goal)} جواب درست بده. سه قلب داری؛ هر جواب غلط یک قلب کم می‌کند.`:`در چالش بی‌پایانِ «${ST[STOPS[i].side].name}» ${fa(goal)} جواب درست بده. سه جان داری و هر جواب درست چالش بعدی را کمی سخت‌تر می‌کند.`}</p>
   <p class="j-note">${p.side[i]?"این نشان را گرفته‌ای. می‌توانی دوباره بازی کنی.":"جایزه: نشان طلایی برای کوله‌پشتی. راه منزل بعد را نمی‌بندد."}</p><button class="btn go j-wide" id="jsd" type="button">${p.side[i]?"دوباره بازی کن":"شروع"}</button>`,"مأموریت جانبی","#C98A06");
  o.querySelector("#jcx").onclick=closeOv;o.querySelector("#jsd").onclick=()=>runSide(i);o.querySelector("#jsd").focus();}

/* ---------- کارت واژه و اجرای مأموریت ---------- */
function wordCard(i,then){const p=JP(),ws=WORDS[trk(p)][i],K=KID();if(!ws.length||p.words[i]){then();return;}
  const o=jsheet(`<span class="j-step" style="text-align:center">${K?"واژهٔ تازه":"کارت واژهٔ تازه"}</span>${ws.map((w,x)=>`<div class="j-word"><span class="w">${w}</span><p>${JDEF[w][K?0:1]||JDEF[w][1]}</p></div>`).join("")}<p class="j-note" style="text-align:center">این کارت در کوله‌پشتی‌ات می‌ماند.</p><button class="btn go j-wide" id="jgo2" type="button">${K?"بزن بریم":"شروع مأموریت"}</button>`,"کارت واژه","#2F6BD0");
  o.querySelector("#jgo2").onclick=()=>{p.words[i]=1;save();closeOv();then();};o.querySelector("#jgo2").focus();}
function runMission(i,j,r){const p=JP();wordCard(i,()=>{const [k,L]=missions(p,i)[j],ms=missions(p,i),before=curStop(p);
  const sub=`منزل ${fa(i+1)} · ${WL().main}${ms.length>1?" "+fa(j+1)+" از "+fa(ms.length):""}: ${mName(p,i,j)}`;
  playLevel(k,L,{sub,resume:r&&r.specs?r:null,
    keep:st=>{p.at=st.done?null:{i,j,r:{specs:st.specs,res:st.res,i:st.i}};save();},
    back:()=>jmap({msg:"هر وقت برگردی، از همین چالش ادامه می‌دهی."}),
    finish:(stars,pts,max)=>{p.at=null;save();const after=curStop(p),opened=after>before,more=j+1<ms.length&&stars>0,K=KID();
      const o=overlay(`<div class="sheet res"><h2>${stars===3?"عالی بود!":stars===2?"آفرین!":stars===1?"خوب بود!":"یک بار دیگر امتحان کن"}</h2><div class="bigst">${[1,2,3].map(x=>`<span style="--d:${x*.18}s">${starSvg(x<=stars,52)}</span>`).join("")}</div>
        ${stars?`<div class="j-part" style="text-align:right"><span class="ic" style="background:#FFF6D6"><svg viewBox="0 0 24 24" width="30" height="30">${JSTAR(true)}</svg></span><span class="tx"><span class="k">امروز یاد گرفتی</span><span class="n" style="font-size:18px">${LEARN[i][K?0:1]}</span></span></div>`:`<p class="lead">${K?"برای منزل بعد، دست‌کم یک ستاره لازم است.":"برای باز شدن منزل بعد، دست‌کم یک ستاره لازم است. بیشتر چالش‌ها را در بار اول درست جواب بده."}</p>`}
        ${opened?`<p style="font-size:20px;font-weight:700;color:#1F8A4C">${after>=12?"سفر تمام شد! همهٔ منزل‌ها را رفتی.":`منزل ${fa(after+1)} باز شد!`}</p>`:""}
        <div class="nav" style="justify-content:center;flex-direction:column"><button class="btn go" id="jn" type="button">${more?`${WL().main} بعدی: ${esc(mName(p,i,j+1))}`:stars?"برگرد به نقشه":"دوباره امتحان کن"}</button>${stars&&!more?"":`<button class="btn" id="jm" type="button">برگرد به نقشه</button>`}</div></div>`,"نتیجه",ST[k].c);
      o.querySelector("#jn").onclick=()=>{if(more)runMission(i,j+1);else if(stars)jmap({smooth:true,msg:opened?(after>=12?"سفر تمام شد! نشان‌هایت را در کوله‌پشتی ببین.":`همسفرت به منزل ${fa(after+1)} رسید!`):null});else runMission(i,j);};const jm=o.querySelector("#jm");if(jm)jm.onclick=()=>jmap({});o.querySelector("#jn").focus();if(stars>=2)confetti();}});});}
function runSide(i){const p=JP(),goal=SIDEG[trk(p)][landOf(i)],k=STOPS[i].side;closeOv();
  playEndless(k,{goal,sub:`منزل ${fa(i+1)} · ${WL().side}`,back:()=>jmap({}),
    win:()=>{p.side[i]=1;save();const o=overlay(`<div class="sheet res"><svg width="96" height="96" viewBox="0 0 32 32" style="margin-inline:auto"><rect x="8" y="8" width="16" height="16" rx="3" transform="rotate(45 16 16)" fill="#F0B429" stroke="#C98A06" stroke-width="2"/></svg><h2>نشان طلایی منزل ${fa(i+1)}!</h2><p class="lead">${fa(goal)} جواب درست دادی. نشانت در کوله‌پشتی است.</p><div class="nav" style="justify-content:center"><button class="btn go" id="jm" type="button">برگرد به نقشه</button></div></div>`,"جایزه","#C98A06");o.querySelector("#jm").onclick=()=>jmap({});o.querySelector("#jm").focus();confetti();},
    lose:right=>{const o=overlay(`<div class="sheet res"><h2>قلب‌ها تمام شد</h2><p class="lead">${fa(right)} جواب درست از ${fa(goal)}. ${KID()?"دوباره امتحان کن!":"یک بار دیگر امتحان کن؛ هر بار از اول می‌شماریم."}</p><div class="nav" style="justify-content:center"><button class="btn go" id="jr" type="button">دوباره</button><button class="btn" id="jm" type="button">برگرد به نقشه</button></div></div>`,"پایان","#C98A06");o.querySelector("#jr").onclick=()=>runSide(i);o.querySelector("#jm").onclick=()=>jmap({});o.querySelector("#jr").focus();}});}

/* ---------- کوله‌پشتی ---------- */
function backpack(tab){epoch++;closeOv();clearToasts();const p=JP();tab=tab||"b";const K=KID();
  const tabs=[["b","نشان‌ها"],["w",K?"واژه‌ها":"کارت‌های واژه"],["c","فرستادن برای معلم"]];let body="";
  if(tab==="b")body=`<div class="j-badges">${STOPS.map((S0,i)=>{const hx=LANDS[landOf(i)].hex,ok=stopDone(p,i);return `<div class="j-badge ${ok?"":"off"}"><svg viewBox="-20 -20 40 40" width="44" height="44"><circle r="18" fill="${hx}"/><g transform="scale(.9)">${stopIcon(i,"#fff")}</g></svg>${S0.n}${ok?`<span>${[0,1,2].map(x=>`<svg width="14" height="14" viewBox="0 0 24 24">${JSTAR(x<minStars(p,i))}</svg>`).join("")}</span>`:""}</div>`;}).join("")}${STOPS.map((S0,i)=>p.side[i]?`<div class="j-badge"><svg width="44" height="44" viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="16" rx="3" transform="rotate(45 16 16)" fill="#F0B429" stroke="#C98A06" stroke-width="2"/></svg>نشان طلایی ${fa(i+1)}</div>`:"").join("")}</div>`;
  if(tab==="w"){const ws=[];WORDS[trk(p)].forEach((a,i)=>{if(p.words[i])a.forEach(w=>ws.push(w));});body=ws.length?ws.map(w=>`<div class="j-word" style="text-align:right"><span class="w" style="font-size:28px">${w}</span><p>${JDEF[w][K?0:1]||JDEF[w][1]}</p></div>`).join(""):`<p class="j-say">هنوز واژه‌ای نداری. اول هر منزل یک کارت واژه می‌گیری.</p>`;}
  if(tab==="c")body=`<p class="j-say">${K?"این پیام را یک بزرگ‌تر برای معلم می‌فرستد.":"این پیام همهٔ پیشرفتت را دارد. آن را در تلگرام یا واتساپ برای معلم بفرست."}</p><textarea id="jmsg" class="j-ta" readonly aria-label="پیام برای معلم">${esc(teacherMsg(p))}</textarea><button class="btn go j-wide" id="jcp" type="button">کپی پیام</button>
    <h3 class="j-h3">پیشرفتت روی دستگاه دیگری است؟</h3><p class="j-note">پیامی را که قبلاً برای معلم فرستاده‌ای، اینجا بچسبان.</p><textarea id="jin" class="j-ta" aria-label="چسباندن پیام" style="min-height:110px"></textarea><button class="btn j-wide" id="jld" type="button">برگرداندن پیشرفت</button><p class="fb" id="jcf" aria-live="polite"></p>`;
  app.innerHTML=jtop(`<h2 class="j-h2" style="flex:1">کوله‌پشتی ${esc(p.name)}</h2>`)+`<div class="j-page"><div class="j-tabs" role="tablist">${tabs.map(([k,n])=>`<button class="chip-btn" role="tab" type="button" data-tab="${k}" aria-selected="${k===tab}">${n}</button>`).join("")}</div>${body}</div>`;
  $("#jmap").onclick=()=>jmap({});app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>backpack(b.dataset.tab));
  if(tab==="c"){$("#jcp").onclick=()=>{const t=$("#jmsg").value,ok=()=>jtoast("کپی شد. حالا در تلگرام یا واتساپ بچسبان."),fail=()=>{const ta=$("#jmsg");ta.focus();ta.select();jtoast("متن انتخاب شد؛ آن را کپی کن.");};try{navigator.clipboard.writeText(t).then(ok,fail);}catch(e){fail();}};
    $("#jld").onclick=()=>{const r=codeFromMsg($("#jin").value),f=$("#jcf");if(!r){f.className="fb no";f.textContent="در این متن کد درستی پیدا نشد. همهٔ پیام را کپی کن و دوباره بچسبان.";return;}applyCode(p,r);useProfile(p);save();applyNums();f.className="fb ok";f.textContent="پیشرفتت برگشت!";later(900,()=>jmap({scroll:true}));};}
  window.scrollTo(0,0);}

/* ---------- بزرگ‌ترها و معلم ---------- */
function adultGate(){const o=jsheet(`<div class="shead"><h2 style="color:var(--ink)">بخش بزرگ‌ترها</h2><button class="chip-btn" id="jcx" type="button">بستن</button></div><p class="j-say">این بخش برای والدین و معلم است.</p>${holdBtn("برای ورود ۲ ثانیه نگه دارید","jgh")}`,"بخش بزرگ‌ترها");o.querySelector("#jcx").onclick=closeOv;wireHold(o.querySelector("#jgh"),()=>{closeOv();adults();});}
function adults(){epoch++;closeOv();clearToasts();const p=JP(),cs=curStop(p);document.body.classList.remove("tr-a");
  const rows=STOPS.map((S0,i)=>i>cs?"":`<tr><td><b>${fa(i+1)}. ${S0.n}</b><br><span class="j-small">کار خانه: ${HOME[i]}</span></td><td>${stopDone(p,i)?[0,1,2].map(x=>`<svg width="14" height="14" viewBox="0 0 24 24">${JSTAR(x<minStars(p,i))}</svg>`).join(""):"در حال انجام"}</td><td>${p.side[i]?"دارد":"-"}</td><td><button class="btn" type="button" data-h="${i}" aria-pressed="${!!p.home[i]}" style="min-height:44px;${p.home[i]?"background:#E3F6EA":""}">${p.home[i]?"تأیید شد":"تأیید"}</button></td></tr>`).join("")+(cs<11?`<tr><td colspan="4" class="j-small">منزل‌های بعدی وقتی باز شوند، اینجا می‌آیند.</td></tr>`:"");
  app.innerHTML=jtop(`<h2 class="j-h2" style="flex:1">بزرگ‌ترها</h2>`)+`<div class="j-page">
   <section class="j-sec"><h3 class="j-h3">پیشرفت ${esc(p.name)} · پایهٔ ${GRADES[p.g]}</h3><p>الان در منزل ${fa(Math.min(12,cs+1))} از ۱۲ است و ${fa(totStars(p))} ستاره دارد. وقتی کار خانهٔ هر منزل انجام شد، آن را تأیید کنید.</p><div class="j-scroll"><table class="j-tbl"><thead><tr><th>منزل</th><th>ستاره</th><th>جانبی</th><th>کار خانه</th></tr></thead><tbody>${rows}</tbody></table></div></section>
   <section class="j-sec"><h3 class="j-h3">پایهٔ ${esc(p.name)}</h3><p>اگر پایه اشتباه انتخاب شده، اینجا درستش کنید.</p><div class="j-grid5" role="group" aria-label="پایه">${GRADES.map((g,i)=>`<button class="j-choice" type="button" data-g="${i}" aria-pressed="${p.g===i}">${g}</button>`).join("")}</div><div id="jgc"></div></section>
   <section class="j-sec"><h3 class="j-h3">کار این هفته</h3><p>معلم هر هفته می‌گوید کلاس به کدام منزل رسیده. آن را اینجا انتخاب کنید تا روی نقشه پرچم بخورد.</p><div class="j-grid6">${STOPS.map((S0,i)=>`<button class="j-choice" type="button" data-w="${i}" aria-pressed="${DB.week===i}">${fa(i+1)}</button>`).join("")}</div><button class="chip-btn" id="jnw" type="button">بدون پرچم</button></section>
   <section class="j-sec"><h3 class="j-h3">بازیکن‌های این دستگاه</h3>${DB.profiles.map(q=>`<div class="j-row"><span style="flex:1;display:flex;gap:8px;align-items:center">${travIcon(q.t,32)} ${esc(q.name)} · ${GRADES[q.g]}</span>${q.id===p.id?`<span class="j-small">(الان)</span>`:`<button class="chip-btn" type="button" data-sw="${q.id}">رفتن به این بازیکن</button>`}<button class="chip-btn" type="button" data-del="${q.id}">پاک کردن</button></div>`).join("")}<button class="chip-btn" id="jadd" type="button">+ بازیکن تازه</button><div id="jdel"></div></section>
   <section class="j-sec"><h3 class="j-h3">همهٔ ایستگاه‌ها</h3><p>همهٔ مرحله‌ها و آزمایشگاه‌ها، بیرون از ترتیب سفر.</p><button class="chip-btn" id="jall" type="button">رفتن به ایستگاه‌ها</button></section>
   <section class="j-sec"><h3 class="j-h3">صفحهٔ معلم</h3><p>پیام‌هایی را که بچه‌ها از کوله‌پشتی فرستاده‌اند، یکجا بچسبانید تا جدول کلاس ساخته شود.</p><button class="chip-btn" id="jtp" type="button">رفتن به صفحهٔ معلم</button></section></div>`;
  $("#jmap").onclick=()=>jmap({});
  app.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const i=+b.dataset.h;p.home[i]=p.home[i]?0:1;save();adults();});
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{DB.week=+b.dataset.w;save();adults();jtoast(`پرچم روی منزل ${fa(DB.week+1)} گذاشته شد.`);});
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;if(g===p.g)return;const same=trackOfG(g)===trk(p),TN={a:"کاوشگر",b:"سازنده",c:"مهندس"};
    $("#jgc").innerHTML=`<div class="j-week" style="flex-direction:column;align-items:stretch"><span>${same?`پایه از ${GRADES[p.g]} به ${GRADES[g]} عوض شود؟ مسیر بازی همان «${TN[trk(p)]}» می‌ماند و چیزی عوض نمی‌شود.`:`پایه از ${GRADES[p.g]} به ${GRADES[g]} عوض شود؟ بازی به مسیر «${TN[trackOfG(g)]}» می‌رود که مرحله‌ها و متن‌هایش فرق دارد. ستاره‌های مسیر «${TN[trk(p)]}» پاک نمی‌شوند و اگر دوباره برگردید، سر جایشان هستند.`}</span><div class="j-row"><button class="btn go" id="jgy" type="button">بله، عوض کن</button><button class="btn" id="jgn" type="button">نه</button></div></div>`;
    $("#jgn").onclick=()=>{$("#jgc").innerHTML="";};$("#jgy").onclick=()=>{p.g=g;p.S.track=trackOfG(g);p.at=null;useProfile(p);save();applyNums();adults();jtoast(`پایه شد ${GRADES[g]}.`);};$("#jgy").focus();});
  $("#jnw").onclick=()=>{DB.week=null;save();adults();};
  app.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{useProfile(DB.profiles.find(q=>q.id===b.dataset.sw));save();applyNums();jmap({scroll:true});});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const q=DB.profiles.find(x=>x.id===b.dataset.del);$("#jdel").innerHTML=`<div class="j-week" style="flex-direction:column;align-items:stretch"><span>همهٔ پیشرفت ${esc(q.name)} پاک شود؟ این کار برنمی‌گردد، مگر اینکه پیام معلمش را داشته باشید.</span><div class="j-row"><button class="btn" id="jdy" type="button" style="background:#C93B22;color:#fff">بله، پاک کن</button><button class="btn" id="jdn" type="button">نه</button></div></div>`;
    $("#jdn").onclick=()=>{$("#jdel").innerHTML="";};$("#jdy").onclick=()=>{DB.profiles=DB.profiles.filter(x=>x.id!==q.id);if(DB.cur===q.id)useProfile(DB.profiles[0]||null);save();if(!DB.profiles.length)welcome();else adults();};});
  $("#jadd").onclick=()=>welcome(true);$("#jall").onclick=()=>{applyNums();home();};$("#jtp").onclick=teacherPage;window.scrollTo(0,0);}
function teacherPage(){epoch++;closeOv();clearToasts();document.body.classList.remove("tr-a");
  app.innerHTML=jtop(`<h2 class="j-h2" style="flex:1">صفحهٔ معلم</h2>`)+`<div class="j-page"><p>پیام‌های بچه‌ها را از تلگرام یا واتساپ کپی کنید و همه را با هم اینجا بچسبانید. جدول، کسانی را که عقب‌ترند اول نشان می‌دهد.</p><textarea id="jta" class="j-ta" aria-label="پیام‌های بچه‌ها" style="min-height:160px"></textarea><div class="j-row"><button class="btn go" id="jmk" type="button">ساختن جدول</button></div><div id="jout"></div></div>`;
  $("#jmap").onclick=()=>{if(JP())jmap({});else startApp();};
  $("#jmk").onclick=()=>{const txt=$("#jta").value,re=/نام\s*:\s*([^\n]+)[\s\S]*?کد\s*:\s*([^\n]+)/g;let m,rows=[],bad=0;
    while((m=re.exec(txt))){const r=readCode(m[2]);if(!r){bad++;continue;}const q=newProfile(m[1].trim(),r.g,r.t);applyCode(q,r);const cs=curStop(q);
      rows.push({name:m[1].trim(),g:r.g,cs,stars:totStars(q),home:r.home.filter(Boolean).length,side:r.side.filter(Boolean).length,per:STOPS.map((_,i)=>i<cs?minStars(q,i):null)});}
    rows.sort((a,b)=>a.cs-b.cs);
    $("#jout").innerHTML=rows.length?`<div class="j-scroll"><table class="j-tbl"><thead><tr><th>نام</th><th>پایه</th><th>منزل</th><th>ستاره</th><th>کار خانه</th><th>جانبی</th><th>منزل‌های کم‌ستاره</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${GRADES[r.g]}</td><td>${r.cs>=12?"تمام":fa(r.cs+1)}</td><td>${fa(r.stars)}</td><td>${fa(r.home)}</td><td>${fa(r.side)}</td><td>${r.per.map((v,i)=>v===1?fa(i+1):null).filter(Boolean).join("، ")||"-"}</td></tr>`).join("")}</tbody></table></div>${bad?`<p class="fb no">${fa(bad)} پیام خوانده نشد؛ احتمالاً کامل کپی نشده است.</p>`:""}`:`<p class="fb no">پیام درستی پیدا نشد. هر پیام باید «نام:» و «کد:» داشته باشد.</p>`;};
  window.scrollTo(0,0);}

if(window.__JT)window.__J={curP,missions,mStars,curStop,levelsOf,closeOv};
startApp();

})();
</script>
</body></html>
